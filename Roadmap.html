<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap | DouweDoesDesign</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #050505;
            --accent-color: #ffffff;
            --dim-color: #444444;
            --wip-stripe: #1a1a1a;
            --node-width: 180px; /* Slightly wider for the text */
            --node-height: 60px;
            --green: #0f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        /* --- BACKGROUND PATTERN --- */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--dim-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        /* --- INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s ease;
        }
        .intro-text {
            font-size: 1.5rem;
            letter-spacing: 5px;
            animation: blink 0.2s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- UI LAYER --- */
        .ui-layer {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            width: 100%; height: 100%;
        }

        .back-btn {
            pointer-events: auto;
            position: absolute;
            top: 30px; left: 30px;
            text-decoration: none;
            border: 1px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .back-btn:hover { background-color: var(--accent-color); color: var(--bg-color); }

        .header-title {
            position: absolute;
            top: 30px; right: 40px;
            text-align: right;
        }
        .header-title h1 { font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .header-title p { font-size: 0.8rem; color: #888; }

        /* --- DATABASE LOG (BOTTOM LEFT) --- */
        .db-console {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 350px;
            font-size: 10px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .db-console:hover { opacity: 1; }

        .db-header {
            color: #888;
            border-bottom: 1px dashed #444;
            padding-bottom: 5px;
            margin-bottom: 5px;
            text-transform: uppercase;
            display: flex; justify-content: space-between;
        }
        .db-log {
            height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse; /* Newest at bottom visually */
            gap: 4px;
            mask-image: linear-gradient(to bottom, transparent, black 20%);
        }
        .log-entry { color: #666; animation: slideIn 0.3s forwards; }
        .log-entry.new { color: var(--accent-color); text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .log-entry span { color: #444; margin-right: 5px; }
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- LEGEND & REQUEST BTN (BOTTOM RIGHT) --- */
        .bottom-right-ui {
            position: absolute;
            bottom: 30px; right: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            pointer-events: auto;
        }

        .btn-request {
            background: var(--bg-color);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 15px;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px rgba(255,255,255,0.2);
        }
        .btn-request:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(255,255,255,0.4);
        }

        .legend {
            display: flex; gap: 20px;
            font-size: 12px; color: #888;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border: 1px solid var(--accent-color); }
        .dot.done { background: var(--accent-color); }
        .dot.wip { background: repeating-linear-gradient(45deg, var(--bg-color), var(--bg-color) 2px, var(--dim-color) 2px, var(--dim-color) 4px); }

        /* --- CANVAS --- */
        #viewport {
            width: 100%; height: 100%;
            overflow: hidden;
            cursor: grab;
        }
        #viewport:active { cursor: grabbing; }

        #roadmap-container {
            position: absolute;
            top: 0; left: 0;
            width: 2500px; height: 1500px;
            transform-origin: 0 0;
            transition: transform 0.1s cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }

        svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        path {
            fill: none;
            stroke: var(--dim-color);
            stroke-width: 2;
            stroke-dasharray: 6 6; 
            opacity: 0; 
            transition: opacity 0.5s;
        }
        
        path.visible { opacity: 1; animation: flow 1s linear infinite; }
        path.active-path { stroke: var(--accent-color); }

        @keyframes flow {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        /* --- NODES --- */
        .node {
            position: absolute;
            width: var(--node-width);
            height: var(--node-height);
            border: 1px solid var(--accent-color);
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            padding: 5px;
            z-index: 2;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            opacity: 0; transform: scale(0); /* Intro state */
        }

        .node.visible { opacity: 1; transform: scale(1); }

        .node[data-status="done"] { background-color: var(--accent-color); color: var(--bg-color); }
        .node[data-status="wip"] {
            background: repeating-linear-gradient(45deg, var(--bg-color), var(--bg-color) 5px, var(--wip-stripe) 5px, var(--wip-stripe) 10px);
            border: 2px solid var(--accent-color);
            animation: pulseBorder 2s infinite;
        }
        .node[data-status="todo"] { border: 1px dashed var(--dim-color); color: #888; }
        .node.locked { border-color: var(--green); box-shadow: 0 0 15px rgba(0,255,0,0.3); z-index: 20; }

        @keyframes pulseBorder {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); border-color: white; }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); border-color: white;}
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); border-color: #888; }
        }

        .node-vote-badge {
            position: absolute; top: -10px; right: -10px;
            background: #000; border: 1px solid var(--accent-color); color: var(--accent-color);
            font-size: 9px; padding: 2px 5px; border-radius: 50%; min-width: 20px; text-align: center;
        }
        .node[data-status="done"] .node-vote-badge { background: var(--bg-color); color: var(--accent-color); border-color: var(--bg-color); }

        /* --- TOOLTIP --- */
        .tooltip {
            position: fixed;
            width: 300px;
            background: rgba(0,0,0,0.95);
            border: 1px solid var(--accent-color);
            padding: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 20px 50px rgba(0,0,0,1);
            pointer-events: none; 
        }

        .tooltip.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .tt-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed var(--dim-color); padding-bottom: 10px; margin-bottom: 10px; }
        .tt-title { font-size: 14px; text-transform: uppercase; font-weight: bold; }
        .tt-close { display: none; cursor: pointer; font-weight: bold; color: var(--dim-color); }
        .tooltip.locked .tt-close { display: block; }
        .tt-desc { font-size: 12px; line-height: 1.5; color: #ccc; margin-bottom: 20px; }
        .tt-vote-btn { background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 8px 16px; font-family: inherit; font-size: 11px; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.2s;}
        .tt-vote-btn:hover, .tt-vote-btn.voted { background: var(--accent-color); color: var(--bg-color); }

        /* --- REQUEST MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 5000;
            display: none;
            justify-content: center; align-items: center;
        }
        .modal-box {
            background: #000; border: 2px solid var(--accent-color);
            width: 400px; padding: 30px;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 15px;
        }
        .modal-header { font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .modal-close { cursor: pointer; }
        
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 10px; color: #888; text-transform: uppercase; }
        .input-group input, .input-group textarea {
            background: #111; border: 1px solid #333; color: white;
            padding: 10px; font-family: inherit; font-size: 12px; outline: none;
        }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--accent-color); }
        
        .btn-send {
            background: var(--accent-color); color: var(--bg-color); border: none;
            padding: 12px; font-family: inherit; font-weight: bold; text-transform: uppercase;
            cursor: pointer; margin-top: 10px;
        }
        .btn-send:hover { opacity: 0.8; }
        .success-msg { text-align: center; display: none; color: #fff; padding: 20px 0; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div id="intro-overlay">
        <div class="intro-text">INITIALIZING SYSTEM...</div>
    </div>

    <div class="ui-layer">
        <a href="index.html" class="back-btn">← Back</a>
        
        <div class="db-console">
            <div class="db-header">
                <span>Server Log</span>
                <span id="db-status" style="color:#0f0">ONLINE</span>
            </div>
            <div class="db-log" id="db-log-container">
                </div>
        </div>

        <div class="header-title">
            <h1>Roadmap</h1>
            <p>Scroll to Zoom • Drag to Move • Click to Lock</p>
        </div>
        
        <div class="bottom-right-ui">
            <button class="btn-request" onclick="openRequestModal()">+ Request Feature</button>
            <div class="legend">
                <div class="legend-item"><div class="dot done"></div> COMPLETED</div>
                <div class="legend-item"><div class="dot wip"></div> IN PROGRESS</div>
                <div class="legend-item"><div class="dot"></div> PLANNED</div>
            </div>
        </div>
    </div>

    <div id="viewport">
        <div id="roadmap-container">
            <svg id="connections"></svg>
            </div>
    </div>

    <div id="tooltip" class="tooltip">
        <div class="tt-header">
            <span class="tt-title" id="tt-title">Title</span>
            <span class="tt-close" onclick="closeTooltip()">[CLOSE]</span>
        </div>
        <p class="tt-desc" id="tt-desc">Description goes here.</p>
        <div class="tt-vote-area" id="tt-vote-area">
            <button class="tt-vote-btn" id="tt-btn" onclick="handleVote()">▲ Vote for this Feature</button>
        </div>
    </div>

    <div id="request-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-form-content">
                <div class="modal-header">
                    <span>REQUEST FEATURE</span>
                    <span class="modal-close" onclick="closeRequestModal()">×</span>
                </div>
                <div class="input-group">
                    <label>Feature Description</label>
                    <textarea id="req-feature" rows="4" placeholder="Describe what you want..."></textarea>
                </div>
                <div class="input-group">
                    <label>Your Name</label>
                    <input type="text" id="req-name" placeholder="Name or Alias">
                </div>
                <div class="input-group">
                    <label>Contact Email (Private)</label>
                    <input type="email" id="req-email" placeholder="For updates...">
                </div>
                <button class="btn-send" onclick="submitFeature()">Submit to Server</button>
            </div>
            
            <div id="modal-success" class="success-msg">
                <h3 style="color:var(--green); margin-bottom:10px;">DATA SENT</h3>
                <p>Request logged to backend database.</p>
                <button class="btn-request" style="margin-top: 20px;" onclick="closeRequestModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const REQUESTS_API_URL = 'https://sheetdb.io/api/v1/3f9o5w8ml9b71';
        const VOTES_API_URL = 'https://sheetdb.io/api/v1/6nmccth1eiq5p';

        // --- ROADMAP DATA (Matching your Image) ---
        const nodes = [
            // Row 1
            { id: 1, text: "Cost Calculator", x: 50, y: 100, status: 'done', desc: "Finalize the monthly cost calculator." },
            { id: 2, text: "Size Filter", x: 280, y: 100, status: 'done', desc: "Finalize the company size filter." },
            { id: 3, text: "Combined Filter", x: 510, y: 100, status: 'done', desc: "Create a combined filter system." },
            { id: 4, text: "Login System", x: 740, y: 100, status: 'wip', desc: "Create a 'login & account' system." },
            
            // Login Branches
            { id: 5, text: "Privacy Policy", x: 980, y: 20, status: 'wip', desc: "Make the 'login & account' conform to European privacy policy." },
            { id: 6, text: "Save Workflows", x: 980, y: 90, status: 'todo', desc: "Allow users to 'Save workflows'." },
            { id: 7, text: "Fav Tools", x: 980, y: 160, status: 'todo', desc: "Allow users to 'Save favourite tools'." },
            { id: 8, text: "Subscribe", x: 980, y: 230, status: 'todo', desc: "Subscribe to certain tool types for alerts." },
            
            { id: 19, text: "Smartphone App", x: 1050, y: -80, status: 'todo', desc: "Create an 'app' for smartphones with AI news updates." },

            // Row 2
            { id: 9, text: "Reformat DB", x: 50, y: 400, status: 'done', desc: "Reformat the ai-database and automize the updating." },
            { id: 10, text: "Benchmarks", x: 50, y: 500, status: 'wip', desc: "Write proper benchmarks for the tools." },
            { id: 11, text: "Reviews", x: 300, y: 450, status: 'wip', desc: "Write reviews & correct descriptions of the shown tools." },
            { id: 12, text: "Tool Tutorials", x: 550, y: 450, status: 'todo', desc: "Create tool-tutorial pages for good tools." },
            { id: 13, text: "ComfyUI Export", x: 800, y: 450, status: 'todo', desc: "Export workflows to ComfyUI." },

            // Row 3
            { id: 14, text: "Limitations", x: 50, y: 700, status: 'done', desc: "Finalize the ai-limitations page." },
            { id: 15, text: "Auto-Limits", x: 280, y: 700, status: 'todo', desc: "Automize the ai-limitations page." },
            { id: 16, text: "Material DB", x: 550, y: 700, status: 'todo', desc: "Create access to AI-created material database & request system." },
            { id: 17, text: "LLM Access", x: 850, y: 700, status: 'todo', desc: "Create LLM access to direct request materials." },
            { id: 18, text: "Playgrounds", x: 550, y: 850, status: 'todo', desc: "Add more 'ai-powered playgrounds'." },

            // Rebrand Branch (Connected from Login flow in image)
            { id: 24, text: "Rebrand", x: 1000, y: 400, status: 'wip', desc: "Rebrand the platform." },
            { id: 25, text: "Persona CV", x: 1250, y: 350, status: 'todo', desc: "Add a persona CV." },
            { id: 26, text: "Terms (AV)", x: 1250, y: 420, status: 'todo', desc: "Add a 'Algemene Voorwaarden'." },
            { id: 27, text: "Portfolio", x: 1250, y: 490, status: 'todo', desc: "Add a persona Portfolio." },
        ];

        // Connections based on your flowchart image
        const connections = [
            { from: 1, to: 2 }, { from: 2, to: 3 }, { from: 3, to: 4 },
            { from: 4, to: 5 }, { from: 4, to: 6 }, { from: 4, to: 7 }, { from: 4, to: 8 },
            { from: 4, to: 19 }, // Login -> App
            { from: 4, to: 24, curve: true }, // Login -> Rebrand (Long curve)
            
            { from: 9, to: 11 }, { from: 10, to: 11 },
            { from: 11, to: 12 }, { from: 12, to: 13 },
            
            { from: 14, to: 15 }, { from: 15, to: 16 }, { from: 16, to: 17 },
            { from: 16, to: 18 }, // Material DB -> Playgrounds
            
            { from: 24, to: 25 }, { from: 24, to: 26 }, { from: 24, to: 27 }
        ];

        // --- SETUP ---
        const container = document.getElementById('roadmap-container');
        const viewport = document.getElementById('viewport');
        const svg = document.getElementById('connections');
        const tooltip = document.getElementById('tooltip');
        
        let state = {
            scale: 1,
            panning: false,
            startX: 0, startY: 0, translateX: 0, translateY: 0,
            lockedNodeId: null
        };

        // --- DB LOG LOGIC ---
        function addLogEntry(user, text, isNew) {
            const container = document.getElementById('db-log-container');
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
            div.className = isNew ? 'log-entry new' : 'log-entry';
            div.innerHTML = `<span>[${time}]</span> <strong>${user}:</strong> ${text}`;
            container.insertBefore(div, container.firstChild);
        }

        // --- GLOBAL VOTING SYSTEM ---
        function fetchGlobalVotes() {
            // Target the 'votes' sheet. Assumes columns: node_id, count
            fetch(`${VOTES_API_URL}?sheet=votes`)
            .then(response => response.json())
            .then(data => {
                data.forEach(row => {
                    const badge = document.getElementById(`badge-${row.node_id}`);
                    if(badge) {
                        badge.innerText = row.count;
                        badge.dataset.serverCount = row.count;
                    }
                });
                addLogEntry("SYSTEM", "Vote counts synced.", false);
            })
            .catch(err => {
                console.error(err);
                addLogEntry("SYSTEM", "WARN: Could not sync votes.", false);
            });
        }

        function handleVote() {
            const id = document.getElementById('tooltip').dataset.activeId;
            if(!id) return;

            // Check Local Storage (Prevent double vote)
            const localVotes = JSON.parse(localStorage.getItem('ddd_roadmap_votes_v2')) || {};
            if (localVotes[id]) {
                alert("You have already voted for this feature.");
                return;
            }

            // Optimistic UI Update
            const btn = document.getElementById('tt-btn');
            const badge = document.getElementById(`badge-${id}`);
            
            localVotes[id] = true;
            localStorage.setItem('ddd_roadmap_votes_v2', JSON.stringify(localVotes));
            
            btn.innerText = "✓ Voted"; 
            btn.classList.add('voted');

            let currentCount = parseInt(badge.dataset.serverCount || badge.innerText || 0);
            let newCount = currentCount + 1;
            badge.innerText = newCount;
            badge.dataset.serverCount = newCount;

            addLogEntry("YOU", `VOTED: Node ${id}`, true);

            // Send PATCH to Server
            // Assumes your sheet has a column 'node_id' used as key, or we target by index.
            // SheetDB search & update: /node_id/{value}
            fetch(`${VOTES_API_URL}/node_id/${id}?sheet=votes`, {
                method: 'PATCH',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    data: { count: newCount }
                })
            })
            .then(res => res.json())
            .then(data => console.log("Vote saved"))
            .catch(err => console.error("Vote save failed", err));
        }


        // --- INITIALIZATION ---
        (function init() {
            addLogEntry("SYSTEM", "Initializing Connection...", false);

            // 1. Render Nodes
            nodes.forEach(node => {
                const el = document.createElement('div');
                el.className = 'node';
                el.id = `node-${node.id}`;
                el.dataset.id = node.id;
                el.dataset.status = node.status;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                el.innerText = node.text;

                // Vote Badge
                const badge = document.createElement('div');
                badge.className = 'node-vote-badge';
                badge.id = `badge-${node.id}`;
                badge.innerText = "0";
                if(node.status !== 'done') el.appendChild(badge);

                // Events
                el.addEventListener('mouseenter', (e) => { if(!state.lockedNodeId) showTooltip(e, node); });
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    state.lockedNodeId = node.id;
                    document.querySelectorAll('.node').forEach(n => n.classList.remove('locked'));
                    el.classList.add('locked');
                    showTooltip(e, node, true);
                });

                container.appendChild(el);
            });

            // 2. Render Connections
            connections.forEach((conn) => {
                const n1 = nodes.find(n => n.id === conn.from);
                const n2 = nodes.find(n => n.id === conn.to);
                if(!n1 || !n2) return;
                
                const x1 = n1.x + 180; // node width
                const y1 = n1.y + 30;  // half height
                const x2 = n2.x; 
                const y2 = n2.y + 30;
                
                const cp1X = x1 + (x2 - x1) / 2;
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                // Simple curve logic
                let d = `M ${x1} ${y1} C ${cp1X} ${y1}, ${cp1X} ${y2}, ${x2} ${y2}`;
                
                if(conn.curve) {
                     // Deeper curve for Login -> Rebrand
                     d = `M ${x1} ${y1} C ${x1+200} ${y1}, ${x2-200} ${y2}, ${x2} ${y2}`;
                }

                path.setAttribute("d", d);
                path.id = `path-${n1.id}-${n2.id}`;
                if(n1.status === 'done' || n1.status === 'wip') path.classList.add('active-path');
                svg.appendChild(path);
            });

            // 3. Sync Votes
            fetchGlobalVotes();

            // 4. Run Intro Animation
            setTimeout(() => {
                document.getElementById('intro-overlay').style.opacity = 0;
                setTimeout(() => document.getElementById('intro-overlay').style.display = 'none', 1000);
                
                // Staggered reveal
                nodes.sort((a,b) => a.x - b.x).forEach((node, i) => {
                    setTimeout(() => {
                        const el = document.getElementById(`node-${node.id}`);
                        if(el) el.classList.add('visible');
                        
                        // Show connected paths
                        connections.filter(c => c.from === node.id).forEach(c => {
                            const p = document.getElementById(`path-${c.from}-${c.to}`);
                            if(p) p.classList.add('visible');
                        });
                    }, i * 50); 
                });
            }, 1000);

        })();

        // --- INTERACTION HANDLERS ---
        function updateTransform() { container.style.transform = `translate(${state.translateX}px, ${state.translateY}px) scale(${state.scale})`; }
        
        viewport.addEventListener('mousedown', (e) => { 
            state.panning = true; 
            state.startX = e.clientX - state.translateX; 
            state.startY = e.clientY - state.translateY; 
        });
        window.addEventListener('mouseup', () => state.panning = false);
        window.addEventListener('mousemove', (e) => { 
            if (!state.panning) return; 
            e.preventDefault(); 
            state.translateX = e.clientX - state.startX; 
            state.translateY = e.clientY - state.startY; 
            updateTransform(); 
        });
        
        viewport.addEventListener('wheel', (e) => { 
            e.preventDefault(); 
            const scaleAmount = -e.deltaY * 0.001; 
            state.scale = Math.min(Math.max(0.4, state.scale + scaleAmount), 2); 
            updateTransform(); 
        });

        viewport.addEventListener('click', (e) => {
            if(!e.target.closest('.node') && !e.target.closest('.tooltip')) closeTooltip();
        });

        // --- TOOLTIP ---
        function showTooltip(e, node, isLocked = false) {
             const tt = document.getElementById('tooltip');
             document.getElementById('tt-title').innerText = node.text;
             document.getElementById('tt-desc').innerText = node.desc;
             
             const el = document.getElementById(`node-${node.id}`);
             const rect = el.getBoundingClientRect();
             
             tt.style.left = (rect.right + 20) + 'px'; 
             tt.style.top = (rect.top) + 'px';
             tt.classList.add('active');
             if(isLocked) tt.classList.add('locked'); else tt.classList.remove('locked');
             tt.dataset.activeId = node.id;
             
             const btn = document.getElementById('tt-btn');
             const area = document.getElementById('tt-vote-area');
             
             if(node.status === 'done') {
                 area.style.display = 'none';
             } else {
                 area.style.display = 'block';
                 const votes = JSON.parse(localStorage.getItem('ddd_roadmap_votes_v2')) || {};
                 if(votes[node.id]) { btn.innerText = "✓ Voted"; btn.classList.add('voted'); }
                 else { btn.innerText = "▲ Vote for this Feature"; btn.classList.remove('voted'); }
             }
        }

        function closeTooltip() {
            state.lockedNodeId = null;
            document.querySelectorAll('.node').forEach(n => n.classList.remove('locked'));
            document.getElementById('tooltip').classList.remove('active', 'locked');
        }

        // --- REQUEST MODAL HANDLERS ---
        function openRequestModal() { document.getElementById('request-modal').style.display = 'flex'; document.getElementById('modal-form-content').style.display = 'block'; document.getElementById('modal-success').style.display = 'none'; }
        function closeRequestModal() { document.getElementById('request-modal').style.display = 'none'; }
        
        function submitFeature() {
            const feature = document.getElementById('req-feature').value;
            const name = document.getElementById('req-name').value || "Guest";
            const email = document.getElementById('req-email').value || "Not provided";
            const btn = document.querySelector('.btn-send');
            
            if(!feature) { alert("Please enter a feature description."); return; }

            const originalText = btn.innerText;
            btn.innerText = "UPLOADING...";
            btn.style.opacity = "0.5";
            btn.disabled = true;

            addLogEntry(name, `SENDING: "${feature.substring(0, 15)}..."`, true);

            const data = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                name: name,
                feature: feature,
                email: email
            };

            fetch(REQUESTS_API_URL, {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: data })
            })
            .then(res => res.json())
            .then(d => {
                addLogEntry("SYSTEM", "200 OK: Saved to Backend.", false);
                document.getElementById('modal-form-content').style.display = 'none';
                document.getElementById('modal-success').style.display = 'block';
                document.getElementById('req-feature').value = "";
                document.getElementById('req-email').value = "";
                btn.innerText = originalText;
                btn.style.opacity = "1";
                btn.disabled = false;
            })
            .catch(err => {
                console.error(err);
                alert("Connection failed.");
                addLogEntry("SYSTEM", "ERROR: Connection Timeout.", false);
                btn.innerText = originalText;
                btn.style.opacity = "1";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
