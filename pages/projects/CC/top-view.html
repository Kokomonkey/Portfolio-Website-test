// ── State ─────────────────────────────────────────────────────────────────────
let W, H;
let mouse       = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let polygons    = [];
let wallSegs    = [];   // [[x1,y1],[x2,y2]] edges incl. bounding box
let svgT        = { sc: 1, ox: 0, oy: 0 };  // SVG → canvas transform

// Mouse light
let isCone     = false;
let isFlicker  = true;
let showGhost  = true;
let colorIndex = 0;
let targetR    = 270, lightR = 270;
let coneDir    = 0, targetConeDir = 0;

// Fixed lights  { x,y, svgX,svgY, colorIndex, radius, visPoly }

// Path  { x,y, svgX,svgY }
let waypoints       = [];
let isRecording     = false;
let pathPlaying     = false;
let pathT           = 0;
let pathLightPos    = null;
let pathConeDir     = 0;
let pathSpeed       = 0.015;

// Particles
const N_PARTS = 65;
let parts = [];

// Colour modes
const MODES = [
    { name:'WARM',  inner:'rgba(255,255,215,0.96)', mid:'rgba(255,215,100,0.78)', outer:'rgba(0,0,0,0)' },
    { name:'COOL',  inner:'rgba(215,238,255,0.96)', mid:'rgba(95,180,255,0.72)',  outer:'rgba(0,0,0,0)' },
    { name:'RED',   inner:'rgba(255,195,165,0.96)', mid:'rgba(255,45,10,0.78)',   outer:'rgba(0,0,0,0)' },

];

// DOM
const coneBtn   = document.getElementById('cone-btn');
const colorBtn  = document.getElementById('color-btn');
const flickBtn  = document.getElementById('flicker-btn');
const ghostBtn  = document.getElementById('ghost-btn');
const lightBtn   = document.getElementById('light-btn');
const recBtn     = document.getElementById('rec-btn');
const playBtn    = document.getElementById('play-btn');
const loopBtn    = document.getElementById('loop-btn');
const clearBtn   = document.getElementById('clear-btn');
const speedSlider = document.getElementById('speed-slider');
const speedDots  = document.getElementById('speed-dots');

// ── SVG path parser ───────────────────────────────────────────────────────────
function parsePath(d) {
    const pts  = [];
    const segs = d.trim().match(/[MLCZz][^MLCZz]*/g);
    if (!segs) return pts;
    for (const seg of segs) {
        const cmd  = seg[0];
        if (cmd === 'Z' || cmd === 'z') continue;
        const rest = seg.slice(1).trim();
        if (!rest) continue;
        const n = rest.split(/[\s,]+/).filter(s => s !== '' && isFinite(+s)).map(Number);
        if (cmd === 'M' || cmd === 'L') {
            for (let i = 0; i + 1 < n.length; i += 2) pts.push([n[i], n[i+1]]);
        } else if (cmd === 'C') {
            for (let i = 0; i + 5 < n.length; i += 6) pts.push([n[i+4], n[i+5]]);
            const r = n.length % 6;
            if (r >= 2) pts.push([n[n.length-2], n[n.length-1]]);
        }
    }
    return pts;
}

// ── Geometry setup ────────────────────────────────────────────────────────────
function buildPolygons() {
    const raw = SVG_PATHS.map(parsePath).filter(p => p.length >= 3);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of raw) for (const [x, y] of p) {
        if (x < x0) x0=x; if (x > x1) x1=x;
        if (y < y0) y0=y; if (y > y1) y1=y;
    }
    const pad = Math.min(W, H) * 0.09;
    const sc  = Math.min((W - 2*pad) / (x1-x0), (H - 2*pad) / (y1-y0));
    const ox  = (W - (x1-x0)*sc) / 2 - x0*sc;
    const oy  = (H - (y1-y0)*sc) / 2 - y0*sc;
    svgT = { sc, ox, oy };
    polygons = raw.map(p => p.map(([x, y]) => [x*sc+ox, y*sc+oy]));
}

function buildWallSegs() {
    wallSegs = [];
    for (const poly of polygons) {
        const n = poly.length;
        for (let i = 0; i < n; i++) wallSegs.push([poly[i], poly[(i+1)%n]]);
    }
    const m = 1;
    wallSegs.push([[m,m],[W-m,m]], [[W-m,m],[W-m,H-m]],
                  [[W-m,H-m],[m,H-m]], [[m,H-m],[m,m]]);
}

// ── Coordinate utils ──────────────────────────────────────────────────────────
function toSvg(px, py)   { return [(px-svgT.ox)/svgT.sc, (py-svgT.oy)/svgT.sc]; }
function toScreen(sx,sy) { return [sx*svgT.sc+svgT.ox,   sy*svgT.sc+svgT.oy]; }

// ── True visibility polygon ───────────────────────────────────────────────────
function raySeg(ox, oy, dx, dy, ax, ay, bx, by) {
    const ex = bx-ax, ey = by-ay;
    const d  = dx*ey - dy*ex;
    if (Math.abs(d) < 1e-12) return Infinity;
    const t = ((ax-ox)*ey - (ay-oy)*ex) / d;
    const u = ((ax-ox)*dy  - (ay-oy)*dx) / d;
    return (t >= 0 && u >= 0 && u <= 1) ? t : Infinity;
}

function visPoly(lx, ly) {
    const EPS = 0.0001, angles = [];
    for (const [[ax,ay],[bx,by]] of wallSegs) {
        const a1 = Math.atan2(ay-ly, ax-lx);
        const a2 = Math.atan2(by-ly, bx-lx);
        angles.push(a1-EPS, a1, a1+EPS, a2-EPS, a2, a2+EPS);
    }
    const pts = [];
    for (const ang of angles) {
        const dx = Math.cos(ang), dy = Math.sin(ang);
        let minT = Infinity;
        for (const [[ax,ay],[bx,by]] of wallSegs) {
            const t = raySeg(lx, ly, dx, dy, ax, ay, bx, by);
            if (t < minT) minT = t;
        }
        if (isFinite(minT)) pts.push({ a: ang, x: lx + dx*minT, y: ly + dy*minT });
    }
    pts.sort((a, b) => a.a - b.a);
    return pts;
}

// ── Draw one light from its visibility polygon ────────────────────────────────
function drawLight(lx, ly, r, mode, vp, useCone, cDir) {
    if (vp.length < 3) return;
    ctx.save();

    ctx.beginPath();
    ctx.moveTo(vp[0].x, vp[0].y);
    for (let i = 1; i < vp.length; i++) ctx.lineTo(vp[i].x, vp[i].y);
    ctx.closePath();
    ctx.clip();

    if (useCone) {
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.arc(lx, ly, r * 3, cDir - Math.PI*0.38, cDir + Math.PI*0.38);
        ctx.closePath();
        ctx.clip();
    }

    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, r);
    g.addColorStop(0,    mode.inner);
    g.addColorStop(0.22, mode.mid);
    g.addColorStop(0.82, mode.outer);
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
}

// ── Catmull-Rom path ──────────────────────────────────────────────────────────
function catmull(p0, p1, p2, p3, t) {
    const t2 = t*t, t3 = t*t*t;
    return {
        x: 0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y: 0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
    };
}

function pathPos(t) {
    const n = waypoints.length;
    if (n < 2) return null;
    t = Math.max(0, Math.min(n - 1.0001, t));
    const i = Math.floor(t), u = t - i;
    return catmull(
        waypoints[Math.max(0, i-1)],
        waypoints[i],
        waypoints[Math.min(n-1, i+1)],
        waypoints[Math.min(n-1, i+2)],
        u
    );
}

// ── Particles ─────────────────────────────────────────────────────────────────
function spawnParts() {
    parts = Array.from({ length: N_PARTS }, () => ({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
        sz: Math.random()*1.5+0.3, life: Math.random()
    }));
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function fillPoly(poly) {
    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
    ctx.closePath(); ctx.fill();
}
function strokePoly(poly) {
    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
    ctx.closePath(); ctx.stroke();
}

// ── Draw overlays ─────────────────────────────────────────────────────────────
function drawPathOverlay() {
    if (waypoints.length === 0) return;
    const n = waypoints.length;

    if (n >= 2) {
        ctx.save();
        ctx.strokeStyle = isRecording ? 'rgba(255,90,0,0.7)' : 'rgba(255,150,0,0.5)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 8]);
        ctx.beginPath();
        const steps = n * 50;
        for (let i = 0; i <= steps; i++) {
            const p = pathPos((i / steps) * (n - 1));
            if (!p) continue;
            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }

    waypoints.forEach((wp, idx) => {
        ctx.beginPath();
        ctx.arc(wp.x, wp.y, 6, 0, Math.PI*2);
        ctx.fillStyle = isRecording ? 'rgba(255,80,0,0.92)' : 'rgba(255,155,0,0.8)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 9px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(idx + 1, wp.x, wp.y);
    });

    if (pathLightPos && pathPlaying) {
        ctx.beginPath();
        ctx.arc(pathLightPos.x, pathLightPos.y, 4.5, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,210,60,1)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    if (isRecording) {
        ctx.fillStyle = 'rgba(255,30,30,0.88)';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('● REC', 12, H - 28);
    }
}

function drawLightIndicators() {
    for (const fl of fixedLights) {
        const m = MODES[fl.colorIndex];
        ctx.beginPath();
        ctx.arc(fl.x, fl.y, 7, 0, Math.PI*2);
        ctx.strokeStyle = m.mid.replace(/[\d.]+\)$/, '0.88)');
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(fl.x-5,fl.y); ctx.lineTo(fl.x+5,fl.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fl.x,fl.y-5); ctx.lineTo(fl.x,fl.y+5); ctx.stroke();
    }
}

// ── Main animation loop ───────────────────────────────────────────────────────
function animate() {
    requestAnimationFrame(animate);

    // Update path light
    if (pathPlaying && waypoints.length >= 2) {
        const maxT = waypoints.length - 1;
        if (pathLoop) {
            pathT = (pathT + pathSpeed) % maxT;
        } else {
            pathT += pathSpeed;
            if (pathT >= maxT) {
                pathT = 0;
                pathPlaying = false;
                pathLightPos = null;
                playBtn.classList.remove('on');
                playBtn.textContent = '▶ PLAY';
            }
        }
        const p0 = pathPos(pathT);
        const p1 = pathPos(Math.min(maxT, pathT + 0.06));
        if (p0) {
            pathLightPos = p0;
            if (p1) pathConeDir = Math.atan2(p1.y - p0.y, p1.x - p0.x);
        }
    } else if (!pathPlaying) {
        pathLightPos = null;
    }

    // Smooth params
    lightR  += (targetR - lightR) * 0.09;
    coneDir += (targetConeDir - coneDir) * 0.13;

    const breathe = Math.sin(Date.now() * 0.0028) * 0.025;
    const snap    = isFlicker ? (Math.random() - 0.5) * 0.036 : 0;
    const r       = lightR * (1 + breathe + snap);
    const mode    = MODES[colorIndex];
    const mx = mouse.x, my = mouse.y;

    // ── Dark fill (opaque so body grid doesn't bleed into shadows) ───────────
    ctx.fillStyle = 'rgba(3,3,10,1)';
    ctx.fillRect(0, 0, W, H);

    // ── Ghost plan ────────────────────────────────────────────────────────────
    if (showGhost) {
        ctx.save();
        ctx.globalAlpha = 0.05;
        ctx.strokeStyle = '#6688dd';
        ctx.lineWidth   = 0.8;
        for (const poly of polygons) strokePoly(poly);
        ctx.restore();
    }

    // ── All lights via visibility polygon + screen blend ──────────────────────
    ctx.globalCompositeOperation = 'screen';

    drawLight(mx, my, r, mode, visPoly(mx, my), isCone, coneDir);

    for (const fl of fixedLights) {
        drawLight(fl.x, fl.y, fl.radius, MODES[fl.colorIndex], fl.visPoly, false, 0);
    }

    if (pathLightPos) {
        drawLight(pathLightPos.x, pathLightPos.y, r * 0.85, mode,
                  visPoly(pathLightPos.x, pathLightPos.y), isCone, pathConeDir);
    }

    ctx.globalCompositeOperation = 'source-over';

    // ── Dust particles (only within mouse light range) ────────────────────────
    for (const p of parts) {
        p.x = (p.x + p.vx + W) % W;
        p.y = (p.y + p.vy + H) % H;
        p.life = (p.life + 0.0035) % 1;
        const dx = p.x - mx, dy = p.y - my;
        const d2 = dx*dx + dy*dy;
        if (d2 > r*r) continue;
        if (isCone) {
            let a = Math.atan2(dy, dx) - coneDir;
            while (a >  Math.PI) a -= 2*Math.PI;
            while (a < -Math.PI) a += 2*Math.PI;
            if (Math.abs(a) > Math.PI*0.38) continue;
        }
        const fade = (1 - Math.sqrt(d2)/r) * Math.sin(p.life * Math.PI);
        if (fade < 0.01) continue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,240,185,${(fade*0.38).toFixed(3)})`;
        ctx.fill();
    }

    // ── Walls ─────────────────────────────────────────────────────────────────
    ctx.fillStyle   = 'rgba(255,255,255,0.14)';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 1.4;
    for (const poly of polygons) { fillPoly(poly); strokePoly(poly); }

    // ── Overlays ──────────────────────────────────────────────────────────────
    drawPathOverlay();
    drawLightIndicators();

    // ── Cursor ────────────────────────────────────────────────────────────────
    ctx.beginPath();
    ctx.arc(mx, my, 3, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(mx-8,my); ctx.lineTo(mx+8,my); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx,my-8); ctx.lineTo(mx,my+8); ctx.stroke();

    if (isPlacingLights || isRecording) {
        ctx.fillStyle = isPlacingLights ? 'rgba(255,205,55,0.92)' : 'rgba(255,80,0,0.92)';
        ctx.font = '10px Courier New';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(isPlacingLights ? '+ LIGHT' : '● WP', mx + 12, my);
    }
}

// ── Canvas interaction ────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
    if (isPlacingLights) {
        const [sx, sy] = toSvg(e.clientX, e.clientY);
        const vp = visPoly(e.clientX, e.clientY);
        fixedLights.push({ x: e.clientX, y: e.clientY, svgX: sx, svgY: sy,
                           colorIndex, radius: lightR, visPoly: vp });
    } else if (isRecording) {
        const [sx, sy] = toSvg(e.clientX, e.clientY);
        waypoints.push({ x: e.clientX, y: e.clientY, svgX: sx, svgY: sy });
        playBtn.disabled = waypoints.length < 2;
    }
});

canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (!isPlacingLights) return;
    let best = -1, bestD = 400;
    fixedLights.forEach((fl, i) => {
        const d = (fl.x-e.clientX)**2 + (fl.y-e.clientY)**2;
        if (d < bestD) { bestD = d; best = i; }
    });
    if (best >= 0) fixedLights.splice(best, 1);
});

// ── Event handlers ────────────────────────────────────────────────────────────
document.addEventListener('mousemove', e => {
    const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y;
    if (dx*dx + dy*dy > 0.25) targetConeDir = Math.atan2(dy, dx);
    mouse.x = e.clientX; mouse.y = e.clientY;
});

document.addEventListener('touchstart', onTouch, { passive: false });
document.addEventListener('touchmove',  onTouch, { passive: false });
function onTouch(e) {
    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - mouse.x, dy = t.clientY - mouse.y;
    if (dx*dx + dy*dy > 0.25) targetConeDir = Math.atan2(dy, dx);
    mouse.x = t.clientX; mouse.y = t.clientY;
}

document.addEventListener('wheel', e => {
    e.preventDefault();
    targetR = Math.max(60, Math.min(520, targetR - e.deltaY * 0.45));
}, { passive: false });

document.addEventListener('keydown', e => {
    if (e.code === 'Space')     { e.preventDefault(); toggleCone(); }
    if (e.key  === 'c' || e.key === 'C') cycleColor();
    if (e.key  === 'f' || e.key === 'F') toggleFlicker();
    if (e.key  === 'g' || e.key === 'G') toggleGhost();
    if (e.key  === 'l' || e.key === 'L') toggleLightMode();
    if (e.key  === 'r' || e.key === 'R') toggleRecord();
    if (e.key  === 'p' || e.key === 'P') toggleLoop();
    if (e.key  === 'Enter')              { e.preventDefault(); togglePlay(); }
    if (e.key  === 'Backspace') {
        if (waypoints.length > 0) { waypoints.pop(); playBtn.disabled = waypoints.length < 2; }
    }
    if (e.key  === 'Escape') {
        isPlacingLights = false; isRecording = false;
        lightBtn.classList.remove('on'); recBtn.classList.remove('on');
    }
});

// ── Toggles ───────────────────────────────────────────────────────────────────
function toggleCone()      { isCone = !isCone;     coneBtn.textContent = isCone ? 'CONE' : 'OMNI'; coneBtn.classList.toggle('on', isCone); }
function cycleColor()      { colorIndex = (colorIndex+1) % MODES.length; colorBtn.textContent = MODES[colorIndex].name; }
function toggleFlicker()   { isFlicker = !isFlicker;  flickBtn.classList.toggle('on', isFlicker); }
function toggleGhost()     { showGhost = !showGhost;  ghostBtn.classList.toggle('on', showGhost); }

function toggleLightMode() {
    isPlacingLights = !isPlacingLights;
    if (isPlacingLights) { isRecording = false; recBtn.classList.remove('on'); }
    lightBtn.classList.toggle('on', isPlacingLights);
}

function toggleRecord() {
    isRecording = !isRecording;
    if (isRecording) { isPlacingLights = false; lightBtn.classList.remove('on'); }
    recBtn.classList.toggle('on', isRecording);
}

function togglePlay() {
    if (waypoints.length < 2) return;
    pathPlaying = !pathPlaying;
    if (!pathPlaying) { pathLightPos = null; pathT = 0; }
    playBtn.classList.toggle('on', pathPlaying);
    playBtn.textContent = pathPlaying ? '■ STOP' : '▶ PLAY';
}

function toggleLoop() {
    pathLoop = !pathLoop;
    loopBtn.classList.toggle('on', pathLoop);
    loopBtn.textContent = pathLoop ? '↻ LOOP' : '→ ONCE';
}

clearBtn.addEventListener('click', () => {
    waypoints = []; pathPlaying = false; pathLightPos = null; pathT = 0;
    playBtn.disabled = true; playBtn.textContent = '▶ PLAY'; playBtn.classList.remove('on');
});

coneBtn.addEventListener('click',   toggleCone);
colorBtn.addEventListener('click',  cycleColor);
flickBtn.addEventListener('click',  toggleFlicker);
ghostBtn.addEventListener('click',  toggleGhost);
lightBtn.addEventListener('click',  toggleLightMode);
recBtn.addEventListener('click',    toggleRecord);
playBtn.addEventListener('click',   togglePlay);
loopBtn.addEventListener('click',   toggleLoop);

speedSlider.addEventListener('input', () => {
    const v = +speedSlider.value;
    pathSpeed = v * 0.005;
    speedDots.textContent = '●'.repeat(v) + '○'.repeat(10 - v);
});

// ── Resize & init ─────────────────────────────────────────────────────────────
function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildPolygons();
    buildWallSegs();
    for (const fl of fixedLights) {
        const [x, y] = toScreen(fl.svgX, fl.svgY);
        fl.x = x; fl.y = y;
        fl.visPoly = visPoly(fl.x, fl.y);
    }
    for (const wp of waypoints) {
        const [x, y] = toScreen(wp.svgX, wp.svgY);
        wp.x = x; wp.y = y;
    }
    spawnParts();
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    animate();
}

init();
</script>
</body>
</html>
