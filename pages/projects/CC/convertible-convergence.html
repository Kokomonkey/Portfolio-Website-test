<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../../Recourses/Logos//DDD.jpg">
    <title>Convertible Convergence | DouweDoesDesign</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --transition-speed: 0.1s;
            --transition-curve: cubic-bezier(0.76, 0, 0.24, 1);
            
            /* SIZING */
            --square-size: min(20vw, 30vh); 
            --header-height: 12vh;
            --sidebar-width: 120px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; 
            overflow: hidden; 
            justify-content: center;
            transition: all 0.5s ease;
        }

        /* --- HEADER --- */
        header {
            height: var(--header-height);
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            gap: 2vh;
            flex-shrink: 0;
            transition: all 0.6s var(--transition-curve);
            z-index: 50;
        }

        .logo-placeholder {
            height: 8vh; width: 8vh; 
            background-color: var(--accent-color);
            display: flex; justify-content: center; align-items: center;
            filter: invert(1);
            transition: inherit;
        }
        .logo-placeholder img { max-height: 100%; width: auto; }

        h1 {
            font-size: 3.5vh; 
            letter-spacing: 0.5vh;
            text-transform: uppercase;
            font-weight: 700;
            transition: inherit;
        }

        /* --- BUTTONS --- */
        .back-btn {
            position: fixed;
            top: 2vh; left: 2vh;
            text-decoration: none;
            z-index: 1000;
            border: 2px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 1vh 2vh;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1.8vh; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .back-btn:hover { background-color: var(--accent-color); color: var(--bg-color); }

        .poster-btn {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 30px;
            margin-bottom: 2vh; 
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            font-size: 1.5vh;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 60;
        }
        .poster-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            letter-spacing: 4px;
        }

        /* --- MAIN LAYOUT --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            position: relative;
        }

        /* --- THE GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(2, 1fr);    
            gap: 0;
            width: fit-content;
            border: 2px solid var(--accent-color);
            margin-bottom: 20px;
            transition: all 0.8s var(--transition-curve);
            position: relative;
            z-index: 100;
        }

        .grid-item {
            display: block; 
            text-decoration: none;
            width: var(--square-size);
            height: var(--square-size);
            position: relative;
            border: 1px solid var(--accent-color);
            overflow: hidden; 
            cursor: pointer;
            background-color: var(--bg-color);
            transition: all 0.5s ease;
        }

        .grid-item.animate-in {
            opacity: 0; 
            animation: brokenRobot 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        .square-content {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-color: var(--bg-color);
            transition: all 0.3s ease;
        }

        .square-icon {
            width: 40%; height: 40%;
            background-color: var(--accent-color);
            margin-bottom: 10%;
            transition: inherit;
        }

        .square-text {
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            font-size: calc(var(--square-size) / 10);
            transition: inherit;
        }

        .grid-item:hover .square-content { transform: scale(0.85); border: 2px solid var(--accent-color); }
        .grid-item:hover { background-color: var(--accent-color); }
        .grid-item:hover .square-icon { background-color: var(--accent-color); }
        .grid-item:hover .square-text { color: var(--accent-color); letter-spacing: 2px; }

        @keyframes brokenRobot {
            0% { opacity: 0; transform: translateX(-50px); }
            5% { opacity: 1; transform: translateX(0); }
            10% { opacity: 0; transform: scaleY(1.5); }
            15% { opacity: 1; transform: scaleY(1); }
            20% { transform: translateX(10px); }
            30% { transform: translateX(0); }
            40% { opacity: 0.5; }
            45% { opacity: 1; }
            70% { transform: scale(1.02); }
            80% { transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        .grid-item:nth-child(1) { animation-delay: 0.0s; }
        .grid-item:nth-child(2) { animation-delay: 0.2s; }
        .grid-item:nth-child(3) { animation-delay: 0.1s; }
        .grid-item:nth-child(4) { animation-delay: 0.4s; }
        .grid-item:nth-child(5) { animation-delay: 0.3s; }
        .grid-item:nth-child(6) { animation-delay: 0.05s; }
        .grid-item:nth-child(7) { animation-delay: 0.5s; }
        .grid-item:nth-child(8) { animation-delay: 0.25s; }


        /* --- GALLERY MODE --- */
        body.gallery-mode header {
            position: absolute; top: 20px; right: 40px;
            height: auto; width: auto;
            flex-direction: row; margin: 0;
        }
        body.gallery-mode h1 { font-size: 1.5rem; letter-spacing: 0; border: none; }
        body.gallery-mode .logo-placeholder { height: 40px; width: 40px; }
        body.gallery-mode .poster-btn { display: none; }

        body.gallery-mode .grid-container {
            position: fixed; top: 0; left: 0;
            width: var(--sidebar-width); height: 100vh;
            margin: 0; border: none; border-right: 1px solid #333;
            display: flex; flex-direction: column; justify-content: center;
            background: var(--bg-color); padding: 10vh 0;
        }

        body.gallery-mode .grid-item.static-link { display: none; }
        
        body.gallery-mode .grid-item.gallery-trigger {
            width: 100%; height: 10vh;
            border: none; border-top: 1px solid #222; border-bottom: 1px solid #222;
            animation: none; opacity: 1; transform: none;
        }
        body.gallery-mode .grid-item.gallery-trigger .square-icon { display: none; }
        body.gallery-mode .grid-item.gallery-trigger .square-content { background-color: transparent; transform: none; border: none; }
        body.gallery-mode .grid-item.gallery-trigger .square-text { font-size: 0.8rem; color: #666; letter-spacing: 1px; }

        body.gallery-mode .grid-item.gallery-trigger.active-category {
            height: 40vh; background: var(--bg-color);
            border-right: 1px solid white; margin-right: -1px; z-index: 101;
        }
        body.gallery-mode .grid-item.gallery-trigger.active-category .square-text {
            writing-mode: vertical-rl; transform: rotate(180deg);
            font-size: 1.5rem; letter-spacing: 5px; color: white;
        }

        .image-feed {
            position: absolute; top: 0; left: var(--sidebar-width);
            width: calc(100vw - var(--sidebar-width)); height: 100%;
            overflow-y: auto; display: none; justify-content: center;
            padding: 50px 0; opacity: 0; transform: translateY(20px);
            transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
        }
        body.gallery-mode .image-feed { display: flex; opacity: 1; transform: translateY(0); }

        .feed-grid {
            width: 100%; max-width: 1400px; padding: 0 60px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 250px; gap: 20px;
        }
        .gallery-thumb { width: 100%; height: 100%; background-color: #111; cursor: pointer; border: 1px solid transparent; transition: border-color 0.2s; overflow: hidden; }
        .gallery-thumb:hover { border-color: var(--accent-color); }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.3s, transform 0.5s; filter: grayscale(100%); }
        .gallery-thumb:hover img { opacity: 1; transform: scale(1.1); filter: grayscale(0%); }

        /* --- POPUPS & MODALS --- */
        .popup-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px);
        }
        .popup-box {
            background-color: var(--bg-color); border: 2px solid var(--accent-color);
            padding: 30px; max-width: 400px; text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); animation: fadeIn 0.3s ease;
        }
        .close-btn { background: var(--accent-color); color: var(--bg-color); border: none; padding: 10px 20px; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* --- GALLERY PRESENTATION MODAL --- */
        .presentation-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 3000; display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .presentation-modal.active { opacity: 1; pointer-events: all; }
        .stage-area { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* --- FIXED ZOOM CSS --- */
.presentation-img { 
    max-height: 80vh; 
    max-width: 90vw; 
    object-fit: contain; 
    cursor: zoom-in; 
    transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
    transform: scale(1);
    z-index: 1;
}

/* When zoomed, we override the constraints and remove transitions for smooth panning */
.presentation-img.zoomed { 
    cursor: zoom-out; 
    max-height: none; /* Allow it to exceed the viewport height */
    max-width: none;  /* Allow it to exceed the viewport width */
    transform: scale(2.5); 
    transition: none !important; 
    z-index: 5;
}

        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 3rem; color: white; background: none; border: none; cursor: pointer; padding: 20px; opacity: 0.3; transition: opacity 0.2s; z-index: 10; }
        .nav-arrow:hover { opacity: 1; }
        .nav-arrow.left { left: 10px; } .nav-arrow.right { right: 10px; }
        .control-bar { height: 15vh; background: #111; border-top: 1px solid #333; display: flex; flex-direction: column; }
        .caption-overlay { background: #222; color: #aaa; padding: 10px; text-align: center; font-size: 0.8rem; border-bottom: 1px solid #333; }
        .strip-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 5px; overflow-x: auto; padding: 0 10px; }
        .strip-thumb { height: 70%; aspect-ratio: 1/1; opacity: 0.3; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; flex-shrink: 0; }
        .strip-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .strip-thumb.active { opacity: 1; border-color: white; }
        .close-modal-icon { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: white; cursor: pointer; z-index: 3001; width: 40px; height: 40px; text-align: center; line-height: 40px; border: 1px solid #666; border-radius: 50%; background: rgba(0,0,0,0.5); }

        /* --- POSTER MODAL --- */
        .poster-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 5000;
            display: none; flex-direction: column; align-items: center;
        }

        /* --- MINIMAP --- */
        #posterMinimap {
            position: absolute;
            bottom: 20px; right: 20px;
            width: 160px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(0,0,0,0.75);
            overflow: hidden;
            z-index: 5010;
            pointer-events: none;
            display: none;
        }
        #minimapPosterImg {
            width: 100%; display: block; opacity: 0.5;
        }
        #minimapPosterVP {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.1);
            top: 0; left: 0;
            pointer-events: none;
            transition: all 0.05s linear;
        }
        #posterZoomLevel {
            position: absolute;
            bottom: 8px; left: 10px;
            color: rgba(255,255,255,0.4);
            font-size: 1vh;
            letter-spacing: 2px;
            z-index: 5010;
            pointer-events: none;
        }

        .poster-header-bar {
            width: 100%; height: 15vh;
            display: flex; justify-content: center; align-items: center;
            gap: 20px; z-index: 5002;
            background: rgba(0,0,0,0.8);
            position: absolute; top: 0; left: 0;
            pointer-events: none; 
        }
        .poster-header-bar * { pointer-events: auto; } 

        .poster-viewport {
            width: 100%; height: 100%;
            overflow: hidden; cursor: grab;
            display: flex; justify-content: center; align-items: center;
        }
        .poster-viewport:active { cursor: grabbing; }

        .full-poster-img {
            max-width: 90%; max-height: 90%;
            transition: transform 0.1s linear;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            body { height: auto; min-height: 100vh; padding-bottom: 50px; justify-content: flex-start; }
            header { margin-top: 80px; flex-direction: column; height: auto; gap: 15px; }
            .logo-placeholder { height: 70px; width: 70px; }
            h1 { font-size: 1.5rem; text-align: center; line-height: 1.2; }

            .poster-btn { margin-bottom: 40px; font-size: 1rem; }

            .grid-container { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
            .grid-item { width: 40vw; height: 40vw; }
            .square-text { font-size: 0.8rem; }

            body.gallery-mode .grid-container {
                width: 100vw; height: 60px; position: fixed; top: 80px; left: 0;
                flex-direction: row; padding: 0; border-right: none; border-bottom: 1px solid #333;
            }
            body.gallery-mode .grid-item.gallery-trigger { height: 100%; width: 25%; border: none; border-right: 1px solid #222; display: flex; justify-content: center; align-items: center; padding: 0; }
            body.gallery-mode .grid-item.gallery-trigger.active-category { height: 100%; width: 25%; margin: 0; border-right: 1px solid #222; border-bottom: 2px solid white; }
            body.gallery-mode .grid-item.gallery-trigger .square-text { writing-mode: horizontal-tb; transform: none; font-size: 0.6rem; }
            body.gallery-mode header { top: 0; right: 0; width: 100%; height: 80px; flex-direction: row; background: var(--bg-color); }
            body.gallery-mode .logo-placeholder { height: 40px; width: 40px; }
            
            .image-feed { left: 0; width: 100vw; padding-top: 150px; }
            .feed-grid { grid-template-columns: 1fr; padding: 0 20px; }
        }

    </style>
</head>

    <script>
    // --- DATA CONFIGURATION ---
    const categories = {
        'sketches': [
            { id: 1, url: 'Recourses/Site.jpg', thumb: 'Recourses/Site.jpg', desc: 'Site Analysis & Context' },
        ],
        'furniture': [
             { id: 1, url: 'Recourses/SlidingBookcase.jpg', thumb: 'Recourses/SlidingBookcase.jpg', desc: 'Sliding Bookcase Mechanism' },
             { id: 2, url: 'Recourses/MovableChairs.jpg', thumb: 'Recourses/MovableChairs.jpg', desc: 'Movable Chair Configuration' },
             { id: 3, url: 'Recourses/FodableTable.jpg', thumb: 'Recourses/FodableTable.jpg', desc: 'Foldable Table Prototype' },
             { id: 4, url: 'Recourses/BendableBookcase.jpg', thumb: 'Recourses/BendableBookcase.jpg', desc: 'Bendable Bookcase Detail' },
        ],
        'details': [
             { id: 1, url: 'Recourses/DetailBig.jpg', thumb: 'Recourses/DetailBig.jpg', desc: '1:5 Structural Detail' },
             { id: 2, url: 'Recourses/DetailsSmall.jpg', thumb: 'Recourses/DetailsSmall.jpg', desc: 'Joinery & Connections' },
             { id: 3, url: 'Recourses/DetailFacade.jpg', thumb: 'Recourses/DetailFacade.jpg', desc: 'Dynamic Façade Section' },
        ], 
        'renders': [
             { id: 1, url: 'Recourses/Render1.jpg', thumb: 'Recourses/Render1.jpg', desc: 'Interior Perspective' },
             { id: 2, url: 'Recourses/Render2.jpg', thumb: 'Recourses/Render2.jpg', desc: 'Courtyard View' },
             { id: 3, url: 'Recourses/Render31.jpg', thumb: 'Recourses/Render3.jpg', desc: 'Night Context' },
        ], 
    };

    // --- STATE VARIABLES ---
    let currentCategoryKey = null;
    let currentIndex = 0;
    let isGalleryMode = false;
    
    // Zoom State
    let zoomState = { scale: 1, panning: false, pointX: 0, pointY: 0, startX: 0, startY: 0 };

    // DOM Elements
    const body = document.body;
    const feed = document.getElementById('imageFeed');
    const feedContent = document.getElementById('feedContent');
    const modal = document.getElementById('modal');
    const mainImg = document.getElementById('mainImage');
    const caption = document.getElementById('imageCaption');
    const strip = document.getElementById('thumbStrip');
    const backBtn = document.getElementById('mainBackBtn');
    const stage = document.getElementById('stageArea');
    
    const triggerIds = ['trigger-sketches', 'trigger-furniture', 'trigger-details', 'trigger-renders', 'trigger-workflow'];

    // --- NAVIGATION ---
    function openCategory(key) {
        isGalleryMode = true;
        body.classList.add('gallery-mode');
        currentCategoryKey = key;
        backBtn.innerText = "← MENU";
        
        triggerIds.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                if(id === 'trigger-' + key) el.classList.add('active-category');
                else el.classList.remove('active-category');
            }
        });
        
        if(categories[key]) renderFeed(categories[key]);
    }

    function handleBack() {
        if (modal.classList.contains('active')) {
            closeModal();
        } else if (isGalleryMode) {
            body.classList.remove('gallery-mode');
            isGalleryMode = false;
            backBtn.innerText = "← Back";
            triggerIds.forEach(id => {
               const el = document.getElementById(id);
               if(el) el.classList.remove('active-category');
            });
        } else if (document.getElementById('posterModal').style.display === 'flex') {
            closePoster();
        } else {
            window.location.href = '../../../projects.html';
        }
    }

    // --- GALLERY ---
    function renderFeed(data) {
        feed.style.opacity = '0';
        setTimeout(() => {
            feedContent.innerHTML = ''; 
            data.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-thumb';
                div.innerHTML = `<img src="${item.thumb}" loading="lazy" alt="Thumb">`;
                div.onclick = () => openModal(index);
                feedContent.appendChild(div);
            });
            feed.style.opacity = '1';
        }, 300);
    }

    function openModal(index) {
        currentIndex = index;
        updateModalContent();
        modal.classList.add('active');
        renderStrip();
    }
    
    function closeModal() {
        modal.classList.remove('active');
        resetZoom();
    }

    function updateModalContent() {
        const data = categories[currentCategoryKey][currentIndex];
        mainImg.src = data.url;
        caption.innerText = data.desc;
        
        const thumbs = document.querySelectorAll('.strip-thumb');
        thumbs.forEach((t, i) => {
            if(i === currentIndex) t.classList.add('active');
            else t.classList.remove('active');
        });

        resetZoom();
    }

    function renderStrip() {
        strip.innerHTML = '';
        categories[currentCategoryKey].forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = `strip-thumb ${idx === currentIndex ? 'active' : ''}`;
            div.innerHTML = `<img src="${item.thumb}">`;
            div.onclick = () => { currentIndex = idx; updateModalContent(); };
            strip.appendChild(div);
        });
    }

    function changeSlide(dir) {
        const list = categories[currentCategoryKey];
        currentIndex += dir;
        if(currentIndex < 0) currentIndex = list.length - 1;
        if(currentIndex >= list.length) currentIndex = 0;
        updateModalContent();
    }

    // --- UNIFIED DRAG & ZOOM LOGIC (Gallery & Poster) ---
    function resetZoom() {
        zoomState = { scale: 1, panning: false, pointX: 0, pointY: 0, startX: 0, startY: 0 };
        mainImg.classList.remove('zoomed');
        mainImg.style.transform = `translate(0px, 0px) scale(1)`;
        mainImg.style.cursor = 'zoom-in';
    }

    function applyTransform(element) {
        // Apply translation and scale
        element.style.transform = `translate(${zoomState.pointX}px, ${zoomState.pointY}px) scale(${zoomState.scale})`;
    }

    // 1. CLICK TO ACTIVATE ZOOM
    stage.addEventListener('click', (e) => {
        if(e.target.classList.contains('nav-arrow')) return; // Ignore arrows

        if(zoomState.scale === 1) {
            // Zoom In
            zoomState.scale = 2.5; 
            mainImg.classList.add('zoomed');
            mainImg.style.cursor = 'grab';
        } else {
            // Zoom Out
            resetZoom();
        }
        applyTransform(mainImg);
    });

    // 2. DRAG TO PAN (Mouse Down)
    stage.addEventListener('mousedown', (e) => {
        if(zoomState.scale > 1) {
            e.preventDefault();
            zoomState.panning = true;
            zoomState.startX = e.clientX - zoomState.pointX;
            zoomState.startY = e.clientY - zoomState.pointY;
            mainImg.style.cursor = 'grabbing';
        }
    });

    // 3. DRAG MOVING (Mouse Move)
    window.addEventListener('mousemove', (e) => {
        if (!zoomState.panning) return;
        e.preventDefault();
        zoomState.pointX = e.clientX - zoomState.startX;
        zoomState.pointY = e.clientY - zoomState.startY;
        applyTransform(mainImg);
    });

    // 4. STOP DRAG (Mouse Up)
    window.addEventListener('mouseup', () => {
        if(zoomState.panning) {
            zoomState.panning = false;
            mainImg.style.cursor = 'grab';
        }
    });

    // 5. WHEEL ZOOM
    stage.addEventListener('wheel', (e) => {
        if(!mainImg.classList.contains('zoomed')) return;
        e.preventDefault();
        
        const xs = (e.clientX - zoomState.pointX) / zoomState.scale;
        const ys = (e.clientY - zoomState.pointY) / zoomState.scale;
        const delta = -e.deltaY;

        (delta > 0) ? (zoomState.scale *= 1.1) : (zoomState.scale /= 1.1);
        
        // Limits
        if(zoomState.scale < 1) { zoomState.scale = 1; resetZoom(); return; }
        if(zoomState.scale > 5) zoomState.scale = 5;

        zoomState.pointX = e.clientX - xs * zoomState.scale;
        zoomState.pointY = e.clientY - ys * zoomState.scale;

        applyTransform(mainImg);
    });

    // --- POSTER MODAL LOGIC ---
    const posterModal = document.getElementById('posterModal');
    const posterViewport = document.getElementById('posterViewport');
    const posterImg = document.getElementById('posterImage');
    const posterTitle = document.querySelector('.poster-header-bar h1');
    const posterMinimap = document.getElementById('posterMinimap');
    const minimapPosterImg = document.getElementById('minimapPosterImg');
    const minimapPosterVP = document.getElementById('minimapPosterVP');
    const posterZoomLevel = document.getElementById('posterZoomLevel');

    let posterState = { scale: 1, panning: false, pointX: 0, pointY: 0, startX: 0, startY: 0 };

    function openPoster() { openSingleView('Recourses/CCPoster.jpg', 'Convertible Convergence'); }

    function openSingleView(imagePath, titleText) {
        posterImg.src = imagePath;
        posterTitle.innerText = titleText;
        posterModal.style.display = 'flex';
        posterState = { scale: 1, panning: false, pointX: 0, pointY: 0, startX: 0, startY: 0 };
        posterImg.style.transform = 'translate(0px,0px) scale(1)';
        minimapPosterImg.src = imagePath;
        posterMinimap.style.display = 'block';
        posterZoomLevel.textContent = '100%';
        posterImg.onload = updatePosterMinimap;
        if (posterImg.complete) updatePosterMinimap();
    }

    function closePoster() {
        posterModal.style.display = 'none';
        posterMinimap.style.display = 'none';
    }

    function updatePosterTransform() {
        posterImg.style.transform = `translate(${posterState.pointX}px,${posterState.pointY}px) scale(${posterState.scale})`;
        posterZoomLevel.textContent = Math.round(posterState.scale * 100) + '%';
        updatePosterMinimap();
    }

    function updatePosterMinimap() {
        const imgRect = posterImg.getBoundingClientRect();
        const vpRect = posterViewport.getBoundingClientRect();
        const mmW = posterMinimap.clientWidth;
        if (!imgRect.width || !mmW) return;

        const mmH = Math.round(mmW * imgRect.height / imgRect.width);
        posterMinimap.style.height = mmH + 'px';

        const scaleX = mmW / imgRect.width;
        const scaleY = mmH / imgRect.height;

        const visL = Math.max(0, vpRect.left - imgRect.left);
        const visT = Math.max(0, vpRect.top - imgRect.top);
        const visR = Math.min(imgRect.width, vpRect.right - imgRect.left);
        const visB = Math.min(imgRect.height, vpRect.bottom - imgRect.top);

        minimapPosterVP.style.left   = (visL * scaleX) + 'px';
        minimapPosterVP.style.top    = (visT * scaleY) + 'px';
        minimapPosterVP.style.width  = Math.max(4, (visR - visL) * scaleX) + 'px';
        minimapPosterVP.style.height = Math.max(4, (visB - visT) * scaleY) + 'px';
    }

    function zoomPosterAtCursor(e, newScale) {
        const rect = posterImg.getBoundingClientRect();
        if (!rect.width) return;
        const naturalW = rect.width / posterState.scale;
        const naturalH = rect.height / posterState.scale;
        const naturalCX = rect.left + rect.width / 2 - posterState.pointX;
        const naturalCY = rect.top + rect.height / 2 - posterState.pointY;
        const fx = (e.clientX - rect.left) / rect.width;
        const fy = (e.clientY - rect.top) / rect.height;
        posterState.scale = Math.max(0.3, Math.min(8, newScale));
        posterState.pointX = e.clientX + naturalW * posterState.scale * (0.5 - fx) - naturalCX;
        posterState.pointY = e.clientY + naturalH * posterState.scale * (0.5 - fy) - naturalCY;
        updatePosterTransform();
    }

    posterViewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
        zoomPosterAtCursor(e, posterState.scale * factor);
    }, { passive: false });

    posterViewport.addEventListener('mousedown', (e) => {
        posterState.panning = true;
        posterState.startX = e.clientX - posterState.pointX;
        posterState.startY = e.clientY - posterState.pointY;
        posterViewport.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        if (posterState.panning) {
            posterState.panning = false;
            posterViewport.style.cursor = 'grab';
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!posterState.panning) return;
        posterState.pointX = e.clientX - posterState.startX;
        posterState.pointY = e.clientY - posterState.startY;
        updatePosterTransform();
    });

    // --- KEYBOARD & POPUPS ---
    document.addEventListener('keydown', (e) => {
        if(modal.classList.contains('active')) {
            if(e.key === 'ArrowLeft') changeSlide(-1);
            if(e.key === 'ArrowRight') changeSlide(1);
            if(e.key === 'Escape') closeModal();
        } else if (posterModal.style.display === 'flex' && e.key === 'Escape') {
            closePoster();
        } else if (isGalleryMode && e.key === 'Escape') {
            handleBack();
        }
    });

    function openPopup(event) { if (event) event.preventDefault(); document.getElementById('popup').style.display = 'flex'; }
    function closePopup() { document.getElementById('popup').style.display = 'none'; }
    document.getElementById('popup').addEventListener('click', function(e) { if (e.target === this) closePopup(); });

</script>
</body>
