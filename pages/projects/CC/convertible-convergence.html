<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../../Recourses/Logos//DDD.jpg">
    <title>Convertible Convergence | DouweDoesDesign</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --transition-speed: 0.1s; /* Instant, mechanical feel */
            
            /* DYNAMIC SIZING */
            --square-size: min(22vw, 35vh); 
            --header-height: 15vh;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; 
            overflow: hidden; 
            justify-content: center;
        }

        /* --- POPUP STYLES --- */
        .popup-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Dark overlay */
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .popup-box {
            background-color: var(--bg-color);
            border: 2px solid var(--accent-color);
            padding: 30px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.3s ease;
        }

        .popup-box p {
            font-size: 1rem;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
        }

        .close-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .close-btn:hover {
            background: #333;
            color: #fff;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }


        /* --- BACK BUTTON --- */
        .back-btn {
            position: fixed;
            top: 2vh;
            left: 2vh;
            text-decoration: none;
            z-index: 100;
            border: 2px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 1vh 2vh;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 2vh; 
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- HEADER --- */
        header {
            height: var(--header-height);
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            gap: 2vh;
            margin-bottom: 2vh; 
            flex-shrink: 0;
        }

        .logo-placeholder {
            height: 10vh; 
            width: 10vh; 
            background-color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            filter: invert(1);
        }
        
        .logo-placeholder img {
            max-height: 100%;
            width: auto;
        }

        h1 {
            font-size: 4vh; 
            letter-spacing: 0.5vh;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* --- THE MONOLITH GRID --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(2, 1fr);    
            gap: 0; /* TOUCHING */
            width: fit-content;
            border: 2px solid var(--accent-color);
            margin-bottom: 20px;
        }

        /* --- INTERACTIVE GRID ITEMS --- */
        .grid-item {
            display: block; 
            text-decoration: none;
            width: var(--square-size);
            height: var(--square-size);
            position: relative;
            border: 1px solid var(--accent-color);
            overflow: hidden; 
            cursor: pointer;
            
            /* BROKEN ROBOT ANIMATION */
            opacity: 0; 
            animation: brokenRobot 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        .square-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            transition: all var(--transition-speed) ease; 
        }

        .square-icon {
            width: 40%;
            height: 40%;
            background-color: var(--accent-color);
            margin-bottom: 10%;
            transition: inherit;
        }

        .square-text {
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            font-size: calc(var(--square-size) / 10);
            transition: inherit;
        }

        /* --- BROKEN ROBOT KEYFRAMES --- */
        @keyframes brokenRobot {
            0% { opacity: 0; transform: translateX(-50px); }
            5% { opacity: 1; transform: translateX(0); }
            10% { opacity: 0; transform: scaleY(1.5); }
            15% { opacity: 1; transform: scaleY(1); }
            20% { transform: translateX(10px); }
            30% { transform: translateX(0); }
            40% { opacity: 0.5; }
            45% { opacity: 1; }
            70% { transform: scale(1.02); }
            80% { transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Staggered Delays for Chaos */
        .grid-item:nth-child(1) { animation-delay: 0.0s; }
        .grid-item:nth-child(2) { animation-delay: 0.2s; }
        .grid-item:nth-child(3) { animation-delay: 0.1s; }
        .grid-item:nth-child(4) { animation-delay: 0.4s; }
        .grid-item:nth-child(5) { animation-delay: 0.3s; }
        .grid-item:nth-child(6) { animation-delay: 0.05s; }
        .grid-item:nth-child(7) { animation-delay: 0.5s; }
        .grid-item:nth-child(8) { animation-delay: 0.25s; }


        /* OPTION 3: ARCHITECTURAL SECTION */

        .grid-item:hover .square-content {
            /* Shrink the black box inside the white container */
            transform: scale(0.85); 
            background-color: var(--bg-color); /* Stays Black */
            border: 2px solid var(--accent-color); /* Adds inner border */
        }

        /* The background behind the shrunk box becomes white */
        .grid-item:hover {
            background-color: var(--accent-color);
        }

        .grid-item:hover .square-icon {
            background-color: var(--accent-color); /* Stays White */
        }

        .grid-item:hover .square-text {
            color: var(--accent-color); /* Stays White */
            letter-spacing: 2px; /* Text expands slightly */
        }

        /* --- MOBILE ADAPTATION --- */
        @media (max-width: 768px) {
            body {
                height: auto;
                min-height: 100vh;
                padding-bottom: 50px;
                justify-content: flex-start;
            }

            header {
                margin-top: 80px;
                flex-direction: column;
                height: auto;
                gap: 15px;
            }
            
            .logo-placeholder { height: 70px; width: 70px; }
            h1 { font-size: 1.5rem; text-align: center; line-height: 1.2; }

            .grid-container {
                /* Change from 4x2 to 2x4 on mobile */
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(4, 1fr);
            }

            .grid-item {
                /* Adjust size based on width for phone screens */
                width: 40vw;
                height: 40vw;
            }

            .square-text {
                font-size: 0.8rem;
            }
        }

    </style>
</head>
<body>

    <a href="../../../projects.html" class="back-btn">← Back</a>

    <header>
        <div class="logo-placeholder">
            <img src="../../../Recourses/Logos/CC.jpg" />
        </div>
        <h1>Convertible Convergence</h1>
    </header>

    <main>
        <div class="grid-container">

            <a href="Floorplans.html" class="grid-item">
                <div class="square-content">
                    <div class="square-icon" style="clip-path: polygon(0% 0%, 100% 0%, 100% 10%, 50% 10%, 50% 90%, 100% 90%, 100% 100%, 0% 100%, 0% 60%, 40% 60%, 40% 40%, 0% 40%);"></div>
                    <span class="square-text">Floorplans</span>
                </div>
            </a>

            <div onclick="openPopup(event)" class="grid-item">
                <div class="square-content">
                    <div class="square-icon" style="clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: linear-gradient(45deg, transparent 48%, white 48%, white 52%, transparent 52%), linear-gradient(-45deg, transparent 48%, white 48%, white 52%, transparent 52%); background-color: white;"></div>
                    <span class="square-text">3D Model</span>
                </div>
            </div>

            <div onclick="openPopup(event)" class="grid-item">
                <div class="square-content">
                    <div class="square-icon" style="clip-path: circle(40% at 50% 40%); border-bottom: 10px solid white;"></div>
                    <span class="square-text">The Site</span>
                </div>
            </div>

            <div onclick="openPopup(event)" class="grid-item">
                <div class="square-content">
                    <div class="square-icon" style="clip-path: polygon(20% 100%, 20% 60%, 20% 40%, 20% 20%, 80% 20%, 80% 40%, 80% 60%, 80% 100%, 70% 100%, 70% 60%, 30% 60%, 30% 100%);"></div>
                    <span class="square-text">Furniture</span>
                </div>
            </div>

            <div onclick="openPopup(event)" class="grid-item">
                <div class="square-content">
                    <div class="square-icon" style="clip-path: polygon(0% 0%, 30% 0%, 30% 10%, 10% 10%, 10% 30%, 0% 30%, 0% 100%, 30% 100%, 30% 90%, 10% 90%, 10% 70%, 100% 70%, 100% 0%);"></div>
                    <span class="square-text">Details</span>
                </div>
            </div>

            <a href="workflow.html" class="grid-item">
                <div class="square-content">
                    <div class="square-icon" style="clip-path: polygon(0% 40%, 60% 40%, 60% 10%, 100% 50%, 60% 90%, 60% 60%, 0% 60%);"></div>
                    <span class="square-text">Workflow</span>
                </div>
            </a>

            <a href="dynamic-facade.html" class="grid-item">
               <div class="square-content">
                 <div class="square-icon" style="clip-path: polygon(10% 0%, 20% 0%, 20% 100%, 10% 100%, 40% 0%, 50% 0%, 50% 100%, 40% 100%, 70% 0%, 80% 0%, 80% 100%, 70% 100%);"></div>
               <span class="square-text">Dynamic Façade</span>
             </div>
            </a>

            <a href="Renders.html" class="grid-item">
                <div class="square-content">
                    <div class="square-icon" style="clip-path: polygon(0% 100%, 30% 40%, 50% 70%, 70% 20%, 100% 100%);"></div>
                    <span class="square-text">Renders</span>
                </div>
            </a>

        </div>
    </main>

    <div id="popup" class="popup-overlay">
        <div class="popup-box">
            <p>Currently unavailable, please contact me personally for more information.</p>
            <button class="close-btn" onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
        // POPUP LOGIC
        function openPopup(event) {
            // Prevent default link behavior if inside an anchor tag (though we used div for these)
            if (event) event.preventDefault();
            document.getElementById('popup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        // Close popup if clicking outside the box
        document.getElementById('popup').addEventListener('click', function(e) {
            if (e.target === this) {
                closePopup();
            }
        });
    </script>

</body>
</html>
