<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Recourses/Logos/DDD.jpg">
    <title>Floorplans | [DOUWEDOESDESIGN]</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --alert-color: #ff0000;
            --ui-font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: var(--ui-font);
            height: 100vh;
            overflow: hidden;
            /* Layout: Flex Row to arrange Text - Image - Slider */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5vw; /* Space between elements */
        }

        /* --- BACK BUTTON --- */
        .back-btn {
            position: fixed; top: 40px; left: 40px;
            text-decoration: none;
            border: 2px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 100;
            transition: all 0.2s ease;
        }
        .back-btn:hover { background-color: var(--accent-color); color: var(--bg-color); }

        /* --- INFO PANEL (LEFT) --- */
        .info-panel {
            width: 250px;
            flex-shrink: 0; /* Prevent text from squishing */
            text-align: left;
            margin-left: 5vw; /* Push slightly from left edge */
        }

        h2 {
            font-size: 1.5rem; text-transform: uppercase;
            border-bottom: 2px solid var(--alert-color);
            margin-bottom: 15px; display: block;
        }

        p { font-size: 0.85rem; line-height: 1.6; color: #aaaaaa; }

        /* --- CENTRAL VIEWPORT (IMAGE FRAME) --- */
        .plan-viewport {
            height: 75vh; /* Max height constraint */
            width: 100%;  /* Fill available space */
            
            /* KEY CHANGE: Limit width so it doesn't push UI elements off screen */
            max-width: 65vw; 

            /* Using grid to stack images perfectly on top of each other */
            display: grid; 
            grid-template-areas: "stack";
            border: 1px solid var(--alert-color);
            
            /* Background Grid */
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Layers stack in the same grid cell */
        .plan-layer {
            grid-area: stack;
            display: none; /* Hide inactive */
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ensure image doesn't spill out */
        }

        .plan-layer.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        /* KEY CHANGE: Object-fit logic to constrain image size */
        .plan-layer img {
            width: 100%;      /* Fill container width */
            height: 100%;     /* Fill container height */
            object-fit: contain; /* Scale image to fit WITHOUT cropping or stretching */
            display: block;
        }

        /* --- VERTICAL SLIDER SYSTEM (RIGHT) --- */
        .slider-wrapper {
            height: 50vh;
            flex-shrink: 0; /* Prevent slider from shrinking */
            display: flex;
            flex-direction: row; /* Slider Left, Labels Right */
            align-items: center;
            gap: 15px;
            margin-right: 5vw;
        }

        .slider-container {
            width: 30px; /* Constrain width so rotated input stays neat */
            height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        /* Rotated Slider */
        input[type=range] {
            -webkit-appearance: none; appearance: none;
            width: 50vh; /* Visual height */
            height: 4px;
            background: #222;
            outline: none;
            transform: rotate(-90deg);
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 30px; height: 15px;
            background: var(--alert-color);
            border: 1px solid white;
            cursor: pointer;
        }

        .slider-labels {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
            padding: 10px 0;
        }

        .label {
            font-weight: bold; font-size: 1.2rem;
            color: #333; transition: color 0.3s;
        }
        .label.active { color: var(--alert-color); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <a href="convertible-convergence.html" class="back-btn">← Back</a>

    <div class="info-panel">
        <h2>Floorplans</h2>
        <p>
            Vertical articulation of the internal convergence. 
            <br><br>
            Use the control rail on the right to toggle between structural levels. Each plane represents a calculated slice of the dynamic facade's interior logic.
        </p>
    </div>

    <div class="plan-viewport">
        <div class="plan-layer active" id="layer-3">
            <img src="Recourses/Level2.jpg" alt="Level 2 Plan" />
        </div>
        <div class="plan-layer" id="layer-2">
            <img src="Recourses/Level1.jpg" alt="Level 1 Plan" />
        </div>
        <div class="plan-layer" id="layer-1">
            <img src="Recourses/Level0.jpg" alt="Level 0 Plan" />
        </div>
        <div class="plan-layer" id="layer-0">
            <img src="Recourses/Level-1.jpg" alt="Level -1 Plan" />
        </div>
    </div>

    <div class="slider-wrapper">
        <div class="slider-container">
            <input type="range" min="0" max="3" value="3" step="1" id="levelSlider">
        </div>
        <div class="slider-labels">
            <span class="label" data-index="3">2</span>
            <span class="label" data-index="2">1</span>
            <span class="label" data-index="1">0</span>
            <span class="label" data-index="0">-1</span>
        </div>
    </div>

    <script>
        const slider = document.getElementById('levelSlider');
        const layers = document.querySelectorAll('.plan-layer');
        const labels = document.querySelectorAll('.label');

        function updateView(val) {
            // 1. Toggle Active Layer
            layers.forEach(layer => layer.classList.remove('active'));
            const targetLayer = document.getElementById(`layer-${val}`);
            if(targetLayer) targetLayer.classList.add('active');
            
            // 2. Highlight Number
            labels.forEach(label => {
                label.classList.remove('active');
                if(label.getAttribute('data-index') === val) {
                    label.classList.add('active');
                }
            });
        }

        slider.addEventListener('input', (e) => {
            updateView(e.target.value);
        });

        // Initialize
        updateView("3");
    </script>
</body>
</html>
