<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="../../../Recourses/Logos//DDD.jpg">
    <title>Dynamic Facade | Permeability Study</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --highlight-color: #ff0000; /* Red for the 'vision' cone */
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Subtle grid texture */
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 30px 30px;
            overflow: hidden; /* Prevent scrolling */
            font-family: var(--font-main);
            color: var(--accent-color);
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
        }

        /* --- NAVIGATION --- */
        .back-btn {
            pointer-events: auto;
            text-decoration: none;
            border: 1px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 10px 15px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: 0.2s;
            display: inline-block;
            width: fit-content;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- INFO PANEL --- */
        .info-panel {
            align-self: flex-end;
            text-align: right;
            max-width: 350px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-right: 2px solid var(--highlight-color);
            backdrop-filter: blur(2px);
        }

        .info-panel h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            color: var(--highlight-color);
        }

        .info-panel p {
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 0;
            color: #ddd;
        }

        .instruction {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--accent-color);
            border: 1px dashed #555;
            padding: 5px;
            display: inline-block;
        }

        /* --- CONTROLS --- */
        .controls {
            pointer-events: auto;
            align-self: flex-start;
        }

        #offset-btn {
            border: 1px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 15px 25px;
            font-family: var(--font-main);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        #offset-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        #offset-btn.active {
            background-color: var(--highlight-color);
            color: white;
            border-color: var(--highlight-color);
        }

        /* --- MOBILE ADAPTATION --- */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 20px;
            }

            /* Move Info to top so it doesn't get covered by thumb */
            .info-panel {
                position: absolute;
                top: 70px; /* Below back button */
                left: 20px;
                right: 20px;
                max-width: 100%;
                text-align: left;
                align-self: flex-start;
                border-right: none;
                border-left: 2px solid var(--highlight-color);
            }

            .info-panel h1 { font-size: 1.2rem; }
            .info-panel p { font-size: 0.8rem; }
            
            /* Move controls to bottom center */
            .controls {
                position: absolute;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                text-align: center;
            }

            #offset-btn {
                width: 80%;
                padding: 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <a href="convertible-convergence.html" class="back-btn">← Project</a>

        <div class="info-panel">
            <h1>Permeability Study</h1>
            <p>
                This conceptual facade demonstrates the relationship between rotation and visibility.
                By orienting the louvers, the structure transitions from an 
                <strong>opaque barrier</strong> to a <strong>transparent filter</strong>.
            </p>
            <div class="instruction">
                [ HOLD & DRAG TO ROTATE ]
            </div>
        </div>

        <div class="controls">
            <button id="offset-btn">MODE: ALIGNED</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('offset-btn');

        // --- Configuration ---
        const config = {
            rectWidth: 120,    // Width of the wall segments
            rectHeight: 12,    // Thickness of wall segments
            gap: 80,           // Gap between centers
            
            // Colors
            wallColor: '#ffffff',
            visionColor: 'rgba(255, 0, 0, 0.4)', // The red "sight" cone
            visionBorder: '#ff0000',
            
            // Interaction
            offsetDegrees: 90 // 90 degrees blocks the view perfectly when mouse aligns
        };

        let width, height;
        // Start mouse in center
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let rectangles = [];
        let isOffsetActive = false;

        // --- Initialization ---
        function init() {
            resize();
            window.addEventListener('resize', resize);
            
            // Mouse Events
            document.addEventListener('mousemove', onMove);
            
            // Touch Events (Mobile Support)
            document.addEventListener('touchstart', onTouch, { passive: false });
            document.addEventListener('touchmove', onTouch, { passive: false });
            
            btn.addEventListener('click', toggleOffset);

            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createRectangles();
        }

        function onMove(e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }

        function onTouch(e) {
            // Prevent scrolling while interacting
            if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                e.preventDefault();
            }
            const touch = e.touches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
        }

        function toggleOffset() {
            isOffsetActive = !isOffsetActive;
            btn.classList.toggle('active');
            btn.innerText = isOffsetActive ? "MODE: OFFSET (BLOCK)" : "MODE: ALIGNED (VIEW)";
        }

        function createRectangles() {
            rectangles = [];
            // Calculate how many fit
            const itemSpace = config.rectWidth + 40; 
            const count = Math.ceil(width / config.gap) + 2; // Extra padding
            
            const centerY = height / 2;
            const startX = (width / 2) - ((count * config.gap) / 2);

            for (let i = 0; i < count; i++) {
                rectangles.push({
                    cx: startX + (i * config.gap),
                    cy: centerY,
                    angle: 0
                });
            }
        }

        // --- Geometry & Math ---
        function rotatePoint(px, py, cx, cy, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: (cos * (px - cx)) - (sin * (py - cy)) + cx,
                y: (sin * (px - cx)) + (cos * (py - cy)) + cy
            };
        }

        function getCorners(rect) {
            const hw = config.rectWidth / 2;
            const hh = config.rectHeight / 2;
            // Define unrotated corners
            const pts = [
                { x: rect.cx - hw, y: rect.cy - hh },
                { x: rect.cx + hw, y: rect.cy - hh },
                { x: rect.cx + hw, y: rect.cy + hh },
                { x: rect.cx - hw, y: rect.cy + hh }
            ];
            return pts.map(p => rotatePoint(p.x, p.y, rect.cx, rect.cy, rect.angle));
        }

        function projectShadow(px, py, lx, ly) {
            // Project points away from light source to infinity (or far enough off screen)
            const dx = px - lx;
            const dy = py - ly;
            const len = Math.sqrt(dx*dx + dy*dy);
            const scale = 3000; // Project far away
            return {
                x: px + (dx / len) * scale,
                y: py + (dy / len) * scale
            };
        }

        // --- Animation Loop ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Update Angles based on Mouse/Touch
            rectangles.forEach(rect => {
                const dx = mouse.x - rect.cx;
                const dy = mouse.y - rect.cy;
                let angle = Math.atan2(dy, dx);
                
                if (isOffsetActive) {
                    angle += Math.PI / 2; // Add 90 degrees to make them perpendicular to vision
                }
                
                rect.angle = angle;
            });

            const visionRadius = Math.min(width, height) * 0.4;

            // 2. Draw Vision Cone (Red Light)
            ctx.save();
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, visionRadius, 0, Math.PI * 2);
            ctx.fillStyle = config.visionColor;
            ctx.fill();

            // 3. Cast Shadows (Erase the vision cone where walls block it)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = '#000'; // Color doesn't matter for destination-out

            rectangles.forEach(rect => {
                const corners = getCorners(rect);
                // Create shadow volumes for each edge
                for(let i = 0; i < corners.length; i++) {
                    const c1 = corners[i];
                    const c2 = corners[(i+1)%corners.length];
                    
                    // Project these two points away from mouse
                    const p1 = projectShadow(c1.x, c1.y, mouse.x, mouse.y);
                    const p2 = projectShadow(c2.x, c2.y, mouse.x, mouse.y);

                    ctx.beginPath();
                    ctx.moveTo(c1.x, c1.y);
                    ctx.lineTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(c2.x, c2.y);
                    ctx.closePath();
                    ctx.fill();
                }
            });
            ctx.restore();

            // 4. Draw Vision Border (The red ring, cut by shadows)
            ctx.save();
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, visionRadius, 0, Math.PI * 2);
            ctx.strokeStyle = config.visionBorder;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Re-apply shadow casting to the border stroke
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = '#000';
            rectangles.forEach(rect => {
                const corners = getCorners(rect);
                for(let i = 0; i < corners.length; i++) {
                    const c1 = corners[i];
                    const c2 = corners[(i+1)%corners.length];
                    const p1 = projectShadow(c1.x, c1.y, mouse.x, mouse.y);
                    const p2 = projectShadow(c2.x, c2.y, mouse.x, mouse.y);

                    ctx.beginPath();
                    ctx.moveTo(c1.x, c1.y);
                    ctx.lineTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(c2.x, c2.y);
                    ctx.fill();
                }
            });
            ctx.restore();

            // 5. Draw The Walls (The Physical Objects)
            ctx.fillStyle = config.wallColor;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;

            rectangles.forEach(rect => {
                ctx.save();
                ctx.translate(rect.cx, rect.cy);
                ctx.rotate(rect.angle);
                ctx.beginPath();
                ctx.rect(-config.rectWidth/2, -config.rectHeight/2, config.rectWidth, config.rectHeight);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
