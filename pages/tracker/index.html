<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Kloef · Life Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kloef">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://apis.google.com/js/api.js" defer></script>
<script src="https://accounts.google.com/gsi/client" defer></script>
<style>
    :root{
        --bg:#111418; --panel:#191d23; --panel2:#20252c; --line:#2b323b;
        --fg:#e7ecf1; --dim:#8a94a1; --accent:#37c7a6; --accent2:#e0a52b; --warn:#e2657a; --blue:#5aa9e6;
        --mono:'Courier New',Courier,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden}
    button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
    .mono{font-family:var(--mono)}

    /* ---- gate ---- */
    #gate{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
    #gate h1{font-family:var(--mono);font-size:28px;letter-spacing:8px;color:var(--accent)}
    #gate p{color:var(--dim);font-size:12px;letter-spacing:1px}
    #gate input{background:var(--panel);border:1px solid var(--line);padding:12px 16px;text-align:center;
        letter-spacing:3px;font-family:var(--mono);width:220px;outline:none;border-radius:6px}
    #gate input:focus{border-color:var(--accent)}
    #gate .err{color:var(--warn);font-size:11px;height:14px}

    /* ---- shell ---- */
    #app{display:none;height:100%;flex-direction:column}
    .topbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
        padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
    .topbar .brand{font-family:var(--mono);letter-spacing:3px;font-weight:bold;color:var(--accent)}
    .topbar .date{font-family:var(--mono);font-size:12px;color:var(--dim)}
    .layout{flex:1;display:flex;min-height:0}
    nav.side{width:180px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
    nav.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--dim);
        text-decoration:none;font-size:13px;letter-spacing:.3px;cursor:pointer;transition:.12s}
    nav.side a:hover{background:var(--panel2);color:var(--fg)}
    nav.side a.on{background:var(--accent);color:#04120e;font-weight:600}
    nav.side a .i{width:18px;text-align:center}
    main.view{flex:1;overflow-y:auto;padding:22px 26px 60px}
    section.page{display:none;max-width:900px;margin:0 auto}
    section.page.on{display:block;animation:fade .2s ease}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

    h2.ph{font-family:var(--mono);font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin:2px 0 16px}
    h3{font-size:15px;margin-bottom:10px;letter-spacing:.3px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
    .row{display:flex;align-items:center;gap:10px}
    .spacer{flex:1}
    .muted{color:var(--dim)}
    .small{font-size:12px}
    .pill{font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}

    .btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:8px 13px;border-radius:8px;cursor:pointer;transition:.12s;font-size:13px}
    .btn:hover{border-color:var(--accent);color:var(--fg)}
    .btn.acc{background:var(--accent);color:#04120e;border-color:var(--accent);font-weight:600}
    .btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
    .btn.ghost{background:transparent}
    .btn.warn:hover{border-color:var(--warn)}
    .ipt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
    .ipt:focus{border-color:var(--accent)}

    /* progress */
    .bar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
    .bar > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}

    /* task rows */
    .task{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line)}
    .task:last-child{border-bottom:none}
    .chk{width:19px;height:19px;border:2px solid var(--dim);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
    .chk:hover{border-color:var(--accent)}
    .task.done .chk{background:var(--accent);border-color:var(--accent);color:#04120e}
    .task.done .t-title{text-decoration:line-through;color:var(--dim)}
    .t-title{flex:1;font-size:13.5px}
    .est{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
    .mini{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:5px}
    .mini:hover{color:var(--fg);background:var(--panel2)}
    .mini.on{color:var(--accent2)}

    .habits{display:flex;flex-wrap:wrap;gap:8px}
    .habit{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:22px;cursor:pointer;user-select:none;transition:.12s}
    .habit:hover{border-color:var(--accent)}
    .habit.on{background:var(--accent);color:#04120e;border-color:var(--accent);font-weight:600}
    .habit .h-ic{font-size:14px}

    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .stat .n{font-family:var(--mono);font-size:26px;color:var(--accent)}
    .stat .l{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

    .timer{font-family:var(--mono);font-size:34px;letter-spacing:2px}
    .addrow{display:flex;gap:8px;margin-top:10px}

    .proj-head{display:flex;align-items:center;gap:10px;cursor:pointer}
    .dotc{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .lib-item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
    .lib-item .ttl{font-size:13px;font-weight:600;margin-bottom:3px}
    .status-b{font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:4px}
    .s-consuming{background:rgba(224,165,43,.18);color:var(--accent2)}
    .s-done{background:rgba(55,199,166,.18);color:var(--accent)}
    .s-backlog{background:var(--panel);color:var(--dim);border:1px solid var(--line)}

    /* ---- spine bookshelf ---- */
    .shelf-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
    .shelf-wrap{margin-bottom:24px}
    .shelf-title{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
    .shelf-title span{color:var(--accent)}
    .shelf{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.14));padding:0 8px;border-radius:4px 4px 0 0}
    .books{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap;min-height:190px;padding-top:16px}
    .shelf-board{height:15px;background:linear-gradient(180deg,#5a4632,#2e2119);border-radius:0 0 5px 5px;box-shadow:0 10px 16px rgba(0,0,0,.5)}
    .spine{--c:#456;position:relative;background:var(--c);border-radius:3px 3px 1px 1px;display:flex;flex-direction:column;
        align-items:center;justify-content:space-between;padding:9px 3px;cursor:pointer;overflow:hidden;flex-shrink:0;
        box-shadow:inset -4px 0 7px rgba(0,0,0,.30), inset 3px 0 4px rgba(255,255,255,.07);
        transition:transform .16s ease, box-shadow .16s ease}
    .spine::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:rgba(255,255,255,.16)}
    .spine::after{content:"";position:absolute;bottom:7px;left:0;right:0;height:2px;background:rgba(0,0,0,.24)}
    .spine:hover{transform:translateY(-12px) rotate(-1.2deg);box-shadow:0 14px 22px rgba(0,0,0,.5)}
    .spine-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:80%}
    .spine-author{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;opacity:.72;white-space:nowrap;overflow:hidden;max-height:24%}
    .spine.backlog{opacity:.42}
    .spine.consuming{outline:2px solid var(--accent2);outline-offset:-2px}
    .shelf-legend{display:flex;gap:16px;font-size:10.5px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
    .shelf-legend b{color:var(--fg);font-weight:normal}

    /* ---- stats viz ---- */
    .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
    .heat i{width:12px;height:12px;border-radius:2px;background:var(--panel2)}
    .heat-legend{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);margin-top:8px}
    .heat-legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
    textarea.ipt{min-height:84px;font-family:var(--mono);font-size:12px;resize:vertical;line-height:1.4}

    /* ---- skill tree ---- */
    .tree-wrap{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:12px;
        background:radial-gradient(circle at 50% 46%, #2a1f15, #130f0a 70%)}
    #treeSvg{width:100%;height:auto;display:block}
    .tl{stroke:#463829;stroke-width:2}
    .tl.twig{stroke:#3a3020;stroke-width:1.4}
    .tl.lit{stroke:#c8a24a;stroke-width:2.4;filter:drop-shadow(0 0 3px rgba(200,162,74,.55))}
    .tn circle{fill:#1b140d;stroke:#5c4a30;stroke-width:2;transition:.15s}
    .tn.core circle{fill:#c8a24a;stroke:#ecd693;stroke-width:3;filter:drop-shadow(0 0 9px rgba(200,162,74,.85))}
    .tn.project circle{stroke:var(--pc,#888);stroke-width:2.5}
    .tn.done circle{fill:#c8a24a;stroke:#f1de9d;filter:drop-shadow(0 0 6px rgba(200,162,74,.75))}
    .tn.partial circle{fill:#3a2f1c;stroke:#c8a24a}
    .tn.locked circle{opacity:.72}
    .tn.task circle{stroke-width:1.5}
    .tn:hover circle{stroke:#fff}
    .core-t{fill:#1a140d;font-family:var(--mono);font-size:9px;font-weight:bold}
    .ph-t{fill:#e7ecf1;font-family:var(--mono);font-size:9px;font-weight:bold}
    .tn.done .ph-t{fill:#1a140d}
    .pr-t{fill:#c9c0ae;font-size:9px;font-family:var(--sans)}
    #treeTip{position:absolute;pointer-events:none;background:rgba(10,9,7,.96);border:1px solid #c8a24a;border-radius:6px;
        padding:8px 11px;font-size:12px;max-width:224px;opacity:0;transition:.1s;z-index:20;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.6)}
    #treeTip .muted{color:#9a8f78}
    #treeSvg{cursor:grab;touch-action:none}
    #treeSvg:active{cursor:grabbing}
    .tree-zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:15}
    .tree-zoom button{width:30px;height:30px;background:rgba(20,16,11,.9);border:1px solid #5c4a30;color:#e7ecf1;font-size:15px;cursor:pointer;border-radius:6px}
    .tree-zoom button:hover{background:#c8a24a;color:#1a140d;border-color:#c8a24a}

    /* ---- wellbeing / reset ---- */
    .urge-btn{width:100%;padding:16px;font-size:15px;letter-spacing:.5px;border:1px solid var(--accent2);background:rgba(224,165,43,.08);
        color:var(--accent2);border-radius:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s}
    .urge-btn:hover{background:var(--accent2);color:#1a1204}
    .chiplist{display:flex;flex-wrap:wrap;gap:7px}
    .vchip{font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:20px;color:var(--fg);background:var(--panel2);display:flex;align-items:center;gap:7px}
    .vchip .x{color:var(--dim);cursor:pointer}
    .vchip .x:hover{color:var(--warn)}
    .bound{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
    .bound:last-child{border-bottom:none}
    .bound .chk{width:19px;height:19px;border:2px solid var(--dim);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.12s}
    .bound.on .chk{background:var(--accent);border-color:var(--accent);color:#04120e}
    .bound.on span{color:var(--dim);text-decoration:line-through}

    /* wellbeing overlay (urge / breathe) */
    #wellOverlay{position:fixed;inset:0;z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;
        gap:20px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 45%, #14232a, #0b1216 75%)}
    #wellOverlay.open{display:flex}
    #wellOverlay .w-kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
    #wellOverlay .w-title{font-size:22px;line-height:1.3;max-width:520px}
    #wellOverlay .w-sub{font-size:13px;color:var(--dim);max-width:480px;line-height:1.6}
    #wellOverlay .w-label{font-family:var(--mono);font-size:14px;color:var(--accent2);border:1px dashed var(--line);padding:10px 16px;border-radius:8px}
    .breath-circle{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(87,199,166,.55),rgba(87,199,166,.12));
        border:1px solid rgba(87,199,166,.6);transition:transform 4s ease-in-out;will-change:transform}
    .breath-label{font-size:18px;letter-spacing:2px;color:var(--fg);min-height:24px}
    .urge-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px}
    .urge-actions button{padding:11px 16px;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px}
    .urge-actions button:hover{background:var(--accent);color:#04120e}
    #wellOverlay .w-close{border:1px solid var(--line);background:transparent;color:var(--dim);padding:9px 18px;border-radius:8px;cursor:pointer;font-family:inherit}
    #wellOverlay .w-close:hover{color:var(--fg)}

    /* ---- library upgrades ---- */
    .spine{position:relative}
    .spine-cap{position:absolute;top:0;left:0;right:0;height:5px;z-index:3;opacity:.92}
    .reading-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
    .reading-card{flex:0 0 108px;cursor:pointer}
    .rc-cover{height:150px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:10px;text-align:center;padding:6px;overflow:hidden;background-size:cover !important}
    .rc-cover span{background:rgba(0,0,0,.45);padding:2px 5px;border-radius:3px}
    .rc-title{font-size:11px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rc-auth{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
    .rc-pct{font-size:9px;color:var(--dim);margin-top:3px}
    #bookModal{position:fixed;inset:0;z-index:820;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px}
    #bookModal.open{display:flex}
    .bm-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;width:100%;position:relative}
    .bm-x{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
    .bm-top{display:flex;gap:14px;margin-bottom:8px}
    .bm-cover{width:82px;height:120px;border-radius:5px;flex-shrink:0;background-size:cover !important;display:flex;align-items:center;justify-content:center;color:var(--dim);border:1px solid var(--line)}
    .bm-title{font-size:16px;font-weight:600;line-height:1.25}
    .bm-auth{font-size:12px;color:var(--dim);margin-bottom:6px}
    .bm-stars .star{font-size:19px;color:var(--line);cursor:pointer;transition:.1s}
    .bm-stars .star.on{color:var(--accent2)}
    .bm-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim);margin:12px 0 4px}
    .bm-status{display:flex;gap:6px}

    /* ---- projects: kanban + detail + badges ---- */
    .subbadge{font-size:9px;padding:1px 6px;border-radius:8px;background:var(--panel2);color:var(--dim);margin-left:3px;white-space:nowrap}
    .subbadge.soon{color:var(--accent2)} .subbadge.overdue{color:var(--warn)}
    .kb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .kb-col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
    .kb-h{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
    .kb-list{min-height:60px;display:flex;flex-direction:column;gap:8px;border-radius:8px;transition:.12s}
    .kb-list.drop{background:var(--panel2);outline:1px dashed var(--accent)}
    .kb-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab}
    .kb-card.dragging{opacity:.5}
    .kb-title{font-size:12.5px;line-height:1.3}
    .kb-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:5px;gap:8px}
    #taskModal{position:fixed;inset:0;z-index:820;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px}
    #taskModal.open{display:flex}
    .tm-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:440px;width:100%;position:relative;max-height:88vh;overflow-y:auto}

    /* ---- themes ---- */
    body.theme-calm{ --bg:#15171a; --panel:#1c1f23; --panel2:#23272c; --line:#2e3238; --fg:#dbe0e4; --dim:#878d94; --accent:#8fa0ac; --accent2:#a8a199; --warn:#b58c8c; --blue:#8fa0ac; }
    body.theme-calm main.view{ filter:saturate(.6); }
    body.theme-scp{ --bg:#080d08; --panel:#0d130d; --panel2:#111a11; --line:#1e2a1e; --fg:#86f79a; --dim:#4c7d55; --accent:#ffb000; --accent2:#ffb000; --warn:#ff6a5c; --blue:#63d0ff; font-family:var(--mono); }
    body.theme-scp main.view, body.theme-scp .topbar, body.theme-scp nav{ text-shadow:0 0 2px rgba(134,247,154,.35); }
    body.theme-scp .brand{ color:var(--accent) }
    body.theme-scp .card, body.theme-scp .stat{ border-color:#1e2a1e }
    #crt{position:fixed;inset:0;pointer-events:none;z-index:800;opacity:0;transition:opacity .4s;
        background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.16) 3px, rgba(0,0,0,.16) 3px)}
    body.crt-on #crt{opacity:1;animation:crtflick 4s infinite}
    @keyframes crtflick{0%,100%{opacity:.85}48%{opacity:1}52%{opacity:.92}}
    #boot{position:fixed;inset:0;z-index:950;background:#000;color:#86f79a;font-family:var(--mono);
        display:none;flex-direction:column;justify-content:center;padding:8vw;font-size:14px;line-height:1.95;letter-spacing:1px}
    .theme-sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .theme-sw button{flex:1;min-width:78px}
    .togrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);margin-top:8px;cursor:pointer;user-select:none}
    .togrow .sw{width:34px;height:18px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:.15s;flex-shrink:0}
    .togrow .sw::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.15s}
    .togrow.on .sw{background:var(--accent)} .togrow.on .sw::after{left:17px;background:#04120e}

    /* bottom nav (mobile) */
    nav.bottom{display:none}
    @media(max-width:720px){
        nav.side{display:none}
        /* notch-safe top bar */

    push(){ if(!this.ref) return; clearTimeout(this.pushT); const snap=JSON.parse(JSON.stringify(S));

function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):seed(); }catch(e){ return seed(); } }
function migrate(){ S.errands=S.errands||[]; S.inbox=S.inbox||[]; S.dayPlan=S.dayPlan||{}; S.dayLog=S.dayLog||{}; S.settings=S.settings||{};
    if(S.settings.fbKey===undefined)S.settings.fbKey="main"; if(S.settings.fbConfig===undefined)S.settings.fbConfig=""; if(S.settings.syncEnabled===undefined)S.settings.syncEnabled=false;

    const hTot=p.tasks.reduce((a,t)=>a+(+t.est||0),0);
    return {d,tot,pct:tot?Math.round(100*d/tot):0,hDone,hTot}; };
function habitStreak(){
    let n=0; const d=new Date();
    for(;;){ const k=d.toLocaleDateString("en-CA"); const log=S.habitLog[k];
        const any=log && Object.values(log).some(Boolean);
        if(k===todayStr() && !any){ d.setDate(d.getDate()-1); continue; } // today not done yet doesn't break streak
        if(any){ n++; d.setDate(d.getDate()-1); } else break;
        if(n>400) break;
    }
    return n;
}
function fmtEst(h){ h=+h||0; if(h<1) return Math.round(h*60)+"m"; return (Number.isInteger(h)?h:h.toFixed(1))+"h"; }

const DAY_BUDGET=8; // focus-hours target per day — keeps you under the 40h/wk cap

function dayPlanOf(date){ if(!S.dayPlan[date]) S.dayPlan[date]={top3:["","",""],notes:""}; if(!S.dayPlan[date].top3) S.dayPlan[date].top3=["","",""]; return S.dayPlan[date]; }

function plannedHours(date){ return errandsFor(date).filter(x=>!x.done).reduce((a,x)=>a+(+x.est||0),0)
    + pinnedFor(date).reduce((a,t)=>a+(+t.est||0),0); }
function loadMeter(date){ const h=plannedHours(date), pct=Math.min(100,Math.round(100*h/DAY_BUDGET));
    const col=h>DAY_BUDGET+1?"var(--warn)":h>DAY_BUDGET-2?"var(--accent2)":"var(--accent)";
    const note=h>DAY_BUDGET+1?"overloaded — cut something":h>DAY_BUDGET-2?"a full day":"room to breathe";
    return `<div class="card"><div class="row"><h3 style="margin:0">Planned load</h3><div class="spacer"></div><span class="mono">${h.toFixed(1)}h / ${DAY_BUDGET}h</span></div>
      <div class="bar" style="margin:10px 0"><i style="width:${pct}%;background:${col}"></i></div><div class="small muted">${note}</div></div>`; }
function top3HTML(date){ const p=dayPlanOf(date);
    return `<div class="card"><h3>Top 3 — the needle-movers</h3>

function errandsHTML(date){ const es=errandsFor(date);
    return `<div class="card"><div class="row"><h3 style="margin:0">Must-do</h3><div class="spacer"></div><span class="pill">${es.filter(e=>!e.done).length} open</span></div>

      <div class="addrow"><input class="ipt etitle" placeholder="Must-do (e.g. Internship 8h)…"><input class="ipt eest" placeholder="hrs" style="width:70px"><button class="btn acc eadd">＋</button></div></div>`; }
function pinnedHTML(date,label){ const ps=pinnedFor(date);
    return `<div class="card"><div class="row"><h3 style="margin:0">${label}</h3><div class="spacer"></div><span class="pill">${ps.length}</span></div>
      ${ps.length?ps.map(t=>taskRow(t)).join(""):'<p class="muted small" style="padding:6px 0">Pin project tasks with ☆, or use the picker.</p>'}
      <div class="addrow"><select class="ipt pickTask" style="flex:1"><option value="">Pin a project task…</option>${allTasks().filter(t=>!t.done&&t.today!==date).map(t=>`<option value="${t._pid}|${t.id}">${esc(t._pname)} · ${esc(t.title)}</option>`).join("")}</select><button class="btn pinBtn">Pin</button></div></div>`; }
function wireDay(el,date){
    el.querySelectorAll("[data-top3]").forEach(inp=>inp.addEventListener("change",()=>{ dayPlanOf(date).top3[+inp.dataset.top3]=inp.value; save(); }));
    el.querySelectorAll("[data-errand]").forEach(row=>{ const id=row.dataset.errand, er=S.errands.find(x=>x.id===id); if(!er)return;
        row.querySelector(".echk").onclick=()=>{ er.done=!er.done; commit(); };
        row.querySelector(".edel").onclick=()=>{ S.errands=S.errands.filter(x=>x.id!==id); commit(); };
        row.querySelector(".ecal").onclick=()=>addToCalendar({title:er.title,est:er.est}); });
    const eadd=el.querySelector(".eadd"); if(eadd) eadd.onclick=()=>{ const t=el.querySelector(".etitle").value.trim(); if(!t)return;
        S.errands.push({id:uid(),title:t,est:parseFloat(el.querySelector(".eest").value)||1,done:false,date}); commit(); };
    const pinBtn=el.querySelector(".pinBtn"); if(pinBtn) pinBtn.onclick=()=>{ const v=el.querySelector(".pickTask").value; if(!v)return;
        const [pid,tid]=v.split("|"); const[,t]=findTask(pid,tid); if(t){ t.today=date; commit(); } };

/* ----- urge + breathing overlay ----- */
let breathStop=null;
function wellEl(){ let o=document.getElementById("wellOverlay"); if(!o){ o=document.createElement("div"); o.id="wellOverlay"; document.body.appendChild(o); } return o; }
function closeWell(){ if(breathStop){breathStop();breathStop=null;} const o=document.getElementById("wellOverlay"); if(o) o.classList.remove("open"); }
function reducedMotion(){ return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
function runBreath(box, secondsTotal){
    const circle=box.querySelector(".breath-circle"), label=box.querySelector(".breath-label");
    const phases=[["Breathe in",4,1.6],["Hold",4,1.6],["Breathe out",4,1.0],["Hold",4,1.0]];
    const reduce=reducedMotion(); let pi=0, t=null, elapsed=0;
    function tick(){
        const [txt,secs,scale]=phases[pi%4]; if(label) label.textContent=txt;
        if(circle && !reduce){ circle.style.transitionDuration=secs+"s"; circle.style.transform="scale("+scale+")"; }
        pi++; elapsed+=secs;
        if(secondsTotal && elapsed>=secondsTotal){ return; }
        t=setTimeout(tick, secs*1000);
    }
    tick();
    return ()=>{ if(t) clearTimeout(t); };
}
function openBreathe(){
    const o=wellEl();
    o.innerHTML=`<div class="w-kicker">Grounding</div>
      <div class="breath-circle"></div><div class="breath-label">Get comfortable…</div>
      <div class="w-sub">Follow the circle. In for four, hold, out for four.</div>
      <button class="w-close" id="wClose">Done</button>`;
    o.classList.add("open");
    o.querySelector("#wClose").onclick=closeWell;
    breathStop=runBreath(o, null);
}
function openUrge(){

    o.innerHTML=`<div class="w-kicker">Noticing</div>

/* ----- task row (shared) ----- */
function daysUntil(d){ if(!d) return null; return Math.ceil((new Date(d)-new Date(todayStr()))/864e5); }
function dueBadge(d){ const n=daysUntil(d); if(n===null) return ""; if(n<0) return "overdue"; if(n===0) return "today"; return n+"d"; }
function taskRow(t){
    const subs=t.subtasks||[]; const subN=subs.length, subD=subs.filter(s=>s.done).length;
    const badges=(subN?`<span class="subbadge">☑ ${subD}/${subN}</span>`:"")+(t.due?`<span class="subbadge ${daysUntil(t.due)<0?'overdue':daysUntil(t.due)<=1?'soon':''}">${dueBadge(t.due)}</span>`:"");
    return `<div class="task ${t.done?'done':''}" data-tid="${t.id}" data-pid="${t._pid}">
        <div class="chk">${t.done?'✓':''}</div>
        <span class="t-title" data-open="1">${esc(t.title)} ${badges}</span>
        <span class="est">${fmtEst(t.est)}</span>
        <button class="mini ${t.today===todayStr()?'on':''}" data-act="pin" title="Pin to today">☆</button>
        <button class="mini" data-act="cal" title="Add to Google Calendar">📅</button>
        <button class="mini" data-act="del" title="Delete">✕</button>
    </div>`;
}
function findTask(pid,tid){ const p=S.projects.find(x=>x.id===pid); if(!p)return[null,null]; return [p,p.tasks.find(t=>t.id===tid)]; }
function wireTaskRows(scope){
    scope.querySelectorAll(".task[data-tid]").forEach(row=>{   // only real project-task rows, not errands/inbox
        const pid=row.dataset.pid, tid=row.dataset.tid;
        row.querySelector(".chk").onclick=()=>{ const[,t]=findTask(pid,tid); if(!t)return; t.done=!t.done; t.doneAt=t.done?todayStr():null; t.col=t.done?"done":"todo"; commit(); };
        const tt=row.querySelector(".t-title[data-open]"); if(tt) tt.onclick=()=>openTaskDetail(pid,tid);
        row.querySelectorAll(".mini").forEach(b=>b.onclick=()=>{
            const[,t]=findTask(pid,tid); if(!t)return; const act=b.dataset.act;
            if(act==="pin"){ t.today = t.today===todayStr()?null:todayStr(); commit(); }
            else if(act==="del"){ const p=S.projects.find(x=>x.id===pid); p.tasks=p.tasks.filter(x=>x.id!==tid); commit(); }
            else if(act==="cal"){ addToCalendar(t); }
        });
    });
}

/* ----- PROJECTS ----- */
let projectsView="list";
function newTask(title,est){ return {id:uid(),title,est:est||1,done:false,doneAt:null,today:null,col:"todo",subtasks:[],notes:"",link:"",due:null}; }
function taskCol(t){ return t.done?"done":(t.col==="doing"?"doing":"todo"); }
function setTaskCol(t,col){ if(col==="done"){ t.done=true; t.doneAt=todayStr(); t.col="done"; } else { t.done=false; t.doneAt=null; t.col=col; } }
function projDeadlineBadge(p){ if(!p.deadline) return ""; const n=daysUntil(p.deadline); const cls=n<0?"overdue":n<=3?"soon":""; return `<span class="subbadge ${cls}">⏳ ${n<0?"overdue":n+"d"}</span>`; }

      <div class="row" style="gap:8px;margin-top:12px"><button class="btn ${t.today===todayStr()?'acc':''}" id="tmPin">${t.today===todayStr()?'★ Pinned':'☆ Pin today'}</button><button class="btn warn" id="tmDel">Delete</button></div>
    </div>`;
    o.classList.add("open");
    const close=()=>o.classList.remove("open");
    o.onclick=e=>{ if(e.target===o) close(); };
    o.querySelector("#tmX").onclick=close;
    o.querySelector("#tmTitle").onchange=e=>{ t.title=e.target.value; commit(); };
    o.querySelector("#tmEst").onchange=e=>{ t.est=parseFloat(e.target.value)||0; commit(); };
    o.querySelector("#tmDue").onchange=e=>{ t.due=e.target.value||null; commit(); };
    o.querySelector("#tmLink").onchange=e=>{ t.link=e.target.value; save(); };
    o.querySelector("#tmNotes").onchange=e=>{ t.notes=e.target.value; save(); };
    o.querySelector("#tmSubBtn").onclick=()=>{ const v=o.querySelector("#tmSubAdd").value.trim(); if(!v)return; t.subtasks.push({title:v,done:false}); commit(); openTaskDetail(pid,tid); };
    o.querySelectorAll("[data-sub]").forEach(r=>r.onclick=e=>{ if(e.target.closest("[data-subdel]"))return; const i=+r.dataset.sub; t.subtasks[i].done=!t.subtasks[i].done; commit(); openTaskDetail(pid,tid); });
    o.querySelectorAll("[data-subdel]").forEach(b=>b.onclick=()=>{ t.subtasks.splice(+b.dataset.subdel,1); commit(); openTaskDetail(pid,tid); });
    o.querySelector("#tmPin").onclick=()=>{ t.today=t.today===todayStr()?null:todayStr(); commit(); openTaskDetail(pid,tid); };
    o.querySelector("#tmDel").onclick=()=>{ p.tasks=p.tasks.filter(x=>x.id!==tid); commit(); close(); };
}

function renderTree(el){
    const W=1200,H=840,cx=W/2,cy=H/2;
    const phaseList=PHASES.filter(ph=>S.projects.some(p=>p.phase===ph));
    const n=phaseList.length||1;
    const nodes=[], links=[];
    nodes.push({x:cx,y:cy,r:26,type:"core",label:"YOU",state:"core"});
    phaseList.forEach((ph,i)=>{
        const ang=(i/n)*2*Math.PI - Math.PI/2;
        const px=cx+Math.cos(ang)*155, py=cy+Math.sin(ang)*155;
        const projs=S.projects.filter(p=>p.phase===ph);
        const pdone=projs.reduce((a,p)=>a+p.tasks.filter(t=>t.done).length,0), ptot=projs.reduce((a,p)=>a+p.tasks.length,0);
        const pct=ptot?Math.round(100*pdone/ptot):0;
        nodes.push({x:px,y:py,r:16,type:"phase",label:ph.replace("Phase ","P").replace("Continuous","∞"),
            phaseId:ph,state:pct>=100?"done":pct>0?"partial":"locked",data:{ph,meta:PHASE_META[ph],pct,pdone,ptot}});
        const phaseIdx=nodes.length-1; links.push([0,phaseIdx]);
        const k=projs.length;
        projs.forEach((p,j)=>{
            const pa=ang+(k>1?(j-(k-1)/2):0)*0.36;
            const prx=cx+Math.cos(pa)*305, pry=cy+Math.sin(pa)*305;
            const s=projStats(p);
            nodes.push({x:prx,y:pry,r:13,type:"project",label:p.name,color:p.color,phaseId:ph,
                state:s.pct>=100?"done":s.pct>0?"partial":"locked",data:{p,s}});
            const projIdx=nodes.length-1; links.push([phaseIdx,projIdx]);
            const m=p.tasks.length, rr=44+Math.min(28,m*2.2);
            p.tasks.forEach((t,q)=>{
                const ta=pa+(q-(m-1)/2)*0.5;
                nodes.push({x:prx+Math.cos(ta)*rr,y:pry+Math.sin(ta)*rr,r:5,type:"task",color:p.color,phaseId:ph,
                    state:t.done?"done":"locked",data:{t,p}});
                links.push([projIdx,nodes.length-1,"twig"]);
            });
        });
    });
    const linkSvg=links.map(([a,b,ty])=>{const A=nodes[a],B=nodes[b];
        return `<line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" class="tl ${ty||'main'} ${nodes[b].state==='done'?'lit':''}"/>`;}).join("");
    const nodeSvg=nodes.map((nd,i)=>`<g class="tn ${nd.type} ${nd.state}" data-node="${i}" transform="translate(${nd.x.toFixed(1)},${nd.y.toFixed(1)})">
        <circle r="${nd.r}" ${nd.color?`style="--pc:${nd.color}"`:''}></circle>
        ${nd.type==="core"?'<text class="core-t" text-anchor="middle" dy="4">NOW</text>':''}
        ${nd.type==="phase"?`<text class="ph-t" text-anchor="middle" dy="4">${esc(nd.label)}</text>`:''}
        ${nd.type==="project"?`<text class="pr-t" text-anchor="middle" dy="${nd.r+13}">${esc(nd.label)}</text>`:''}
      </g>`).join("");
    const overall=(()=>{ const ts=allTasks(); const d=ts.filter(t=>t.done).length; return ts.length?Math.round(100*d/ts.length):0; })();
    el.innerHTML=`<h2 class="ph">Roadmap · your passive tree <span class="pill mono">${overall}% allocated</span></h2>
      <div class="small muted" style="margin-bottom:8px">Scroll to zoom · drag to pan · hover for detail · click a task node to (un)complete.</div>
      <div class="tree-wrap">
        <svg viewBox="0 0 ${W} ${H}" id="treeSvg"><g id="treeG">${linkSvg}${nodeSvg}</g></svg>
        <div class="tree-zoom"><button id="tzin" title="Zoom in">＋</button><button id="tzout" title="Zoom out">−</button><button id="tzfit" title="Reset view">⤢</button></div>
        <div id="treeTip"></div></div>`;
    const svg=el.querySelector("#treeSvg"), gEl=el.querySelector("#treeG"), tip=el.querySelector("#treeTip");
    let tv={scale:treeView.scale,tx:treeView.tx,ty:treeView.ty,drag:false,sx:0,sy:0,moved:false};
    const applyTV=()=>{ gEl.setAttribute("transform",`translate(${tv.tx.toFixed(1)},${tv.ty.toFixed(1)}) scale(${tv.scale.toFixed(3)})`); treeView={scale:tv.scale,tx:tv.tx,ty:tv.ty}; };
    const vbK=()=>{ const r=svg.getBoundingClientRect(); return {r,k:W/(r.width||W)}; };
    function zoomAt(vx,vy,f){ const ns=Math.max(0.4,Math.min(4,tv.scale*f)); tv.tx=vx-(vx-tv.tx)*(ns/tv.scale); tv.ty=vy-(vy-tv.ty)*(ns/tv.scale); tv.scale=ns; applyTV(); }
    applyTV();
    svg.addEventListener("wheel",e=>{ e.preventDefault(); const {r,k}=vbK(); zoomAt((e.clientX-r.left)*k,(e.clientY-r.top)*k, e.deltaY<0?1.12:1/1.12); },{passive:false});
    svg.addEventListener("mousedown",e=>{ tv.drag=true; tv.moved=false; tv.sx=e.clientX; tv.sy=e.clientY; });
    svg.addEventListener("mousemove",e=>{ if(!tv.drag)return; const {k}=vbK(); tv.tx+=(e.clientX-tv.sx)*k; tv.ty+=(e.clientY-tv.sy)*k; if(Math.abs(e.clientX-tv.sx)+Math.abs(e.clientY-tv.sy)>2) tv.moved=true; tv.sx=e.clientX; tv.sy=e.clientY; applyTV(); });
    const endDrag=()=>{ tv.drag=false; }; svg.addEventListener("mouseup",endDrag); svg.addEventListener("mouseleave",endDrag);
    let lastDist=null;
    svg.addEventListener("touchstart",e=>{ if(e.touches.length===1){ tv.drag=true; tv.moved=false; tv.sx=e.touches[0].clientX; tv.sy=e.touches[0].clientY; } else if(e.touches.length===2){ const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; lastDist=Math.hypot(dx,dy); } },{passive:true});
    svg.addEventListener("touchmove",e=>{ const {r,k}=vbK(); if(e.touches.length===2&&lastDist){ const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; const d=Math.hypot(dx,dy); zoomAt(((e.touches[0].clientX+e.touches[1].clientX)/2-r.left)*k,((e.touches[0].clientY+e.touches[1].clientY)/2-r.top)*k,d/lastDist); lastDist=d; e.preventDefault(); } else if(e.touches.length===1&&tv.drag){ tv.tx+=(e.touches[0].clientX-tv.sx)*k; tv.ty+=(e.touches[0].clientY-tv.sy)*k; tv.sx=e.touches[0].clientX; tv.sy=e.touches[0].clientY; tv.moved=true; applyTV(); e.preventDefault(); } },{passive:false});
    svg.addEventListener("touchend",()=>{ tv.drag=false; lastDist=null; });
    el.querySelector("#tzin").onclick=()=>zoomAt(W/2,H/2,1.2);
    el.querySelector("#tzout").onclick=()=>zoomAt(W/2,H/2,1/1.2);
    el.querySelector("#tzfit").onclick=()=>{ tv.scale=1; tv.tx=0; tv.ty=0; applyTV(); };
    function zoomToPhase(ph){
        const sub=nodes.filter(nd=>nd.phaseId===ph); if(!sub.length) return;
        const xs=sub.map(nd=>nd.x), ys=sub.map(nd=>nd.y);
        const minX=Math.min(...xs)-40,maxX=Math.max(...xs)+40,minY=Math.min(...ys)-40,maxY=Math.max(...ys)+40;
        const dx=maxX-minX||1, dy=maxY-minY||1, ns=Math.max(0.4,Math.min(4,Math.min(W/dx,H/dy)));
        tv.scale=ns; tv.tx=W/2-ns*(minX+maxX)/2; tv.ty=H/2-ns*(minY+maxY)/2;
        gEl.style.transition="transform .5s ease"; applyTV(); setTimeout(()=>{ gEl.style.transition=""; },520);
    }
    svg.querySelectorAll(".tn").forEach(gn=>{ const nd=nodes[+gn.dataset.node];
        gn.addEventListener("mousemove",e=>{ if(!tv.drag) showTip(tip,e,nd); });
        gn.addEventListener("mouseleave",()=>{tip.style.opacity=0;});
        if(nd.type==="task"){ gn.style.cursor="pointer"; gn.addEventListener("click",()=>{ if(tv.moved)return; const[,t]=findTask(nd.data.p.id,nd.data.t.id); if(t){ t.done=!t.done; t.doneAt=t.done?todayStr():null; commit(); } }); }
        else if(nd.type==="phase"){ gn.style.cursor="pointer"; gn.addEventListener("click",()=>{ if(!tv.moved) zoomToPhase(nd.phaseId); }); }
    });
}
function showTip(tip,e,nd){
    const wrap=tip.parentElement.getBoundingClientRect();
    let html="";
    if(nd.type==="core") html=`<b>Now</b><br><span class="muted">Your two-year passive tree</span>`;
    else if(nd.type==="phase") html=`<b>${esc(nd.data.ph)}</b><br><span class="muted">${esc(nd.data.meta||"")}</span><br>${nd.data.pdone}/${nd.data.ptot} tasks · ${nd.data.pct}%`;
    else if(nd.type==="project"){ const p=nd.data.p; html=`<b>${esc(p.name)}</b> <span class="muted">· ${esc(p.phase)}</span><br>${nd.data.s.d}/${nd.data.s.tot} tasks · ${nd.data.s.hDone}/${nd.data.s.hTot}h · ${nd.data.s.pct}%`+(p.deadline?`<br><span style="color:var(--accent2)">⏳ due in ${daysUntil(p.deadline)}d</span>`:""); }
    else html=`<b>${esc(nd.data.t.title)}</b><br><span class="muted">${esc(nd.data.p.name)} · ${fmtEst(nd.data.t.est)} · ${nd.data.t.done?'✓ done':'to do'}</span>`;
    tip.innerHTML=html; tip.style.opacity=1;
    let x=e.clientX-wrap.left+14, y=e.clientY-wrap.top+14;
    if(x+230>wrap.width) x=e.clientX-wrap.left-230;
    if(y+90>wrap.height) y=wrap.height-95;
    tip.style.left=x+"px"; tip.style.top=y+"px";
}

/* ----- LIBRARY (spine bookshelf) ----- */
const LIB_TYPES=["Manga","Books","Boardgames","Comics","Movies","Podcasts"];
let libFilter="all";
function hashInt(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function textOn(hex){ if(!/^#[0-9a-f]{6}$/i.test(hex)) return "#f2efe8";
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)>150 ? "#1a1a1a" : "#f4f1ea"; }
function authorColor(a){ if(!a) return "#4a5560"; let h=0; a=String(a); for(let i=0;i<a.length;i++)h=(h*31+a.charCodeAt(i))>>>0; return `hsl(${h%360},42%,52%)`; }
function desat(hex,amt){ if(!/^#[0-9a-f]{6}$/i.test(hex)) return "#333"; let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); const gy=(r+g+b)/3; const mix=v=>Math.round(v+(gy-v)*amt); const t=v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0'); return "#"+t(mix(r))+t(mix(g))+t(mix(b)); }
function fillPct(l){ return l.status==="backlog"?0:(l.status==="done"?100:(+l.progress||0)); }
function spine(l){
    const h=170 + hashInt(l.title)%54, w=28 + hashInt(l.title+l.type)%16, c=l.color||"#45566b";
    const p=fillPct(l), dim=desat(c,0.74);
    const bg=`linear-gradient(to top, ${c} 0%, ${c} ${p}%, ${dim} ${p}%, ${dim} 100%)`;
    return `<div class="spine ${l.status}" data-lib="${l.id}" title="${esc(l.title)}${l.author?' — '+esc(l.author):''} · ${p}% read"
        style="height:${h}px;width:${w}px;color:${textOn(c)};background:${bg}">
        <span class="spine-cap" style="background:${authorColor(l.author)}"></span>
        <span class="spine-title">${esc(l.title)}</span>${l.author?`<span class="spine-author">${esc(l.author)}</span>`:'<span></span>'}</div>`;
}
async function lookupBook(title,author){
    try{ const url="https://openlibrary.org/search.json?title="+encodeURIComponent(title)+(author?"&author="+encodeURIComponent(author):"")+"&limit=1&fields=author_name,cover_i";
        const r=await fetch(url); const d=await r.json(); const doc=(d.docs||[])[0]; if(!doc) return null;
        return { author:(doc.author_name||[])[0]||"", coverUrl:doc.cover_i?`https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`:"" };
    }catch(e){ return null; }
}
function renderLibrary(){
    const el=document.getElementById("page-library");
    const types=[...new Set(S.library.map(l=>l.type))];
    const reading=S.library.filter(l=>l.status==="consuming").sort((a,b)=>(b.progress||0)-(a.progress||0));
    const spotlight = reading.length ? `<div class="card"><h3>Reading now <span class="muted small">(${reading.length})</span></h3>
        <div class="reading-row">${reading.map(l=>`<div class="reading-card" data-lib="${l.id}">
          <div class="rc-cover" style="background:${l.coverUrl?`center/cover url('${l.coverUrl}')`:l.color}">${l.coverUrl?"":`<span>${esc(l.title.slice(0,22))}</span>`}</div>
          <div class="rc-title">${esc(l.title)}</div><div class="rc-auth">${esc(l.author||"")}</div>
          <div class="bar" style="height:5px"><i style="width:${l.progress||0}%"></i></div><div class="rc-pct">${l.progress||0}% read</div>
        </div>`).join("")}</div></div>` : "";
    const shelves=(libFilter==="all"?types:[libFilter]).map(type=>{
        const items=S.library.filter(l=>l.type===type).sort((a,b)=>(a.author||"~").localeCompare(b.author||"~")||a.title.localeCompare(b.title));
        if(!items.length) return "";
        return `<div class="shelf-wrap"><div class="shelf-title">${type} <span>${items.length}</span></div>
            <div class="shelf"><div class="books">${items.map(spine).join("")}</div></div><div class="shelf-board"></div></div>`;
    }).join("");
    el.innerHTML=`<h2 class="ph">Library · ${S.library.length} volumes</h2>
      ${spotlight}
      <div class="shelf-controls">
        <button class="btn sm ${libFilter==='all'?'acc':''}" data-lf="all">All</button>
        ${types.map(t=>`<button class="btn sm ${libFilter===t?'acc':''}" data-lf="${t}">${t}</button>`).join("")}
        <div class="spacer"></div><button class="btn sm" id="libAddToggle">＋ Add</button>
      </div>
      <div class="card" id="libAddCard" style="display:none"><div class="addrow">
        <select class="ipt" id="libType" style="width:110px">${LIB_TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
        <input class="ipt" id="libTitle" placeholder="Title…">
        <input class="ipt" id="libAuthor" placeholder="Author (auto)" style="width:130px">
        <input class="ipt" id="libColor" type="color" value="#4a6b8c" style="width:46px;padding:2px;height:38px">
        <button class="btn acc" id="libAdd">Add</button></div>
        <div class="small muted" style="margin-top:6px">Leave author blank to auto-fill title + cover from OpenLibrary.</div></div>
      ${shelves||'<p class="muted small">Empty — add your first book.</p>'}
      <div class="shelf-legend"><span>Spine fills as you read · top band = author · click a book for details.</span></div>`;
    el.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{ libFilter=b.dataset.lf; renderLibrary(); });
    el.querySelector("#libAddToggle").onclick=()=>{ const c=el.querySelector("#libAddCard"); c.style.display=c.style.display==="none"?"block":"none"; };
    el.querySelector("#libAdd").onclick=async()=>{ const ti=el.querySelector("#libTitle").value.trim(); if(!ti)return;
        const item={id:uid(),type:el.querySelector("#libType").value,title:ti,author:el.querySelector("#libAuthor").value.trim(),
            color:el.querySelector("#libColor").value,status:"consuming",rating:0,progress:0,coverUrl:""};
        S.library.push(item); commit();
        if(!item.author){ const m=await lookupBook(ti); if(m){ item.author=m.author; item.coverUrl=m.coverUrl; commit(); } } };
    el.querySelectorAll(".spine, .reading-card").forEach(sp=>sp.onclick=()=>openBookDetail(sp.dataset.lib));
}
function openBookDetail(id){
    const l=S.library.find(x=>x.id===id); if(!l) return;
    let o=document.getElementById("bookModal"); if(!o){ o=document.createElement("div"); o.id="bookModal"; document.body.appendChild(o); }

function heatColor(n){ if(!n) return "var(--panel2)"; return `rgba(55,199,166,${Math.min(1,0.22+n*0.22)})`; }
function renderStats(){

    const ts=allTasks(); const done=ts.filter(t=>t.done);
    const hoursDone=done.reduce((a,t)=>a+(+t.est||0),0);
    const pct=ts.length?Math.round(100*done.length/ts.length):0;
    let weekFocus=0; const d=new Date();
    for(let i=0;i<7;i++){ const k=d.toLocaleDateString("en-CA"); weekFocus+=(S.dayLog[k]&&S.dayLog[k].focusMin)||0; d.setDate(d.getDate()-1); }

    const maxM=Math.max(60,...days.map(x=>x.m));
    // donut

      <div class="card"><div class="donut-wrap">

          <text x="60" y="77" text-anchor="middle" font-size="10" fill="#8a94a1">complete</text>
        </svg>
        <div style="flex:1;min-width:180px">
          <div class="grid2">
            <div class="stat"><div class="n">${done.length}</div><div class="l">Tasks done</div></div>
            <div class="stat"><div class="n">${hoursDone}h</div><div class="l">Hours shipped</div></div>
            <div class="stat"><div class="n">🔥 ${habitStreak()}</div><div class="l">Habit streak</div></div>
            <div class="stat"><div class="n">${weekFocus}</div><div class="l">Focus min · 7d</div></div>
          </div>
        </div>
      </div></div>
      <div class="card"><h3>Momentum · tasks completed, last 12 weeks</h3>
        <div class="heat">${cells}</div>
        <div class="heat-legend">less <i style="background:var(--panel2)"></i><i style="background:${heatColor(1)}"></i><i style="background:${heatColor(2)}"></i><i style="background:${heatColor(4)}"></i> more</div>
      </div>
      <div class="card"><h3>Deep focus · last 7 days</h3>
        <div class="row" style="align-items:flex-end;gap:10px;height:120px;padding-top:10px">
          ${days.map(x=>`<div style="flex:1;text-align:center">
            <div style="height:90px;display:flex;align-items:flex-end"><div style="width:100%;background:var(--accent);border-radius:4px 4px 0 0;height:${Math.round(90*x.m/maxM)}px;min-height:2px"></div></div>
            <div class="small muted mono" style="margin-top:4px">${x.lbl}</div><div class="small muted mono">${x.m}</div>
          </div>`).join("")}
        </div></div>

        ${S.projects.map(p=>{const s=projStats(p);return `<div class="row small" style="padding:5px 0"><span class="dotc" style="background:${p.color}"></span>${esc(p.name)}<div class="spacer"></div><div class="bar" style="width:120px;margin:0 10px"><i style="width:${s.pct}%;background:${p.color}"></i></div><span class="mono muted">${s.pct}%</span></div>`;}).join("")}

/* ---------------- focus timer ---------------- */
let timer={sec:1500,run:false,iv:null};
function wireTimer(el){
    const startBtn=el.querySelector("#timerStart"); if(!startBtn) return;
    const paint=()=>{ const disp=document.getElementById("timer"); if(!disp) return;
        disp.textContent=`${String(Math.floor(timer.sec/60)).padStart(2,'0')}:${String(timer.sec%60).padStart(2,'0')}`; };
    paint();
    // reflect state if we re-rendered mid-run
    startBtn.textContent = timer.run ? "Pause" : "Start";
    startBtn.classList.toggle("acc", !timer.run);
    startBtn.onclick=()=>{
        if(timer.run){ clearInterval(timer.iv); timer.run=false; startBtn.textContent="Start"; startBtn.classList.add("acc"); logFocus(); }
        else{ timer.run=true; startBtn.textContent="Pause"; startBtn.classList.remove("acc");
            timer.iv=setInterval(()=>{ if(timer.sec>0){ timer.sec--; paint(); } else { clearInterval(timer.iv); timer.run=false; logFocus(true); } },1000); }
    };
    el.querySelector("#timerReset").onclick=()=>{ clearInterval(timer.iv); timer.run=false; timer.sec=1500; paint(); startBtn.textContent="Start"; startBtn.classList.add("acc"); };
    let lastLogged=timer.sec;
    function logFocus(finished){ const spent=Math.round((lastLogged-timer.sec)/60);
        if(spent>0){ const td=todayStr(); const d=S.dayLog[td]=S.dayLog[td]||{}; d.focusMin=(d.focusMin||0)+spent;
            d.byActivity=d.byActivity||{}; d.byActivity[currentActivity]=(d.byActivity[currentActivity]||0)+spent;
            const hb=ACT_HABIT[currentActivity]; if(hb){ S.habitLog[td]=S.habitLog[td]||{}; S.habitLog[td][hb]=true; }
            save(); }
        lastLogged=timer.sec;
        if(finished){ timer.sec=1500; toast("Focus block done · "+currentActivity+" logged"); }
        // refresh the logged-today breakdown live, on pause AND on completion
        if(spent>0 || finished){ renderToday(); renderStats(); } }
}

/* ---------------- Google Calendar (two-way, optional) ---------------- */
let gcal={ready:false,token:null,tokenClient:null,gapiInited:false};
function gcalConnect(){
    const {gClientId,gApiKey}=S.settings;
    if(!gClientId||!gApiKey){ toast("Add Client ID + API key first"); return; }
    if(typeof gapi==="undefined"||typeof google==="undefined"){ toast("Google scripts still loading — try again"); return; }
    gapi.load("client",async()=>{
        try{
            await gapi.client.init({apiKey:gApiKey,discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"]});
            gcal.gapiInited=true;
            gcal.tokenClient=google.accounts.oauth2.initTokenClient({
                client_id:gClientId, scope:"https://www.googleapis.com/auth/calendar.events",
                callback:(resp)=>{ if(resp.error){toast("Auth failed");return;} gcal.token=resp; gcal.ready=true; toast("Calendar connected"); renderSettings(); gcalListToday(); }
            });
            gcal.tokenClient.requestAccessToken({prompt:""});
        }catch(e){ toast("Calendar init failed — check keys/origin"); console.error(e); }
    });
}
async function gcalListToday(){
    if(!gcal.ready)return; const box=document.getElementById("gEvents"); if(!box)return;
    try{
        const start=new Date(); start.setHours(0,0,0,0);
        const res=await gapi.client.calendar.events.list({calendarId:S.settings.calId||"primary",timeMin:start.toISOString(),maxResults:8,singleEvents:true,orderBy:"startTime"});
        const items=res.result.items||[];
        box.innerHTML="<h3 style='font-size:13px;margin:6px 0'>Upcoming</h3>"+(items.length?items.map(ev=>{
            const t=ev.start.dateTime?new Date(ev.start.dateTime).toLocaleString(undefined,{weekday:'short',hour:'2-digit',minute:'2-digit'}):"all-day";
            return `<div class="small" style="padding:3px 0"><span class="mono muted">${t}</span> · ${esc(ev.summary||"(no title)")}</div>`;
        }).join(""):"<p class='small muted'>No upcoming events.</p>");
    }catch(e){ box.innerHTML="<p class='small muted'>Couldn't load events.</p>"; }
}
function addToCalendar(t){
    const start=new Date(); start.setHours(9,0,0,0);
    const end=new Date(start.getTime()+Math.max(0.5,+t.est||1)*3600*1000);
    if(gcal.ready){
        gapi.client.calendar.events.insert({calendarId:S.settings.calId||"primary",resource:{
            summary:t.title, start:{dateTime:start.toISOString()}, end:{dateTime:end.toISOString()}
        }}).then(()=>{toast("Added to Google Calendar");gcalListToday();}).catch(()=>toast("Add failed"));
    } else {
        const fmt=d=>d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
        const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${fmt(start)}/${fmt(end)}`;
        window.open(url,"_blank");
    }
}

let toastT; function toast(m){ let t=document.getElementById("_toast"); if(!t){ t=document.createElement("div"); t.id="_toast";
    t.style.cssText="position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#20252c;border:1px solid var(--line);color:var(--fg);padding:9px 16px;border-radius:8px;z-index:200;font-size:13px;opacity:0;transition:.2s"; document.body.appendChild(t);}

/* ---------------- Firebase cloud sync (optional) ---------------- */
function loadFirebaseScripts(){
    return new Promise((res,rej)=>{
        if(window.firebase && window.firebase.firestore){ res(); return; }
        const add=src=>new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
        add("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js")
          .then(()=>add("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"))
          .then(res).catch(rej);
    });
}
async function syncEnable(silent){
    const cfgRaw=(S.settings.fbConfig||"").trim(), key=((S.settings.fbKey||"main").trim())||"main";
    if(!cfgRaw){ if(!silent) toast("Paste your Firebase config first"); return; }
    let cfg;
    try{ cfg=JSON.parse(cfgRaw); }
    catch(e){ try{ cfg=Function("return ("+cfgRaw.replace(/^\s*(?:const|let|var)\s+\w+\s*=\s*/,"").replace(/;\s*$/,"")+")")(); }
        catch(e2){ if(!silent) toast("Couldn't parse the config"); return; } }
    try{
        await loadFirebaseScripts();
        if(!firebase.apps.length) firebase.initializeApp(cfg);
        sync.db=firebase.firestore();
        sync.ref=sync.db.doc("kloef/"+key);
        const snap=await sync.ref.get();
        if(snap.exists){
            const remote=snap.data();
            if((remote._updatedAt||0) > (S._updatedAt||0)){ sync.applying=true; S=remote; localStorage.setItem(KEY,JSON.stringify(S)); sync.applying=false; renderAll(); }
            else { sync.ref.set(JSON.parse(JSON.stringify(S))); }
        } else { sync.ref.set(JSON.parse(JSON.stringify(S))); }
        sync.ref.onSnapshot(doc=>{ if(!doc.exists) return; const remote=doc.data();
            if((remote._updatedAt||0) > (S._updatedAt||0)){ sync.applying=true; S=remote; localStorage.setItem(KEY,JSON.stringify(S)); sync.applying=false; renderAll(); } });
        sync.on=true; S.settings.syncEnabled=true; localStorage.setItem(KEY,JSON.stringify(S));
        if(!silent) toast("Cloud sync on"); renderSettings();
    }catch(e){ console.error(e); if(!silent) toast("Sync failed — check config & Firestore rules"); }
}
function syncDisable(){ sync.on=false; S.settings.syncEnabled=false; save(); toast("Cloud sync off"); renderSettings(); }

/* ---------------- notifications / reminders ---------------- */
function notifSupported(){ return "Notification" in window; }
async function showNotif(title, body, silent){
    try{
        if(navigator.serviceWorker && navigator.serviceWorker.ready){ const reg=await navigator.serviceWorker.ready;
            reg.showNotification(title,{ body, icon:"icon-192.png", badge:"icon-192.png", tag:"kloef", renotify:!silent }); }
        else if(notifSupported() && Notification.permission==="granted"){ new Notification(title,{ body, icon:"icon-192.png" }); }
    }catch(e){}
}
async function enableNotifs(){
    if(!notifSupported()){ toast("Notifications not supported here"); return; }
    const p=await Notification.requestPermission();
    S.settings.reminders.enabled=(p==="granted"); save(); renderSettings();
    if(p==="granted"){ registerPeriodicSync(); startReminders(); showNotif("Kloef","Notifications on — I'll nudge you to plan and reset.",true); }
    else toast("Permission: "+p);
}
function competitionNudge(){ const c=S.projects.find(p=>p.deadline); if(!c) return ""; const n=daysUntil(c.deadline); return (n!=null&&n<=7)?` · ${c.name} in ${n<0?"overdue":n+"d"}`:""; }
function reminderTick(){
    const r=S.settings.reminders; if(!r||!r.enabled) return;
    if(!notifSupported()||Notification.permission!=="granted") return;
    const td=todayStr(), now=new Date(), hm=String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');
    S.settings.reminderLog[td]=S.settings.reminderLog[td]||{};
    const fire=(key,time,title,body)=>{ if(time && hm>=time && !S.settings.reminderLog[td][key]){ S.settings.reminderLog[td][key]=true; save(); showNotif(title,body); } };
    fire("morning", r.morning, "Good morning ☀️", "Set your Top 3 and glance at today's must-dos."+competitionNudge());
    fire("evening", r.evening, "Evening check-in 🌙", "Plan tomorrow, log your focus, keep your boundaries."+competitionNudge());
}
let reminderIv=null;
function startReminders(){ if(reminderIv) clearInterval(reminderIv); reminderTick(); reminderIv=setInterval(reminderTick, 60000); }
async function registerPeriodicSync(){
    try{ const reg=await navigator.serviceWorker.ready; if(reg && "periodicSync" in reg){
        const st=await navigator.permissions.query({name:"periodic-background-sync"});
        if(st.state==="granted"){ await reg.periodicSync.register("kloef-reminder",{ minInterval:12*60*60*1000 }); } } }catch(e){}
}

/* ---------------- theming ---------------- */
function ensureCRT(){ if(!document.getElementById("crt")){ const c=document.createElement("div"); c.id="crt"; document.body.appendChild(c); } }
function applyTheme(){
    const t=(S.settings&&S.settings.theme)||"default";
    document.body.classList.remove("theme-calm","theme-scp","crt-on");
    if(t==="calm") document.body.classList.add("theme-calm");
    if(t==="scp"){ document.body.classList.add("theme-scp"); ensureCRT(); if(S.settings.scpCRT && !reducedMotion()) document.body.classList.add("crt-on"); }
}
function runBoot(force){
    if(!force && ((S.settings.theme!=="scp") || !S.settings.scpAnim || reducedMotion())) return;
    if((S.settings.theme!=="scp")) return;
    if(!S.settings.scpAnim || reducedMotion()) return;
    let b=document.getElementById("boot"); if(!b){ b=document.createElement("div"); b.id="boot"; document.body.appendChild(b); }
    b.style.display="flex"; b.style.opacity="1"; b.innerHTML="";
    const lines=[
        "SCiP FOUNDATION — SECURE INTRANET TERMINAL",
        "> establishing encrypted uplink ............ [OK]",
        "> verifying clearance: LEVEL 4 / OVERSEER ... [OK]",
        "> mounting personnel dossier: D. VAN DER SMAN",
        "> decrypting life-tracker.db ............... [OK]",
        "",
        "ACCESS GRANTED"
    ];
    let li=0;
    (function typeLine(){
        if(li>=lines.length){ setTimeout(()=>{ b.style.transition="opacity .6s"; b.style.opacity="0"; setTimeout(()=>{ b.style.display="none"; b.style.transition=""; }, 640); }, 550); return; }
        const line=lines[li], div=document.createElement("div"); b.appendChild(div); let ci=0;
        (function typeChar(){ div.textContent=line.slice(0,ci); ci++; if(ci<=line.length){ setTimeout(typeChar, 12); } else { li++; setTimeout(typeLine, line===""?60:150); } })();
    })();
}

/* ---------------- gate + boot ---------------- */
function unlock(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="flex";
    sessionStorage.setItem("kloefUnlocked","1"); if(!location.hash)location.hash="today"; applyTheme(); renderAll(); route(); runBoot();
    if(S.settings && S.settings.syncEnabled) syncEnable(true);
    if(S.settings.reminders && S.settings.reminders.enabled){ startReminders(); registerPeriodicSync(); } }
document.getElementById("gateInput").addEventListener("keydown",e=>{ if(e.key!=="Enter")return;
    if(e.target.value.trim().toLowerCase()==="kloef"){ unlock(); } else { document.getElementById("gateErr").textContent="nope."; e.target.value=""; } });

document.addEventListener("click",e=>{ const a=e.target.closest("[data-go]"); if(a){ location.hash=a.dataset.go; } });
window.addEventListener("hashchange",route);
document.getElementById("lockBtn").onclick=()=>{ sessionStorage.removeItem("kloefUnlocked"); location.reload(); };

if(sessionStorage.getItem("kloefUnlocked")==="1"){ unlock(); }
else { document.getElementById("gateInput").focus(); }
</script>

if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
