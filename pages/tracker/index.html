<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kloef · Life Tracker</title>
<script src="https://apis.google.com/js/api.js" defer></script>
<script src="https://accounts.google.com/gsi/client" defer></script>
<style>
    :root{
        --bg:#111418; --panel:#191d23; --panel2:#20252c; --line:#2b323b;
        --fg:#e7ecf1; --dim:#8a94a1; --accent:#37c7a6; --accent2:#e0a52b; --warn:#e2657a; --blue:#5aa9e6;
        --mono:'Courier New',Courier,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden}
    button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
    .mono{font-family:var(--mono)}

    /* ---- gate ---- */
    #gate{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
    #gate h1{font-family:var(--mono);font-size:28px;letter-spacing:8px;color:var(--accent)}
    #gate p{color:var(--dim);font-size:12px;letter-spacing:1px}
    #gate input{background:var(--panel);border:1px solid var(--line);padding:12px 16px;text-align:center;
        letter-spacing:3px;font-family:var(--mono);width:220px;outline:none;border-radius:6px}
    #gate input:focus{border-color:var(--accent)}
    #gate .err{color:var(--warn);font-size:11px;height:14px}

    /* ---- shell ---- */
    #app{display:none;height:100%;flex-direction:column}
    .topbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
        padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
    .topbar .brand{font-family:var(--mono);letter-spacing:3px;font-weight:bold;color:var(--accent)}
    .topbar .date{font-family:var(--mono);font-size:12px;color:var(--dim)}
    .layout{flex:1;display:flex;min-height:0}
    nav.side{width:180px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
    nav.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--dim);
        text-decoration:none;font-size:13px;letter-spacing:.3px;cursor:pointer;transition:.12s}
    nav.side a:hover{background:var(--panel2);color:var(--fg)}
    nav.side a.on{background:var(--accent);color:#04120e;font-weight:600}
    nav.side a .i{width:18px;text-align:center}
    main.view{flex:1;overflow-y:auto;padding:22px 26px 60px}
    section.page{display:none;max-width:900px;margin:0 auto}
    section.page.on{display:block;animation:fade .2s ease}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

    h2.ph{font-family:var(--mono);font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin:2px 0 16px}
    h3{font-size:15px;margin-bottom:10px;letter-spacing:.3px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
    .row{display:flex;align-items:center;gap:10px}
    .spacer{flex:1}
    .muted{color:var(--dim)}
    .small{font-size:12px}
    .pill{font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}

    .btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:8px 13px;border-radius:8px;cursor:pointer;transition:.12s;font-size:13px}
    .btn:hover{border-color:var(--accent);color:var(--fg)}
    .btn.acc{background:var(--accent);color:#04120e;border-color:var(--accent);font-weight:600}
    .btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
    .btn.ghost{background:transparent}
    .btn.warn:hover{border-color:var(--warn)}
    .ipt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
    .ipt:focus{border-color:var(--accent)}

    /* progress */
    .bar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
    .bar > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}

    /* task rows */
    .task{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line)}
    .task:last-child{border-bottom:none}
    .chk{width:19px;height:19px;border:2px solid var(--dim);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
    .chk:hover{border-color:var(--accent)}
    .task.done .chk{background:var(--accent);border-color:var(--accent);color:#04120e}
    .task.done .t-title{text-decoration:line-through;color:var(--dim)}
    .t-title{flex:1;font-size:13.5px}
    .est{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
    .mini{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:5px}
    .mini:hover{color:var(--fg);background:var(--panel2)}
    .mini.on{color:var(--accent2)}

    .habits{display:flex;flex-wrap:wrap;gap:8px}
    .habit{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:22px;cursor:pointer;user-select:none;transition:.12s}
    .habit:hover{border-color:var(--accent)}
    .habit.on{background:var(--accent);color:#04120e;border-color:var(--accent);font-weight:600}
    .habit .h-ic{font-size:14px}

    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .stat .n{font-family:var(--mono);font-size:26px;color:var(--accent)}
    .stat .l{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

    .timer{font-family:var(--mono);font-size:34px;letter-spacing:2px}
    .addrow{display:flex;gap:8px;margin-top:10px}

    .proj-head{display:flex;align-items:center;gap:10px;cursor:pointer}
    .dotc{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .lib-item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
    .lib-item .ttl{font-size:13px;font-weight:600;margin-bottom:3px}
    .status-b{font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:4px}
    .s-consuming{background:rgba(224,165,43,.18);color:var(--accent2)}
    .s-done{background:rgba(55,199,166,.18);color:var(--accent)}
    .s-backlog{background:var(--panel);color:var(--dim);border:1px solid var(--line)}

    /* ---- spine bookshelf ---- */
    .shelf-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
    .shelf-wrap{margin-bottom:24px}
    .shelf-title{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
    .shelf-title span{color:var(--accent)}
    .shelf{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.14));padding:0 8px;border-radius:4px 4px 0 0}
    .books{display:flex;align-items:flex-end;gap:3px;flex-wrap:wrap;min-height:190px;padding-top:16px}
    .shelf-board{height:15px;background:linear-gradient(180deg,#5a4632,#2e2119);border-radius:0 0 5px 5px;box-shadow:0 10px 16px rgba(0,0,0,.5)}
    .spine{--c:#456;position:relative;background:var(--c);border-radius:3px 3px 1px 1px;display:flex;flex-direction:column;
        align-items:center;justify-content:space-between;padding:9px 3px;cursor:pointer;overflow:hidden;flex-shrink:0;
        box-shadow:inset -4px 0 7px rgba(0,0,0,.30), inset 3px 0 4px rgba(255,255,255,.07);
        transition:transform .16s ease, box-shadow .16s ease}
    .spine::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:rgba(255,255,255,.16)}
    .spine::after{content:"";position:absolute;bottom:7px;left:0;right:0;height:2px;background:rgba(0,0,0,.24)}
    .spine:hover{transform:translateY(-12px) rotate(-1.2deg);box-shadow:0 14px 22px rgba(0,0,0,.5)}
    .spine-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:80%}
    .spine-author{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;opacity:.72;white-space:nowrap;overflow:hidden;max-height:24%}
    .spine.backlog{opacity:.42}
    .spine.consuming{outline:2px solid var(--accent2);outline-offset:-2px}
    .shelf-legend{display:flex;gap:16px;font-size:10.5px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
    .shelf-legend b{color:var(--fg);font-weight:normal}

    /* ---- stats viz ---- */
    .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
    .heat i{width:12px;height:12px;border-radius:2px;background:var(--panel2)}
    .heat-legend{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);margin-top:8px}
    .heat-legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
    textarea.ipt{min-height:84px;font-family:var(--mono);font-size:12px;resize:vertical;line-height:1.4}

    /* ---- skill tree ---- */
    .tree-wrap{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:12px;
        background:radial-gradient(circle at 50% 46%, #2a1f15, #130f0a 70%)}
    #treeSvg{width:100%;height:auto;display:block}
    .tl{stroke:#463829;stroke-width:2}
    .tl.twig{stroke:#3a3020;stroke-width:1.4}
    .tl.lit{stroke:#c8a24a;stroke-width:2.4;filter:drop-shadow(0 0 3px rgba(200,162,74,.55))}
    .tn circle{fill:#1b140d;stroke:#5c4a30;stroke-width:2;transition:.15s}
    .tn.core circle{fill:#c8a24a;stroke:#ecd693;stroke-width:3;filter:drop-shadow(0 0 9px rgba(200,162,74,.85))}
    .tn.project circle{stroke:var(--pc,#888);stroke-width:2.5}
    .tn.done circle{fill:#c8a24a;stroke:#f1de9d;filter:drop-shadow(0 0 6px rgba(200,162,74,.75))}
    .tn.partial circle{fill:#3a2f1c;stroke:#c8a24a}
    .tn.locked circle{opacity:.72}
    .tn.task circle{stroke-width:1.5}
    .tn:hover circle{stroke:#fff}
    .core-t{fill:#1a140d;font-family:var(--mono);font-size:9px;font-weight:bold}
    .ph-t{fill:#e7ecf1;font-family:var(--mono);font-size:9px;font-weight:bold}
    .tn.done .ph-t{fill:#1a140d}
    .pr-t{fill:#c9c0ae;font-size:9px;font-family:var(--sans)}
    #treeTip{position:absolute;pointer-events:none;background:rgba(10,9,7,.96);border:1px solid #c8a24a;border-radius:6px;
        padding:8px 11px;font-size:12px;max-width:224px;opacity:0;transition:.1s;z-index:20;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.6)}
    #treeTip .muted{color:#9a8f78}
    #treeSvg{cursor:grab;touch-action:none}
    #treeSvg:active{cursor:grabbing}
    .tree-zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:15}
    .tree-zoom button{width:30px;height:30px;background:rgba(20,16,11,.9);border:1px solid #5c4a30;color:#e7ecf1;font-size:15px;cursor:pointer;border-radius:6px}
    .tree-zoom button:hover{background:#c8a24a;color:#1a140d;border-color:#c8a24a}

    /* bottom nav (mobile) */
    nav.bottom{display:none}
    @media(max-width:720px){
        nav.side{display:none}
        main.view{padding:16px 14px 78px}
        nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--panel);
            border-top:1px solid var(--line);z-index:50;justify-content:space-between;align-items:center;overflow-x:auto}
        nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);text-decoration:none;font-size:9px;letter-spacing:.3px;cursor:pointer;padding:6px 9px;flex:0 0 auto}
        nav.bottom a.on{color:var(--accent)}
        nav.bottom a .i{font-size:17px}
        .topbar .date{display:none}
    }
</style>
</head>
<body>

<!-- ===== GATE ===== -->
<div id="gate">
    <h1>KLOEF</h1>
    <p>enter the word to continue</p>
    <input id="gateInput" type="password" autocomplete="off" placeholder="· · · · ·" autofocus>
    <div class="err" id="gateErr"></div>
</div>

<!-- ===== APP ===== -->
<div id="app">
    <div class="topbar">
        <span class="brand">KLOEF</span>
        <span class="date mono" id="topDate"></span>
        <button class="btn sm ghost" id="lockBtn" title="Lock">🔒</button>
    </div>
    <div class="layout">
        <nav class="side" id="navSide"></nav>
        <main class="view">
            <section class="page" id="page-today"></section>
            <section class="page" id="page-tomorrow"></section>
            <section class="page" id="page-projects"></section>
            <section class="page" id="page-roadmap"></section>
            <section class="page" id="page-library"></section>
            <section class="page" id="page-stats"></section>
            <section class="page" id="page-settings"></section>
        </main>
    </div>
    <nav class="bottom" id="navBottom"></nav>
</div>

let S = load();
let sync = { on:false, applying:false, ref:null, db:null, pushT:null,
    push(){ if(!this.ref) return; clearTimeout(this.pushT); const snap=JSON.parse(JSON.stringify(S));
        this.pushT=setTimeout(()=>this.ref.set(snap).catch(e=>console.warn("sync push",e)), 700); } };
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):seed(); }catch(e){ return seed(); } }
function migrate(){ S.errands=S.errands||[]; S.inbox=S.inbox||[]; S.dayPlan=S.dayPlan||{}; S.dayLog=S.dayLog||{}; S.settings=S.settings||{};
    if(S.settings.fbKey===undefined)S.settings.fbKey="main"; if(S.settings.fbConfig===undefined)S.settings.fbConfig=""; if(S.settings.syncEnabled===undefined)S.settings.syncEnabled=false; }
migrate();
function save(){ S._updatedAt=Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); if(sync.on && !sync.applying) sync.push(); }
function commit(){ save(); renderAll(); }

/* ---------------- helpers ---------------- */
const allTasks = () => S.projects.flatMap(p => p.tasks.map(t => ({...t, _pid:p.id, _pname:p.name, _color:p.color})));
const projStats = p => { const d=p.tasks.filter(t=>t.done).length, tot=p.tasks.length;
    const hDone=p.tasks.filter(t=>t.done).reduce((a,t)=>a+(+t.est||0),0);
    const hTot=p.tasks.reduce((a,t)=>a+(+t.est||0),0);
    return {d,tot,pct:tot?Math.round(100*d/tot):0,hDone,hTot}; };
function habitStreak(){
    let n=0; const d=new Date();
    for(;;){ const k=d.toLocaleDateString("en-CA"); const log=S.habitLog[k];
        const any=log && Object.values(log).some(Boolean);
        if(k===todayStr() && !any){ d.setDate(d.getDate()-1); continue; } // today not done yet doesn't break streak
        if(any){ n++; d.setDate(d.getDate()-1); } else break;
        if(n>400) break;
    }
    return n;
}
function fmtEst(h){ h=+h||0; if(h<1) return Math.round(h*60)+"m"; return (Number.isInteger(h)?h:h.toFixed(1))+"h"; }

function dayPlanOf(date){ if(!S.dayPlan[date]) S.dayPlan[date]={top3:["","",""],notes:""}; if(!S.dayPlan[date].top3) S.dayPlan[date].top3=["","",""]; return S.dayPlan[date]; }
const errandsFor=date=>S.errands.filter(e=>e.date===date);
const pinnedFor=date=>allTasks().filter(t=>t.today===date && !t.done);
function plannedHours(date){ return errandsFor(date).filter(x=>!x.done).reduce((a,x)=>a+(+x.est||0),0)
    + pinnedFor(date).reduce((a,t)=>a+(+t.est||0),0); }
function loadMeter(date){ const h=plannedHours(date), pct=Math.min(100,Math.round(100*h/DAY_BUDGET));
    const col=h>DAY_BUDGET+1?"var(--warn)":h>DAY_BUDGET-2?"var(--accent2)":"var(--accent)";
    const note=h>DAY_BUDGET+1?"overloaded — cut something":h>DAY_BUDGET-2?"a full day":"room to breathe";
    return `<div class="card"><div class="row"><h3 style="margin:0">Planned load</h3><div class="spacer"></div><span class="mono">${h.toFixed(1)}h / ${DAY_BUDGET}h</span></div>
      <div class="bar" style="margin:10px 0"><i style="width:${pct}%;background:${col}"></i></div><div class="small muted">${note}</div></div>`; }
function top3HTML(date){ const p=dayPlanOf(date);
    return `<div class="card"><h3>Top 3 — the needle-movers</h3>
      ${[0,1,2].map(i=>`<div class="row" style="margin-bottom:6px"><span class="mono muted" style="width:18px">${i+1}</span><input class="ipt" data-top3="${i}" placeholder="…" value="${esc(p.top3[i]||"")}"></div>`).join("")}</div>`; }
function errandsHTML(date){ const es=errandsFor(date);
    return `<div class="card"><div class="row"><h3 style="margin:0">Must-do</h3><div class="spacer"></div><span class="pill">${es.filter(e=>!e.done).length} open</span></div>

function pinnedHTML(date,label){ const ps=pinnedFor(date);
    return `<div class="card"><div class="row"><h3 style="margin:0">${label}</h3><div class="spacer"></div><span class="pill">${ps.length}</span></div>
      ${ps.length?ps.map(t=>taskRow(t)).join(""):'<p class="muted small" style="padding:6px 0">Pin project tasks with ☆, or use the picker.</p>'}

function wireDay(el,date){

        S.errands.push({id:uid(),title:t,est:parseFloat(el.querySelector(".eest").value)||1,done:false,date}); commit(); };

function findTask(pid,tid){ const p=S.projects.find(x=>x.id===pid); if(!p)return[null,null]; return [p,p.tasks.find(t=>t.id===tid)]; }
function wireTaskRows(scope){
    scope.querySelectorAll(".task").forEach(row=>{
        const pid=row.dataset.pid, tid=row.dataset.tid;
        row.querySelector(".chk").onclick=()=>{ const[,t]=findTask(pid,tid); if(!t)return; t.done=!t.done; t.doneAt=t.done?todayStr():null; commit(); };
        row.querySelectorAll(".mini").forEach(b=>b.onclick=()=>{
            const[,t]=findTask(pid,tid); if(!t)return; const act=b.dataset.act;
            if(act==="pin"){ t.today = t.today===todayStr()?null:todayStr(); commit(); }
            else if(act==="del"){ const p=S.projects.find(x=>x.id===pid); p.tasks=p.tasks.filter(x=>x.id!==tid); commit(); }

        });
    });
}

/* ----- ROADMAP ----- */
const PHASES=["Phase 0","Phase 1","Phase 2","Phase 3","Phase 4","Phase 5","Continuous"];
const PHASE_META={
    "Phase 0":"Next 4 weeks · foundations","Phase 1":"Y1·S1 · studio workflow","Phase 2":"Y1·S2 · signature tool",
    "Phase 3":"Y2·S1 · depth + internship groundwork","Phase 4":"Y2·S2 · graduate + land office",
    "Phase 5":"After graduation · internship","Continuous":"Runs the whole two years"};
function renderRoadmap(){
    const el=document.getElementById("page-roadmap");
    const W=1200,H=840,cx=W/2,cy=H/2;
    const phaseList=PHASES.filter(ph=>S.projects.some(p=>p.phase===ph));
    const n=phaseList.length||1;
    const nodes=[], links=[];
    nodes.push({x:cx,y:cy,r:26,type:"core",label:"YOU",state:"core"});
    phaseList.forEach((ph,i)=>{
        const ang=(i/n)*2*Math.PI - Math.PI/2;
        const px=cx+Math.cos(ang)*155, py=cy+Math.sin(ang)*155;
        const projs=S.projects.filter(p=>p.phase===ph);
        const pdone=projs.reduce((a,p)=>a+p.tasks.filter(t=>t.done).length,0), ptot=projs.reduce((a,p)=>a+p.tasks.length,0);
        const pct=ptot?Math.round(100*pdone/ptot):0;
        nodes.push({x:px,y:py,r:16,type:"phase",label:ph.replace("Phase ","P").replace("Continuous","∞"),
            state:pct>=100?"done":pct>0?"partial":"locked",data:{ph,meta:PHASE_META[ph],pct,pdone,ptot}});
        const phaseIdx=nodes.length-1; links.push([0,phaseIdx]);
        const k=projs.length;
        projs.forEach((p,j)=>{
            const pa=ang+(k>1?(j-(k-1)/2):0)*0.36;
            const prx=cx+Math.cos(pa)*305, pry=cy+Math.sin(pa)*305;
            const s=projStats(p);
            nodes.push({x:prx,y:pry,r:13,type:"project",label:p.name,color:p.color,
                state:s.pct>=100?"done":s.pct>0?"partial":"locked",data:{p,s}});
            const projIdx=nodes.length-1; links.push([phaseIdx,projIdx]);
            const m=p.tasks.length, rr=44+Math.min(28,m*2.2);
            p.tasks.forEach((t,q)=>{
                const ta=pa+(q-(m-1)/2)*0.5;
                nodes.push({x:prx+Math.cos(ta)*rr,y:pry+Math.sin(ta)*rr,r:5,type:"task",color:p.color,
                    state:t.done?"done":"locked",data:{t,p}});
                links.push([projIdx,nodes.length-1,"twig"]);
            });
        });
    });
    const linkSvg=links.map(([a,b,ty])=>{const A=nodes[a],B=nodes[b];
        return `<line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" class="tl ${ty||'main'} ${nodes[b].state==='done'?'lit':''}"/>`;}).join("");
    const nodeSvg=nodes.map((nd,i)=>`<g class="tn ${nd.type} ${nd.state}" data-node="${i}" transform="translate(${nd.x.toFixed(1)},${nd.y.toFixed(1)})">
        <circle r="${nd.r}" ${nd.color?`style="--pc:${nd.color}"`:''}></circle>
        ${nd.type==="core"?'<text class="core-t" text-anchor="middle" dy="4">NOW</text>':''}
        ${nd.type==="phase"?`<text class="ph-t" text-anchor="middle" dy="4">${esc(nd.label)}</text>`:''}
        ${nd.type==="project"?`<text class="pr-t" text-anchor="middle" dy="${nd.r+13}">${esc(nd.label)}</text>`:''}
      </g>`).join("");
    const overall=(()=>{ const ts=allTasks(); const d=ts.filter(t=>t.done).length; return ts.length?Math.round(100*d/ts.length):0; })();
    el.innerHTML=`<h2 class="ph">Roadmap · your passive tree <span class="pill mono">${overall}% allocated</span></h2>
      <div class="small muted" style="margin-bottom:8px">Scroll to zoom · drag to pan · hover for detail · click a task node to (un)complete.</div>
      <div class="tree-wrap">
        <svg viewBox="0 0 ${W} ${H}" id="treeSvg"><g id="treeG">${linkSvg}${nodeSvg}</g></svg>
        <div class="tree-zoom"><button id="tzin" title="Zoom in">＋</button><button id="tzout" title="Zoom out">−</button><button id="tzfit" title="Reset view">⤢</button></div>
        <div id="treeTip"></div></div>`;
    const svg=el.querySelector("#treeSvg"), gEl=el.querySelector("#treeG"), tip=el.querySelector("#treeTip");
    let tv={scale:treeView.scale,tx:treeView.tx,ty:treeView.ty,drag:false,sx:0,sy:0,moved:false};
    const applyTV=()=>{ gEl.setAttribute("transform",`translate(${tv.tx.toFixed(1)},${tv.ty.toFixed(1)}) scale(${tv.scale.toFixed(3)})`); treeView={scale:tv.scale,tx:tv.tx,ty:tv.ty}; };
    const vbK=()=>{ const r=svg.getBoundingClientRect(); return {r,k:W/(r.width||W)}; };
    function zoomAt(vx,vy,f){ const ns=Math.max(0.4,Math.min(4,tv.scale*f)); tv.tx=vx-(vx-tv.tx)*(ns/tv.scale); tv.ty=vy-(vy-tv.ty)*(ns/tv.scale); tv.scale=ns; applyTV(); }
    applyTV();
    svg.addEventListener("wheel",e=>{ e.preventDefault(); const {r,k}=vbK(); zoomAt((e.clientX-r.left)*k,(e.clientY-r.top)*k, e.deltaY<0?1.12:1/1.12); },{passive:false});
    svg.addEventListener("mousedown",e=>{ tv.drag=true; tv.moved=false; tv.sx=e.clientX; tv.sy=e.clientY; });
    svg.addEventListener("mousemove",e=>{ if(!tv.drag)return; const {k}=vbK(); tv.tx+=(e.clientX-tv.sx)*k; tv.ty+=(e.clientY-tv.sy)*k; if(Math.abs(e.clientX-tv.sx)+Math.abs(e.clientY-tv.sy)>2) tv.moved=true; tv.sx=e.clientX; tv.sy=e.clientY; applyTV(); });
    const endDrag=()=>{ tv.drag=false; }; svg.addEventListener("mouseup",endDrag); svg.addEventListener("mouseleave",endDrag);
    let lastDist=null;
    svg.addEventListener("touchstart",e=>{ if(e.touches.length===1){ tv.drag=true; tv.moved=false; tv.sx=e.touches[0].clientX; tv.sy=e.touches[0].clientY; } else if(e.touches.length===2){ const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; lastDist=Math.hypot(dx,dy); } },{passive:true});
    svg.addEventListener("touchmove",e=>{ const {r,k}=vbK(); if(e.touches.length===2&&lastDist){ const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; const d=Math.hypot(dx,dy); zoomAt(((e.touches[0].clientX+e.touches[1].clientX)/2-r.left)*k,((e.touches[0].clientY+e.touches[1].clientY)/2-r.top)*k,d/lastDist); lastDist=d; e.preventDefault(); } else if(e.touches.length===1&&tv.drag){ tv.tx+=(e.touches[0].clientX-tv.sx)*k; tv.ty+=(e.touches[0].clientY-tv.sy)*k; tv.sx=e.touches[0].clientX; tv.sy=e.touches[0].clientY; tv.moved=true; applyTV(); e.preventDefault(); } },{passive:false});
    svg.addEventListener("touchend",()=>{ tv.drag=false; lastDist=null; });
    el.querySelector("#tzin").onclick=()=>zoomAt(W/2,H/2,1.2);
    el.querySelector("#tzout").onclick=()=>zoomAt(W/2,H/2,1/1.2);
    el.querySelector("#tzfit").onclick=()=>{ tv.scale=1; tv.tx=0; tv.ty=0; applyTV(); };
    svg.querySelectorAll(".tn").forEach(gn=>{ const nd=nodes[+gn.dataset.node];
        gn.addEventListener("mousemove",e=>{ if(!tv.drag) showTip(tip,e,nd); });
        gn.addEventListener("mouseleave",()=>{tip.style.opacity=0;});
        if(nd.type==="task"){ gn.style.cursor="pointer"; gn.addEventListener("click",()=>{ if(tv.moved)return; const[,t]=findTask(nd.data.p.id,nd.data.t.id); if(t){ t.done=!t.done; t.doneAt=t.done?todayStr():null; commit(); } }); }
    });
}
function showTip(tip,e,nd){
    const wrap=tip.parentElement.getBoundingClientRect();
    let html="";
    if(nd.type==="core") html=`<b>Now</b><br><span class="muted">Your two-year passive tree</span>`;
    else if(nd.type==="phase") html=`<b>${esc(nd.data.ph)}</b><br><span class="muted">${esc(nd.data.meta||"")}</span><br>${nd.data.pdone}/${nd.data.ptot} tasks · ${nd.data.pct}%`;
    else if(nd.type==="project") html=`<b>${esc(nd.data.p.name)}</b> <span class="muted">· ${esc(nd.data.p.phase)}</span><br>${nd.data.s.d}/${nd.data.s.tot} tasks · ${nd.data.s.hDone}/${nd.data.s.hTot}h · ${nd.data.s.pct}%`;
    else html=`<b>${esc(nd.data.t.title)}</b><br><span class="muted">${esc(nd.data.p.name)} · ${fmtEst(nd.data.t.est)} · ${nd.data.t.done?'✓ done':'to do'}</span>`;
    tip.innerHTML=html; tip.style.opacity=1;
    let x=e.clientX-wrap.left+14, y=e.clientY-wrap.top+14;
    if(x+230>wrap.width) x=e.clientX-wrap.left-230;
    if(y+90>wrap.height) y=wrap.height-95;
    tip.style.left=x+"px"; tip.style.top=y+"px";
}

function hashInt(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function textOn(hex){ if(!/^#[0-9a-f]{6}$/i.test(hex)) return "#f2efe8";
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)>150 ? "#1a1a1a" : "#f4f1ea"; }
function spine(l){

            <div class="stat"><div class="n">${weekFocus}</div><div class="l">Focus min · 7d</div></div>
          </div>
        </div>
      </div></div>
      <div class="card"><h3>Momentum · tasks completed, last 12 weeks</h3>
        <div class="heat">${cells}</div>
        <div class="heat-legend">less <i style="background:var(--panel2)"></i><i style="background:${heatColor(1)}"></i><i style="background:${heatColor(2)}"></i><i style="background:${heatColor(4)}"></i> more</div>

/* ---------------- focus timer ---------------- */
let timer={sec:1500,run:false,iv:null};
function wireTimer(el){
    const disp=el.querySelector("#timer"); if(!disp)return;
    const paint=()=>{ const m=String(Math.floor(timer.sec/60)).padStart(2,'0'), s=String(timer.sec%60).padStart(2,'0'); disp.textContent=`${m}:${s}`; };
    paint();
    el.querySelector("#timerStart").onclick=(e)=>{
        if(timer.run){ clearInterval(timer.iv); timer.run=false; e.target.textContent="Start"; e.target.classList.add("acc"); logFocus(); }
        else{ timer.run=true; e.target.textContent="Pause"; e.target.classList.remove("acc");
            timer.iv=setInterval(()=>{ if(timer.sec>0){timer.sec--;paint();} else { clearInterval(timer.iv); timer.run=false; logFocus(true); } },1000); }
    };
    el.querySelector("#timerReset").onclick=()=>{ clearInterval(timer.iv); timer.run=false; timer.sec=1500; paint(); const b=el.querySelector("#timerStart"); b.textContent="Start"; b.classList.add("acc"); };
    let lastLogged=1500;
    function logFocus(finished){ const spent=Math.round((lastLogged-timer.sec)/60);
        if(spent>0){ const td=todayStr(); const d=S.dayLog[td]=S.dayLog[td]||{}; d.focusMin=(d.focusMin||0)+spent;
            d.byActivity=d.byActivity||{}; d.byActivity[currentActivity]=(d.byActivity[currentActivity]||0)+spent;
            const hb=ACT_HABIT[currentActivity]; if(hb){ S.habitLog[td]=S.habitLog[td]||{}; S.habitLog[td][hb]=true; }
            save(); }
        lastLogged=timer.sec;
        if(finished){ timer.sec=1500; paint(); toast("Focus block done · "+currentActivity+" logged"); renderToday(); renderStats(); } }
}

/* ---------------- Google Calendar (two-way, optional) ---------------- */
let gcal={ready:false,token:null,tokenClient:null,gapiInited:false};
function gcalConnect(){
    const {gClientId,gApiKey}=S.settings;
    if(!gClientId||!gApiKey){ toast("Add Client ID + API key first"); return; }
    if(typeof gapi==="undefined"||typeof google==="undefined"){ toast("Google scripts still loading — try again"); return; }
    gapi.load("client",async()=>{
        try{
            await gapi.client.init({apiKey:gApiKey,discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"]});
            gcal.gapiInited=true;
            gcal.tokenClient=google.accounts.oauth2.initTokenClient({
                client_id:gClientId, scope:"https://www.googleapis.com/auth/calendar.events",
                callback:(resp)=>{ if(resp.error){toast("Auth failed");return;} gcal.token=resp; gcal.ready=true; toast("Calendar connected"); renderSettings(); gcalListToday(); }
            });
            gcal.tokenClient.requestAccessToken({prompt:""});
        }catch(e){ toast("Calendar init failed — check keys/origin"); console.error(e); }
    });
}
async function gcalListToday(){
    if(!gcal.ready)return; const box=document.getElementById("gEvents"); if(!box)return;
    try{
        const start=new Date(); start.setHours(0,0,0,0);
        const res=await gapi.client.calendar.events.list({calendarId:S.settings.calId||"primary",timeMin:start.toISOString(),maxResults:8,singleEvents:true,orderBy:"startTime"});
        const items=res.result.items||[];
        box.innerHTML="<h3 style='font-size:13px;margin:6px 0'>Upcoming</h3>"+(items.length?items.map(ev=>{
            const t=ev.start.dateTime?new Date(ev.start.dateTime).toLocaleString(undefined,{weekday:'short',hour:'2-digit',minute:'2-digit'}):"all-day";
            return `<div class="small" style="padding:3px 0"><span class="mono muted">${t}</span> · ${esc(ev.summary||"(no title)")}</div>`;
        }).join(""):"<p class='small muted'>No upcoming events.</p>");
    }catch(e){ box.innerHTML="<p class='small muted'>Couldn't load events.</p>"; }
}
function addToCalendar(t){
    const start=new Date(); start.setHours(9,0,0,0);
    const end=new Date(start.getTime()+Math.max(0.5,+t.est||1)*3600*1000);
    if(gcal.ready){
        gapi.client.calendar.events.insert({calendarId:S.settings.calId||"primary",resource:{
            summary:t.title, start:{dateTime:start.toISOString()}, end:{dateTime:end.toISOString()}
        }}).then(()=>{toast("Added to Google Calendar");gcalListToday();}).catch(()=>toast("Add failed"));
    } else {
        const fmt=d=>d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
        const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${fmt(start)}/${fmt(end)}`;
        window.open(url,"_blank");
    }
}

/* ---------------- Firebase cloud sync (optional) ---------------- */
function loadFirebaseScripts(){
    return new Promise((res,rej)=>{
        if(window.firebase && window.firebase.firestore){ res(); return; }
        const add=src=>new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
        add("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js")
          .then(()=>add("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"))
          .then(res).catch(rej);
    });
}
async function syncEnable(silent){
    const cfgRaw=(S.settings.fbConfig||"").trim(), key=((S.settings.fbKey||"main").trim())||"main";
    if(!cfgRaw){ if(!silent) toast("Paste your Firebase config first"); return; }
    let cfg;
    try{ cfg=JSON.parse(cfgRaw); }
    catch(e){ try{ cfg=Function("return ("+cfgRaw.replace(/^\s*(?:const|let|var)\s+\w+\s*=\s*/,"").replace(/;\s*$/,"")+")")(); }
        catch(e2){ if(!silent) toast("Couldn't parse the config"); return; } }
    try{
        await loadFirebaseScripts();
        if(!firebase.apps.length) firebase.initializeApp(cfg);
        sync.db=firebase.firestore();
        sync.ref=sync.db.doc("kloef/"+key);
        const snap=await sync.ref.get();
        if(snap.exists){
            const remote=snap.data();
            if((remote._updatedAt||0) > (S._updatedAt||0)){ sync.applying=true; S=remote; localStorage.setItem(KEY,JSON.stringify(S)); sync.applying=false; renderAll(); }
            else { sync.ref.set(JSON.parse(JSON.stringify(S))); }
        } else { sync.ref.set(JSON.parse(JSON.stringify(S))); }
        sync.ref.onSnapshot(doc=>{ if(!doc.exists) return; const remote=doc.data();
            if((remote._updatedAt||0) > (S._updatedAt||0)){ sync.applying=true; S=remote; localStorage.setItem(KEY,JSON.stringify(S)); sync.applying=false; renderAll(); } });
        sync.on=true; S.settings.syncEnabled=true; localStorage.setItem(KEY,JSON.stringify(S));
        if(!silent) toast("Cloud sync on"); renderSettings();
    }catch(e){ console.error(e); if(!silent) toast("Sync failed — check config & Firestore rules"); }
}
function syncDisable(){ sync.on=false; S.settings.syncEnabled=false; save(); toast("Cloud sync off"); renderSettings(); }

/* ---------------- gate + boot ---------------- */
function unlock(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="flex";
    sessionStorage.setItem("kloefUnlocked","1"); if(!location.hash)location.hash="today"; renderAll(); route();
    if(S.settings && S.settings.syncEnabled) syncEnable(true); }
document.getElementById("gateInput").addEventListener("keydown",e=>{ if(e.key!=="Enter")return;
    if(e.target.value.trim().toLowerCase()==="kloef"){ unlock(); } else { document.getElementById("gateErr").textContent="nope."; e.target.value=""; } });

document.addEventListener("click",e=>{ const a=e.target.closest("[data-go]"); if(a){ location.hash=a.dataset.go; } });
window.addEventListener("hashchange",route);
document.getElementById("lockBtn").onclick=()=>{ sessionStorage.removeItem("kloefUnlocked"); location.reload(); };

if(sessionStorage.getItem("kloefUnlocked")==="1"){ unlock(); }
else { document.getElementById("gateInput").focus(); }
</script>
