<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The game of life | DouweDoesDesign</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #050505; /* Deep black-blue for night sky */
            --window-off: #111111;
            --window-on: #ffeeb0; /* Warm tungsten light */
            --grid-line: #222;
            --accent-color: #ffffff;
            --header-height: 15vh;
            --ui-bg: rgba(0, 0, 0, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER --- */
        .back-btn {
            position: fixed; top: 4vh; left: 4vh;
            text-decoration: none; z-index: 100;
            border: 1px solid var(--accent-color);
            background-color: var(--bg-color); color: var(--accent-color);
            padding: 10px 20px; text-transform: uppercase; font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .back-btn:hover { background-color: var(--accent-color); color: var(--bg-color); }

        header {
            height: var(--header-height);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; width: 100%; pointer-events: none; z-index: 10;
        }

        .site-logo {
            height: 50px; width: auto; margin-bottom: 15px;
            pointer-events: auto;
            filter: invert();
        }

        h1 {
            font-size: 2rem; letter-spacing: -1px; text-transform: uppercase;
            font-weight: 300; border-bottom: 1px solid var(--accent-color);
            padding-bottom: 10px; background: rgba(5,5,5,0.8);
        }

        /* --- THE FACADE (GRID) --- */
        #facade-container {
            width: 100vw;
            height: 100vh;
            display: grid;
            /* Columns will be set by JS */
            gap: 1px;
            background-color: var(--grid-line);
            cursor: crosshair;
        }

        .window {
            background-color: var(--window-off);
            position: relative;
            transition: background-color 0.1s;
        }

        /* Architectural Detail: Window Reflection/Frame */
        .window::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* ACTIVE STATE (LIGHTS ON) */
        .window.active {
            background-color: var(--window-on);
            box-shadow: 0 0 10px rgba(255, 238, 176, 0.4); /* Glow */
            z-index: 1; /* Bring glow to top */
        }

        /* --- CONTROLS OVERLAY --- */
        #controls-bar {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; align-items: center;
            background: var(--ui-bg); border: 1px solid var(--accent-color);
            padding: 15px 25px; z-index: 20;
        }

        .action-btn {
            background: transparent; border: 1px solid var(--accent-color);
            color: var(--accent-color); padding: 10px 20px;
            text-transform: uppercase; font-size: 0.8rem; cursor: pointer;
            min-width: 100px; text-align: center;
            transition: all 0.2s;
        }
        
        .action-btn:hover, .action-btn.active { 
            background: var(--accent-color); color: var(--bg-color); 
        }

        .separator { width: 1px; height: 30px; background: #555; }

        /* --- STATS DISPLAY --- */
        #stats-hud {
            position: absolute; bottom: 40px; right: 40px;
            text-align: right; font-family: monospace;
            color: var(--accent-color); opacity: 0.7; pointer-events: none;
        }

    </style>
</head>
<body>

    <a href="../../../testSites.html" class="back-btn">← Back</a>

    <header>
        <img src="Recourses/Logos/DDD.jpg" alt="DDD Logo" class="site-logo">
        <h1>Game of Life</h1>
    </header>

    <div id="facade-container"></div>

    <div id="stats-hud">
        GENERATION: <span id="gen-count">0</span><br>
        OCCUPANCY: <span id="pop-count">0</span>%
    </div>

    <div id="controls-bar">
        <button class="action-btn" id="toggle-btn">Start Evolution</button>
        <button class="action-btn" id="step-btn">Step +1</button>
        <div class="separator"></div>
        <button class="action-btn" id="random-btn">Randomize</button>
        <button class="action-btn" id="clear-btn">Clear</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CELL_SIZE = 25; // Size of each window in pixels
        const UPDATE_SPEED = 150; // Milliseconds between generations

        // --- STATE ---
        let grid = []; // Current state
        let nextGrid = []; // Buffer for next state
        let rows = 0;
        let cols = 0;
        let isRunning = false;
        let intervalId = null;
        let generation = 0;
        let isDrawing = false; // For drag-to-draw

        // --- DOM ELEMENTS ---
        const container = document.getElementById('facade-container');
        const genDisplay = document.getElementById('gen-count');
        const popDisplay = document.getElementById('pop-count');
        const toggleBtn = document.getElementById('toggle-btn');

        // --- INITIALIZATION ---
        function init() {
            calculateDimensions();
            createGrid();
            randomize();
            window.addEventListener('resize', handleResize);
        }

        function calculateDimensions() {
            cols = Math.ceil(window.innerWidth / CELL_SIZE);
            rows = Math.ceil(window.innerHeight / CELL_SIZE);
            
            // Set CSS Grid layout dynamically
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        }

        function createGrid() {
            container.innerHTML = ''; // Clear DOM
            grid = new Array(rows).fill(null).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(null).map(() => new Array(cols).fill(0));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('window');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    // Interaction Events
                    cell.addEventListener('mousedown', () => { isDrawing = true; toggleCell(r, c); });
                    cell.addEventListener('mouseenter', () => { if(isDrawing) toggleCell(r, c, true); });
                    
                    container.appendChild(cell);
                }
            }
        }

        // Global mouse up to stop drawing
        window.addEventListener('mouseup', () => isDrawing = false);

        // --- LOGIC: CONWAY'S GAME OF LIFE ---
        function computeNextGen() {
            let activeCount = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const state = grid[r][c];
                    const neighbors = countNeighbors(grid, r, c);

                    // RULES:
                    // 1. Alive + < 2 neighbors -> Die (Underpopulation)
                    // 2. Alive + 2 or 3 neighbors -> Live
                    // 3. Alive + > 3 neighbors -> Die (Overpopulation)
                    // 4. Dead + 3 neighbors -> Live (Reproduction)

                    if (state === 0 && neighbors === 3) {
                        nextGrid[r][c] = 1;
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[r][c] = 0;
                    } else {
                        nextGrid[r][c] = state; // Stasis
                    }

                    if(nextGrid[r][c] === 1) activeCount++;
                }
            }

            // Swap Arrays
            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            updateView(activeCount);
        }

        function countNeighbors(grid, r, c) {
            let sum = 0;
            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    // Skip self
                    if(i === 0 && j === 0) continue;
                    
                    // Toroidal wrap (Logic connects edges like a pac-man map)
                    // Remove the % arithmetic if you want hard edges
                    const row = (r + i + rows) % rows;
                    const col = (c + j + cols) % cols;
                    
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        // --- VISUAL UPDATE ---
        function updateView(activeCount) {
            // Updating DOM classes based on data
            // (Using direct child access is faster than querySelectorAll for loop)
            const cells = container.children;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const index = r * cols + c;
                    const cell = cells[index];
                    const state = grid[r][c];
                    
                    if (state === 1) cell.classList.add('active');
                    else cell.classList.remove('active');
                }
            }

            // Update Stats
            genDisplay.innerText = generation;
            const percentage = ((activeCount / (rows * cols)) * 100).toFixed(1);
            popDisplay.innerText = percentage;
        }

        function toggleCell(r, c, forceOn = false) {
            // Manual Interaction
            if(forceOn) {
                grid[r][c] = 1;
            } else {
                grid[r][c] = grid[r][c] === 1 ? 0 : 1;
            }
            
            // Visual Update immediately
            const index = r * cols + c;
            const cell = container.children[index];
            if(grid[r][c] === 1) cell.classList.add('active');
            else cell.classList.remove('active');
        }

        // --- CONTROLS ---
        function randomize() {
            let activeCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    // 20% chance of being alive
                    grid[r][c] = Math.random() > 0.8 ? 1 : 0;
                    if(grid[r][c]) activeCount++;
                }
            }
            generation = 0;
            updateView(activeCount);
        }

        function clear() {
            grid = grid.map(row => row.fill(0));
            generation = 0;
            updateView(0);
            stop();
        }

        function togglePlay() {
            if (isRunning) stop();
            else start();
        }

        function start() {
            isRunning = true;
            toggleBtn.innerText = "Stop Evolution";
            toggleBtn.classList.add('active');
            intervalId = setInterval(computeNextGen, UPDATE_SPEED);
        }

        function stop() {
            isRunning = false;
            toggleBtn.innerText = "Start Evolution";
            toggleBtn.classList.remove('active');
            clearInterval(intervalId);
        }

        function handleResize() {
            stop();
            calculateDimensions();
            createGrid();
            randomize();
        }

        // --- EVENT LISTENERS ---
        document.getElementById('random-btn').addEventListener('click', randomize);
        document.getElementById('clear-btn').addEventListener('click', clear);
        document.getElementById('step-btn').addEventListener('click', () => {
            stop();
            computeNextGen();
        });
        toggleBtn.addEventListener('click', togglePlay);

        // --- BOOT ---
        init();

    </script>
</body>
</html>
