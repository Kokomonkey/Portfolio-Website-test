<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mass & Light | DouweDoesDesign</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --dim-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* --- UI ELEMENTS --- */
        .back-btn {
            position: fixed;
            top: 2vh;
            left: 2vh;
            text-decoration: none;
            z-index: 100;
            border: 1px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-weight: 400;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 2vh;
            padding-top: 10vh;
            padding-left: 20px;
            padding-right: 20px;
            text-align: center;
        }

        .site-logo {
            height: 80px;
            width: auto;
            margin-bottom: 20px;
            border: 1px solid var(--accent-color);
            filter: invert(1);
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            text-transform: uppercase;
            font-weight: 300;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .intro-text {
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.5;
            color: #ccc;
            max-width: 600px;
            margin-bottom: 20px;
        }

        /* --- LAYOUT GRID --- */
        main {
            width: 100%;
            max-width: 1200px; /* Wider to accommodate sidebar */
            display: flex;
            flex-wrap: wrap; /* Allows stacking on mobile */
            gap: 20px;
            padding: 0 20px 50px 20px;
            justify-content: center;
        }

        /* LEFT: Main Canvas */
        .viewport-section {
            flex: 3; /* Takes 3 parts width */
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .canvas-container {
            position: relative;
            border: 1px solid var(--accent-color);
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #111;
            overflow: hidden;
            cursor: crosshair;
        }

        #mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* RIGHT: Sidebar (Controls + Map) */
        .sidebar-section {
            flex: 1; /* Takes 1 part width */
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            border: 1px solid var(--accent-color);
            padding: 15px;
            background: #000;
        }

        .panel-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 15px;
            display: block;
            color: #888;
        }

        /* Controls Styling */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 12px;
            font-family: inherit;
            text-transform: uppercase;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .action-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .action-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        /* Map Styling */
        .map-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #111;
        }

        #diagramCanvas {
            width: 100%;
            height: 100%;
        }

        .export-btn {
            margin-top: 10px;
            display: block;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            text-decoration: underline;
            color: #888;
            cursor: pointer;
        }
        .export-btn:hover { color: #fff; }


        @media (max-width: 800px) {
            main {
                flex-direction: column;
            }
            .viewport-section, .sidebar-section {
                width: 100%;
                flex: none;
            }
            .canvas-container {
                aspect-ratio: 1 / 1;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back</a>

    <header>
        <img src="Recourses/Logos/DDD.jpg" alt="DDD Logo" class="site-logo">
        <h1>Axonometric Study</h1>
        
        <div class="intro-text">
            <p><strong>3D Massing Tool:</strong> Visualize spatial relationships in axonometric projection.</p>
        </div>
    </header>

    <main>
        
        <div class="viewport-section">
            <div class="canvas-container" id="container">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>

        <aside class="sidebar-section">
            
            <div class="panel">
                <span class="panel-title">Tools</span>
                <div class="control-group">
                    <button id="modeBtn" class="action-btn active" onclick="setMode('build')">Mode: Build</button>
                    <button id="lightBtn" class="action-btn" onclick="setMode('light')">Mode: Light</button>
                    <button class="action-btn" onclick="clearGrid()">Clear Grid</button>
                </div>
                <div style="margin-top:15px; font-size: 0.75rem; color: #666; line-height: 1.4;">
                    <p id="instructionText">Click grid to stack blocks (Max: 3).</p>
                </div>
            </div>

            <div class="panel">
                <span class="panel-title">2D Diagram</span>
                <div class="map-wrapper">
                    <canvas id="diagramCanvas"></canvas>
                </div>
                <a class="export-btn" onclick="exportDiagram()">Download .PNG</a>
            </div>

        </aside>

    </main>

    <script>
        /** CONFIGURATION **/
        const GRID_SIZE = 10;
        const MAX_HEIGHT = 3; // UPDATED LIMIT
        const LIGHT_HEIGHT = 4; // Height of the light source orb
        
        // State
        let mode = 'build'; // 'build' | 'light'
        let grid = []; 
        let lightPos = { x: 5, y: 5 }; // Default Light Position (Grid Coords)
        
        let mouse = { x: -1000, y: -1000 }; 
        let mouseGridPos = { x: -1, y: -1 }; 

        // Canvas Setup
        const mainCanvas = document.getElementById('mainCanvas');
        const diagramCanvas = document.getElementById('diagramCanvas');
        const ctxMain = mainCanvas.getContext('2d');
        const ctxDia = diagramCanvas.getContext('2d');
        const container = document.getElementById('container');
        const instructionText = document.getElementById('instructionText');

        // Isometric Constants
        let TILE_WIDTH = 50;
        let TILE_HEIGHT = 25;
        let ORIGIN_X = 0;
        let ORIGIN_Y = 0;

        function initGrid() {
            grid = [];
            for(let x=0; x<GRID_SIZE; x++) {
                grid[x] = [];
                for(let y=0; y<GRID_SIZE; y++) {
                    grid[x][y] = 0; 
                }
            }
        }

        function resize() {
            const rect = container.getBoundingClientRect();
            // High DPI scaling for crisp lines
            const dpr = window.devicePixelRatio || 1;
            mainCanvas.width = rect.width * dpr;
            mainCanvas.height = rect.height * dpr;
            ctxMain.scale(dpr, dpr);
            // CSS size
            mainCanvas.style.width = rect.width + 'px';
            mainCanvas.style.height = rect.height + 'px';

            // Diagram
            const diaRect = document.querySelector('.map-wrapper').getBoundingClientRect();
            diagramCanvas.width = diaRect.width * dpr;
            diagramCanvas.height = diaRect.height * dpr;
            ctxDia.scale(dpr, dpr);

            
            // Center the 3D grid
            ORIGIN_X = rect.width / 2;
            ORIGIN_Y = (rect.height / 2) - (GRID_SIZE * TILE_HEIGHT / 2) + 50; 
            
            // Adjust Zoom
            if(rect.width < 500) {
                TILE_WIDTH = 30; TILE_HEIGHT = 15;
            } else {
                TILE_WIDTH = 50; TILE_HEIGHT = 25;
            }

            draw();
        }

        /* --- LOGIC --- */

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('modeBtn').classList.toggle('active', mode === 'build');
            document.getElementById('lightBtn').classList.toggle('active', mode === 'light');
            
            if(mode === 'build') {
                instructionText.innerText = "Click grid to stack blocks (Max: 3).";
            } else {
                instructionText.innerText = "Click a grid tile to place the light source.";
            }
            draw();
        }

        function clearGrid() {
            initGrid();
            draw();
        }

        // Iso Projection
        function isoToScreen(gx, gy, gz) {
            const x = (gx - gy) * TILE_WIDTH;
            const y = (gx + gy) * TILE_HEIGHT - (gz * TILE_HEIGHT * 1.5); 
            return {
                x: ORIGIN_X + x,
                y: ORIGIN_Y + y
            };
        }

        function pointInPoly(x, y, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const xi = poly[i].x, yi = poly[i].y;
                const xj = poly[j].x, yj = poly[j].y;
                const intersect = ((yi > y) !== (yj > y)) &&
                    (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function updateMouseGridPos(e) {
            const rect = mainCanvas.getBoundingClientRect();
            // Adjust for CSS scaling vs Canvas coordinate
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            mouse.x = mx;
            mouse.y = my;

            mouseGridPos = { x: -1, y: -1 };
            
            // Hit detection loop
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const h = grid[x][y];
                    // We check the "Top Face" of the current stack height
                    const topFace = [
                        isoToScreen(x, y, h),
                        isoToScreen(x+1, y, h),
                        isoToScreen(x+1, y+1, h),
                        isoToScreen(x, y+1, h)
                    ];

                    if (pointInPoly(mx, my, topFace)) {
                        mouseGridPos = { x: x, y: y };
                    }
                }
            }
        }

        /* --- EVENTS --- */

        mainCanvas.addEventListener('mousemove', (e) => {
            updateMouseGridPos(e);
            draw();
        });

        mainCanvas.addEventListener('mousedown', (e) => {
            updateMouseGridPos(e);
            const {x, y} = mouseGridPos;
            
            if(x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                if(mode === 'build') {
                    if(grid[x][y] < MAX_HEIGHT) {
                        grid[x][y]++;
                    } else {
                        // Optional: Reset to 0 if full? Or just stay full. 
                        // Let's keep it additive up to max.
                    }
                } else if (mode === 'light') {
                    // Place light
                    lightPos = {x, y};
                }
                draw();
            }
        });

        mainCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mainCanvas.dispatchEvent(new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY }));
        }, {passive: false});

        /* --- DRAWING --- */

        function draw() {
            // Clear
            ctxMain.fillStyle = '#000000';
            ctxMain.fillRect(0, 0, mainCanvas.width / window.devicePixelRatio, mainCanvas.height / window.devicePixelRatio); // Rough clear
            // Actually simpler to clear huge rect
            ctxMain.clearRect(0,0,10000,10000);
            ctxMain.fillRect(0,0,10000,10000);

            // 2D Map Clear
            ctxDia.fillStyle = '#000';
            ctxDia.fillRect(0,0,10000,10000);

            // --- 3D RENDER LOOP ---
            let renderList = [];
            for(let x=0; x<GRID_SIZE; x++) {
                for(let y=0; y<GRID_SIZE; y++) {
                    renderList.push({x, y, h: grid[x][y]});
                }
            }
            renderList.sort((a, b) => (a.x + a.y) - (b.x + b.y));

            // 1. Draw Shadows (on floor)
            // Light source position in Screen Space
            const lScreen = isoToScreen(lightPos.x + 0.5, lightPos.y + 0.5, LIGHT_HEIGHT);

            renderList.forEach(block => {
                if (block.h > 0) {
                    drawProjectedShadow(ctxMain, block.x, block.y, block.h, lScreen, lightPos);
                }
            });

            // 2. Draw Blocks
            renderList.forEach(block => {
                let isHover = (block.x === mouseGridPos.x && block.y === mouseGridPos.y);
                drawIsoBlock(ctxMain, block.x, block.y, block.h, isHover);
            });

            // 3. Draw Light Source Indicator
            drawLightOrb(ctxMain, lScreen);

            // --- 2D MAP RENDER ---
            draw2DMap();
        }

        function drawLightOrb(ctx, screenPos) {
            ctx.fillStyle = 'white';
            ctx.shadowColor = 'white';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(screenPos.x, screenPos.y, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Draw a thin line down to grid
            const base = isoToScreen(lightPos.x + 0.5, lightPos.y + 0.5, 0);
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(screenPos.x, screenPos.y);
            ctx.lineTo(base.x, base.y);
            ctx.stroke();
        }

        function drawIsoBlock(ctx, x, y, h, isHover) {
            // Ghost height for hover build
            const zHeight = (h === 0 && isHover && mode === 'build') ? 0.2 : h;
            
            // Top Face Corners
            const c0 = isoToScreen(x, y, zHeight);
            const c1 = isoToScreen(x+1, y, zHeight);
            const c2 = isoToScreen(x+1, y+1, zHeight);
            const c3 = isoToScreen(x, y+1, zHeight);

            // Bottom Face Corners
            const b1 = isoToScreen(x+1, y, 0);
            const b2 = isoToScreen(x+1, y+1, 0);
            const b3 = isoToScreen(x, y+1, 0);

            // Colors
            const strokeColor = isHover ? '#fff' : '#888';
            // Inverted aesthetics:
            // Top: White
            // Sides: Grey gradients
            const topColor = isHover && mode === 'build' ? '#fff' : '#ddd';
            const rightColor = '#666';
            const leftColor = '#333';
            
            ctx.lineWidth = 1;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = strokeColor;

            if (h > 0 || (isHover && mode === 'build')) {
                // Left Face
                ctx.fillStyle = leftColor;
                ctx.beginPath();
                ctx.moveTo(c3.x, c3.y); ctx.lineTo(c0.x, c0.y);
                ctx.lineTo(isoToScreen(x,y,0).x, isoToScreen(x,y,0).y); ctx.lineTo(b3.x, b3.y);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                // Right Face
                ctx.fillStyle = rightColor;
                ctx.beginPath();
                ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y);
                ctx.lineTo(b2.x, b2.y); ctx.lineTo(b1.x, b1.y);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                // Top Face
                ctx.fillStyle = topColor;
                ctx.beginPath();
                ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y);
                ctx.lineTo(c2.x, c2.y); ctx.lineTo(c3.x, c3.y);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else {
                // Empty Grid
                ctx.strokeStyle = '#222';
                // Highlight grid if hovering in light mode to show placement target
                if (isHover && mode === 'light') ctx.strokeStyle = '#fff';
                
                ctx.beginPath();
                ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y);
                ctx.lineTo(c2.x, c2.y); ctx.lineTo(c3.x, c3.y);
                ctx.closePath(); ctx.stroke();
            }
        }

        function drawProjectedShadow(ctx, x, y, h, lScreen, lGrid) {
            // To calculate the shadow projected on the floor (z=0) from a point light:
            // We take vector from Light(Lx, Ly, Lz) to BlockTop(Bx, By, Bz).
            // We project that vector until Z = 0.
            
            // Simplified geometric projection for visual effect:
            // 1. Get Top Center of Block
            const bTop = isoToScreen(x+0.5, y+0.5, h);
            
            // 2. Vector from Light Screen Pos to Block Top Screen Pos
            const dx = bTop.x - lScreen.x;
            const dy = bTop.y - lScreen.y;
            
            // 3. Scale factor based on height difference
            // If block is h=1 and light is h=4, difference is 3. 
            // Shadow gets longer as block gets closer to light height.
            const heightDiff = Math.max(0.1, LIGHT_HEIGHT - h);
            const scale = h / heightDiff; 
            
            // 4. Shadow Tip Position
            const tipX = bTop.x + dx * scale;
            const tipY = bTop.y + dy * scale;

            // Draw shadow polygon based on the block's base and the tip
            // We need the two widest points of the base relative to the light...
            // Approximation: Draw a blob from base center to tip
            const bBase = isoToScreen(x+0.5, y+0.5, 0);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; // Inverted shadow (whiteish on black)
            
            ctx.beginPath();
            // Start at base corners (approximate for simplicity)
            const baseLeft = isoToScreen(x, y+1, 0);
            const baseRight = isoToScreen(x+1, y, 0);
            const baseBack = isoToScreen(x, y, 0);
            
            ctx.moveTo(baseLeft.x, baseLeft.y);
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(baseRight.x, baseRight.y);
            // Connect back
            ctx.lineTo(baseBack.x, baseBack.y);
            ctx.closePath();
            ctx.fill();
        }

        function draw2DMap() {
            // Get size from canvas attribute (not style)
            const w = diagramCanvas.width / window.devicePixelRatio;
            const h = diagramCanvas.height / window.devicePixelRatio;
            const cellW = w / GRID_SIZE;
            const cellH = h / GRID_SIZE;

            for(let x=0; x<GRID_SIZE; x++) {
                for(let y=0; y<GRID_SIZE; y++) {
                    const ht = grid[x][y];
                    
                    if(ht > 0) {
                        const val = 255 - (ht * 50); // Darker = Higher
                        ctxDia.fillStyle = `rgb(${val}, ${val}, ${val})`;
                        ctxDia.fillRect(x*cellW, y*cellH, cellW, cellH);
                    } else {
                        ctxDia.strokeStyle = '#333';
                        ctxDia.strokeRect(x*cellW, y*cellH, cellW, cellH);
                    }

                    // Draw Light Source on Map
                    if(x === lightPos.x && y === lightPos.y) {
                        ctxDia.fillStyle = 'yellow';
                        ctxDia.beginPath();
                        ctxDia.arc(x*cellW + cellW/2, y*cellH + cellH/2, cellW/4, 0, Math.PI*2);
                        ctxDia.fill();
                    }
                }
            }
        }

        function exportDiagram() {
            const link = document.createElement('a');
            link.download = '2d-plan-export.png';
            link.href = diagramCanvas.toDataURL();
            link.click();
        }

        initGrid();
        window.addEventListener('resize', resize);
        // Initial init
        setTimeout(resize, 100);

    </script>
</body>
</html>
