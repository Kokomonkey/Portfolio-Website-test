<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Archive | DouweDoesDesign</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER (Matching your style) --- */
        header {
            padding: 4vh;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        h1 {
            text-transform: uppercase;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 1.2rem;
            margin: 0;
        }

        /* --- 3D VIEWPORT --- */
        model-viewer {
            width: 100%;
            flex-grow: 1;
            background-color: var(--bg-color);
            --poster-color: transparent;
        }

        /* Customizing the interaction prompt */
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1px;
            opacity: 0.5;
            pointer-events: none;
        }

        .back-btn {
            position: fixed;
            top: 4vh;
            left: 4vh;
            text-decoration: none;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            transition: 0.3s;
            z-index: 10;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back</a>

    <header>
        <h1>Object Analysis // 001</h1>
    </header>

    <model-viewer 
        src="//testSites//pages/Recourses/3DObjects/3DTestObject.gltf" 
        alt="A 3D model" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1" 
        exposure="1"
        camera-orbit="45deg 75deg 105%"
        touch-action="pan-y">
        
        <div class="controls-hint">Click and Drag to Rotate // Scroll to Zoom</div>
    </model-viewer>

</body>
</html>
