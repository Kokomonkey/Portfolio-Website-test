<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" style="background-color: #fafafa; font-family: sans-serif;">
  <defs>
    <style>
      .zone-bg-top { fill: #f0f4f8; stroke: #cfd8dc; stroke-width: 2; stroke-dasharray: 6,4; }
      .zone-bg-mid { fill: #eceff1; stroke: #b0bec5; stroke-width: 2; stroke-dasharray: 6,4; }
      .zone-bg-bot { fill: #dcedc8; stroke: #aed581; stroke-width: 2; }
      
      .bldg-low { fill: #ffffff; stroke: #37474f; stroke-width: 1.5; }
      .bldg-mid { fill: #e0e0e0; stroke: #263238; stroke-width: 2; }
      .bldg-high { fill: #bdbdbd; stroke: #000000; stroke-width: 3.5; }
      
      .road { fill: none; stroke: #e0e0e0; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .road-secondary { fill: none; stroke: #eeeeee; stroke-width: 10; }
    </style>
  </defs>

  <polyline points="-50,380 1050,480" class="road" />
  <polyline points="380,-50 320,390 450,650 380,1050" class="road" />
  <polyline points="450,650 1050,780" class="road" />
  <polyline points="150,390 50,650 380,800" class="road-secondary" />

  <g transform="translate(350, 80) rotate(18)">
    <polygon points="0,0 350,20 320,220 -30,180" class="zone-bg-top" />
    
    <rect x="20" y="30" width="90" height="20" class="bldg-low" />
    <rect x="20" y="65" width="90" height="20" class="bldg-low" />
    <rect x="20" y="100" width="90" height="20" class="bldg-low" />
    
    <rect x="150" y="30" width="120" height="20" class="bldg-low" />
    <rect x="150" y="65" width="120" height="20" class="bldg-low" />
    <polygon points="150,100 270,100 270,150 250,150 250,120 150,120" class="bldg-low" />
    
    <rect x="10" y="140" width="100" height="20" class="bldg-low" />
    <rect x="10" y="175" width="60" height="20" class="bldg-low" />
    
    <polygon points="130,160 220,160 220,200 200,200 200,180 130,180" class="bldg-low" />
  </g>

  <g transform="translate(220, 420) rotate(-5)">
    <polygon points="0,0 280,30 300,260 40,230" class="zone-bg-mid" />
    
    <polygon points="40,40 120,40 120,65 65,65 65,110 40,110" class="bldg-mid" />
    <polygon points="150,45 230,55 230,120 205,120 205,80 150,70" class="bldg-mid" />
    
    <polygon points="35,140 100,140 100,200 35,200 35,175 75,175 75,165 35,165" class="bldg-mid" />
    
    <rect x="125" y="150" width="40" height="60" class="bldg-mid" />
    <rect x="180" y="160" width="60" height="40" class="bldg-mid" />
    <rect x="235" y="130" width="35" height="50" class="bldg-mid" />
  </g>

  <g transform="translate(520, 680)">
    <polygon points="-20,40 180,-60 380,-10 440,220 220,320 -80,220" class="zone-bg-bot" />
    
    <polygon points="10,50 110,40 120,80 20,90" class="bldg-low" />
    <rect x="40" y="35" width="45" height="45" class="bldg-high" /> 
    
    <polygon points="160,0 260,10 250,70 150,60" class="bldg-low" />
    <rect x="185" y="15" width="50" height="50" class="bldg-high" />
    
    <polygon points="300,50 380,80 340,160 260,130" class="bldg-low" />
    <rect x="305" y="75" width="55" height="55" class="bldg-high" />
    
    <polygon points="60,160 160,150 170,220 70,230" class="bldg-low" />
    <rect x="85" y="155" width="60" height="60" class="bldg-high" />
    
    <rect x="220" y="210" width="45" height="45" class="bldg-high" />
  </g>
  
</svg>