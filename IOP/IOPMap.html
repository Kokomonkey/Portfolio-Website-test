<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Recourses/Logos/DDD.jpg">
    <title>IOP1 Map Generator | [DOUWEDOESDESIGN]</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --alert-color: #ff0000;
            --ui-font: 'Courier New', Courier, monospace;
            --paper-color: #f4f4f4; /* Light background required for Multiply effect */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: var(--ui-font);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
        }

        /* --- BACK BUTTON --- */
        .back-btn {
            position: fixed; top: 30px; left: 30px;
            text-decoration: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            z-index: 100;
            transition: all 0.2s;
        }
        .back-btn:hover { background-color: var(--accent-color); color: var(--bg-color); }

        /* --- INFO PANEL (LEFT) --- */
        .info-panel {
            width: 200px;
            flex-shrink: 0;
            text-align: left;
            margin-left: 2vw;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            font-size: 1.2rem; text-transform: uppercase;
            border-bottom: 2px solid var(--alert-color);
            padding-bottom: 5px; margin-bottom: 5px;
        }

        p { font-size: 0.75rem; line-height: 1.4; color: #888; }

        /* --- CENTRAL VIEWPORT (MAP FRAME) --- */
        .plan-viewport {
            /* KEY CHANGE: Scale to Window Height */
            height: 90vh; 
            width: auto; 
            aspect-ratio: 1 / 1.414; /* A-series paper aspect ratio (approx), adjust if needed */
            
            position: relative; 
            background-color: var(--paper-color); /* White background for 'Multiply' to work */
            border: 1px solid #333;
            overflow: hidden;
            
            /* Center the layers */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plan-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
            
            /* KEY CHANGE: Multiply Blend Mode */
            mix-blend-mode: multiply;
        }

        .plan-layer.active {
            display: block;
        }

        .plan-layer img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensure entire map fits */
            display: block;
        }

        /* --- EXPORT OVERLAY (Dark text because background is now light) --- */
        .map-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 50;
            color: #000; /* Black ink for the overlay */
        }

        .north-arrow {
            width: 40px;
            height: 40px;
            border: 2px solid #000;
            border-radius: 50%;
            position: relative;
        }
        .north-arrow::after {
            content: '';
            position: absolute;
            left: 50%; top: 0;
            width: 2px; height: 50%;
            background-color: #000;
            transform: translateX(-50%);
        }
        .north-arrow::before {
            content: 'N';
            position: absolute;
            top: -12px; left: 50%;
            transform: translateX(-50%);
            font-size: 10px; font-weight: bold; color: #000;
        }

        .scale-marker {
            font-size: 0.7rem;
            border-top: 2px solid #000;
            padding-top: 2px;
            width: 50px;
            text-align: center;
            font-weight: bold;
        }

        /* --- CONTROLS SYSTEM (RIGHT) --- */
        .controls-panel {
            width: 160px;
            margin-right: 2vw;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .layer-btn {
            background: transparent;
            border: 1px solid #333;
            color: #555;
            padding: 8px;
            text-align: left;
            cursor: pointer;
            font-family: var(--ui-font);
            text-transform: uppercase;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            transition: 0.2s;
        }

        .layer-btn:hover { border-color: #666; color: #aaa; }
        
        .layer-btn.active {
            border-color: var(--alert-color);
            color: var(--accent-color);
        }
        .layer-btn.active::after { content: 'ON'; color: var(--alert-color); }
        .layer-btn::after { content: 'OFF'; color: #333; }

        .export-btn {
            margin-top: 20px;
            background-color: var(--alert-color);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-family: var(--ui-font);
            font-size: 0.8rem;
        }
        .export-btn:hover { background-color: #fff; }

        /* Helper for missing images */
        .error-msg {
            color: red; font-size: 10px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">←</a>

    <div class="info-panel">
        <div>
            <h2>IOP1 Generator</h2>
            <p>Layer stacking visualization.</p>
        </div>
        <div style="font-size: 0.7rem; color: #666;">
            MODE: MULTIPLY<br>
            SCALE: 1:20000<br>
            STATUS: ACTIVE
        </div>
    </div>

    <div class="plan-viewport" id="capture-target">
        
        <div class="plan-layer active" id="layer-base">
            <img src="Maps/BaseA1.svg" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <div class="error-msg">BaseA1.svg missing</div>
        </div>

        <div class="plan-layer" id="layer-water">
            <img src="Maps/WaterA1.svg" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <div class="error-msg">WaterA1.svg missing</div>
        </div>

        <div class="plan-layer" id="layer-extra">
             <img src="https://placehold.co/800x1100/transparent/red/png?text=HEATMAP" style="opacity:0.5">
        </div>

        <div class="map-overlay">
            <div class="north-arrow"></div>
            <div class="scale-marker">1:20000</div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="layer-btn active" onclick="toggleLayer('layer-base', this)">Base Map</button>
        <button class="layer-btn" onclick="toggleLayer('layer-water', this)">Water</button>
        <button class="layer-btn" onclick="toggleLayer('layer-extra', this)">Heatmap</button>

        <button class="export-btn" onclick="exportMap()">Export PNG</button>
    </div>

    <script>
        function toggleLayer(layerId, btn) {
            const layer = document.getElementById(layerId);
            layer.classList.toggle('active');
            btn.classList.toggle('active');
        }

        function exportMap() {
            const node = document.getElementById('capture-target');
            const btn = document.querySelector('.export-btn');
            const originalText = btn.innerText;

            btn.innerText = "RENDERING...";
            btn.style.opacity = "0.5";

            // dom-to-image usually handles SVGs and Filters better than html2canvas
            domtoimage.toPng(node)
                .then(function (dataUrl) {
                    var link = document.createElement('a');
                    link.download = 'IOP1_Map_Export.png';
                    link.href = dataUrl;
                    link.click();
                    
                    btn.innerText = originalText;
                    btn.style.opacity = "1";
                })
                .catch(function (error) {
                    console.error('oops, something went wrong!', error);
                    alert("Export Failed. \n\n1. Ensure you are running this on a Local Server (not just double clicking the file).\n2. Ensure SVGs are valid.\n3. Check Console (F12) for details.");
                    btn.innerText = "ERROR";
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.opacity = "1";
                    }, 3000);
                });
        }
    </script>
</body>
</html>
