<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home of Shadows - Light Engine Pro</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
        }
        canvas { display: block; }
        #ui-container {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(5px);
            color: #eee; padding: 20px; border-radius: 12px;
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 320px; max-height: 90vh; overflow-y: auto; pointer-events: auto;
        }
        h2 { margin-top: 0; font-size: 16px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; }
        .control-group { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; font-weight: 500;}
        input[type=range] { width: 100%; cursor: pointer; accent-color: #e67e22; }
        input[type=color] { width: 100%; height: 30px; border: none; border-radius: 4px; cursor: pointer; background: transparent; }
        select { width: 100%; padding: 6px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button {
            width: 100%; padding: 8px; background-color: #333; color: white;
            border: 1px solid #555; border-radius: 6px; cursor: pointer;
            font-size: 12px; font-weight: bold; transition: all 0.2s;
        }
        button:hover { background-color: #e67e22; border-color: #e67e22; }
        .primary-btn { background-color: #e67e22; border-color: #e67e22; grid-column: span 2; font-size: 14px;}
        .primary-btn:hover { background-color: #d35400; }
        .danger-btn { background-color: #c0392b; border-color: #c0392b; }
        .danger-btn:hover { background-color: #a53125; border-color: #a53125; }
        .active-mode { background-color: #27ae60 !important; border-color: #27ae60 !important; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h2>Lighting Engine</h2>
        <div class="control-group">
            <label for="sunAzimuth">Sun Rotation: <span id="azimuthVal">45°</span></label>
            <input type="range" id="sunAzimuth" min="0" max="360" value="45">
        </div>
        <div class="control-group">
            <label for="sunAltitude">Sun Height: <span id="altitudeVal">60°</span></label>
            <input type="range" id="sunAltitude" min="0" max="90" value="60">
        </div>
        <div class="control-group">
            <label for="sunIntensity">Sun Intensity: <span id="intensityVal">2.0</span></label>
            <input type="range" id="sunIntensity" min="0" max="4" step="0.1" value="2.0">
        </div>
        
        <div class="control-group">
            <label for="ambientIntensity">Ambient Sky Bounce: <span id="ambientVal">0.3</span></label>
            <input type="range" id="ambientIntensity" min="0" max="1" step="0.05" value="0.3">
        </div>

        <h2>Block Material & Tools</h2>
        <div class="control-group">
            <label for="blockColor">Color:</label>
            <input type="color" id="blockColor" value="#555555">
        </div>
        <div class="control-group">
            <label for="blockReflect">Glossiness (Reflection): <span id="reflectVal">Matte</span></label>
            <input type="range" id="blockReflect" min="0" max="1" step="0.1" value="0.2">
        </div>
        <div class="control-group">
            <label for="blockShape">Shape:</label>
            <select id="blockShape">
                <option value="cube">Cube</option>
                <option value="sphere">Sphere</option>
            </select>
        </div>

        <div class="button-grid">
            <button id="btnBuild" class="active-mode">🔨 Build Mode</button>
            <button id="btnErase">🧹 Erase Mode</button>
        </div>

        <h2>Pre-built Scenes</h2>
        <div class="control-group">
            <select id="sceneSelect">
                <option value="hallway">Skylight Hallway</option>
                <option value="room">Enclosed Room</option>
                <option value="pyramid">Stepped Pyramid</option>
            </select>
        </div>
        <button id="loadScene">Load Selected Scene</button>

        <div class="button-grid" style="margin-top: 20px;">
            <button id="toggleSunAnim">Play Sun Anim</button>
            <button id="cameraToggle" class="primary-btn">Switch to View Mode</button>
            <button id="clearBlocks" class="danger-btn" style="grid-column: span 2;">Clear All Blocks</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505); 
        scene.fog = new THREE.FogExp2(0x050505, 0.015); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // NEW PHYSICAL RENDERING SETTINGS
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.0;
        renderer.outputEncoding = THREE.sRGBEncoding; // Crucial for realistic light falloff
        document.body.appendChild(renderer.domElement);

        const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;
        orbitControls.maxPolarAngle = Math.PI / 2 + 0.1;

        // NEW AMBIENT BOUNCE ENGINE (Hemisphere Light)
        // (SkyColor, GroundColor, Intensity)
        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x111111, 0.3);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        const d = 25;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const gridSize = 40;
        const gridHelper = new THREE.GridHelper(gridSize, gridSize, 0x444444, 0x222222);
        gridHelper.position.y = 0.001; 
        scene.add(gridHelper);

        const floorGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
        const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32);
        let objects = [floor]; 
        let placedBlocks = []; 

        let isBuildMode = true;
        let isSunAnimating = false;
        let currentTool = 'build'; 

        const rollOverGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01); 
        const rollOverMatBuild = new THREE.MeshBasicMaterial({ color: 0x27ae60, opacity: 0.5, transparent: true, wireframe: true });
        const rollOverMatErase = new THREE.MeshBasicMaterial({ color: 0xe74c3c, opacity: 0.5, transparent: true, wireframe: true });
        const rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMatBuild);
        scene.add(rollOverMesh);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function clearAll() {
            placedBlocks.forEach(block => {
                scene.remove(block);
                const objIndex = objects.indexOf(block);
                if(objIndex > -1) objects.splice(objIndex, 1);
            });
            placedBlocks = [];
        }

        function addVoxel(x, y, z, customMaterial = null) {
            const glossValue = parseFloat(document.getElementById('blockReflect').value);
            // With sRGB enabled, we need to adjust roughness to feel right
            const roughness = 1.0 - glossValue;
            const metalness = glossValue * 0.8; // Give it a more realistic sheen
            
            const mat = customMaterial || new THREE.MeshStandardMaterial({ 
                color: document.getElementById('blockColor').value, 
                roughness: roughness,
                metalness: metalness
            });

            const shapeType = document.getElementById('blockShape').value;
            const geo = (shapeType === 'sphere' && !customMaterial) ? sphereGeo : cubeGeo;

            const voxel = new THREE.Mesh(geo, mat);
            voxel.position.set(x + 0.5, y + 0.5, z + 0.5); 
            voxel.castShadow = true;
            voxel.receiveShadow = true;
            scene.add(voxel);
            objects.push(voxel);
            placedBlocks.push(voxel);
        }

        function buildHallway() {
            clearAll();
            const mat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.8, metalness: 0.2 });
            for(let z = -8; z <= 8; z++) {
                for(let y = 0; y < 5; y++) {
                    addVoxel(-3, y, z, mat);
                    addVoxel(3, y, z, mat);
                }
            }
            for(let z = -8; z <= 8; z++) {
                for(let x = -3; x <= 3; x++) {
                    if (Math.abs(x) <= 1 && Math.abs(z) <= 2) continue; 
                    addVoxel(x, 5, z, mat);
                }
            }
        }

        function buildRoom() {
            clearAll();
            const mat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.9, metalness: 0.1 });
            for(let x = -4; x <= 4; x++) {
                for(let y = 0; y < 6; y++) {
                    for(let z = -4; z <= 4; z++) {
                        if (x > -4 && x < 4 && y < 5 && z > -4 && z < 4) continue;
                        if (z === 4 && y > 1 && y < 4 && x > -2 && x < 2) continue;
                        addVoxel(x, y, z, mat);
                    }
                }
            }
        }

        function buildPyramid() {
            clearAll();
            const mat = new THREE.MeshStandardMaterial({ color: 0x8a7a5c, roughness: 1.0, metalness: 0.0 });
            let size = 6; let y = 0;
            while(size > 0) {
                for(let x = -size; x <= size; x++) {
                    for(let z = -size; z <= size; z++) { addVoxel(x, y, z, mat); }
                }
                size -= 2; y++;
            }
        }

        buildHallway();
        camera.position.set(10, 15, 15);
        camera.lookAt(0, 0, 0);

        let pointerDownPos = { x: 0, y: 0 };

        window.addEventListener('mousemove', (event) => {
            if (!isBuildMode) { rollOverMesh.visible = false; return; }
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                rollOverMesh.visible = true;
                
                if (currentTool === 'erase' && intersect.object !== floor) {
                    rollOverMesh.position.copy(intersect.object.position);
                } else {
                    const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    rollOverMesh.position.copy(pos).floor().addScalar(0.5);
                }
            } else { rollOverMesh.visible = false; }
        });

        window.addEventListener('pointerdown', (e) => { pointerDownPos = { x: e.clientX, y: e.clientY }; });

        window.addEventListener('pointerup', (event) => {
            if (!isBuildMode) return;
            const dist = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
            if (dist > 5) return; 
            if (event.target.closest('#ui-container')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (currentTool === 'erase') {
                    if (intersect.object !== floor) {
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                        placedBlocks.splice(placedBlocks.indexOf(intersect.object), 1);
                        rollOverMesh.visible = false; 
                    }
                } else {
                    const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    pos.floor();
                    addVoxel(pos.x, pos.y, pos.z);
                }
            }
        });

        // --- DYNAMIC LIGHT ENGINE ---
        function updateSun() {
            const azimuth = document.getElementById('sunAzimuth').value;
            const altitude = document.getElementById('sunAltitude').value;
            const intensity = document.getElementById('sunIntensity').value;
            const ambient = document.getElementById('ambientIntensity').value;

            document.getElementById('azimuthVal').innerText = Math.floor(azimuth) + '°';
            document.getElementById('altitudeVal').innerText = altitude + '°';
            document.getElementById('intensityVal').innerText = intensity;
            document.getElementById('ambientVal').innerText = ambient;

            const phi = THREE.MathUtils.degToRad(90 - altitude);
            const theta = THREE.MathUtils.degToRad(azimuth);
            const distance = 50;

            sunLight.position.x = distance * Math.sin(phi) * Math.cos(theta);
            sunLight.position.y = distance * Math.cos(phi);
            sunLight.position.z = distance * Math.sin(phi) * Math.sin(theta);
            sunLight.intensity = parseFloat(intensity);
            
            // Apply Ambient Slider
            hemiLight.intensity = parseFloat(ambient);

            // Change atmospheric bounce light based on time of day
            if (altitude < 5) {
                scene.background.setHex(0x020205); scene.fog.color.setHex(0x020205);
                sunLight.color.setHex(0xff7700); sunLight.intensity *= 0.2;
                hemiLight.color.setHex(0x2a1040); // Dark purple sky bounce
                hemiLight.groundColor.setHex(0x000000); 
            } else if (altitude < 20) {
                scene.background.setHex(0x1a0f14); scene.fog.color.setHex(0x1a0f14);
                sunLight.color.setHex(0xffb366);
                hemiLight.color.setHex(0xff9e5e); // Orange sky bounce
                hemiLight.groundColor.setHex(0x110a05); // Warm ground bounce
            } else {
                scene.background.setHex(0x050505); scene.fog.color.setHex(0x050505);
                sunLight.color.setHex(0xfff5e6);
                hemiLight.color.setHex(0x87CEEB); // Standard blue sky bounce
                hemiLight.groundColor.setHex(0x111111); // Standard dark ground
            }
        }

        document.getElementById('sunAzimuth').addEventListener('input', updateSun);
        document.getElementById('sunAltitude').addEventListener('input', updateSun);
        document.getElementById('sunIntensity').addEventListener('input', updateSun);
        document.getElementById('ambientIntensity').addEventListener('input', updateSun);
        
        document.getElementById('blockReflect').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('reflectVal').innerText = val < 0.3 ? "Matte" : (val > 0.7 ? "Glossy/Metal" : "Satin");
        });

        updateSun();

        document.getElementById('btnBuild').addEventListener('click', () => {
            currentTool = 'build';
            document.getElementById('btnBuild').classList.add('active-mode');
            document.getElementById('btnErase').classList.remove('active-mode');
            rollOverMesh.material = rollOverMatBuild;
        });

        document.getElementById('btnErase').addEventListener('click', () => {
            currentTool = 'erase';
            document.getElementById('btnErase').classList.add('active-mode');
            document.getElementById('btnBuild').classList.remove('active-mode');
            rollOverMesh.material = rollOverMatErase;
        });

        document.getElementById('loadScene').addEventListener('click', () => {
            const choice = document.getElementById('sceneSelect').value;
            if(choice === 'hallway') buildHallway();
            else if(choice === 'room') buildRoom();
            else if(choice === 'pyramid') buildPyramid();
        });

        const btnToggle = document.getElementById('cameraToggle');
        btnToggle.addEventListener('click', () => {
            isBuildMode = !isBuildMode;
            if (isBuildMode) {
                btnToggle.innerText = "Switch to View Mode";
                rollOverMesh.visible = true;
                camera.position.set(10, 15, 15);
                camera.lookAt(0,0,0);
            } else {
                btnToggle.innerText = "Switch to Build Mode";
                rollOverMesh.visible = false;
                camera.position.set(0, 2, 7);
                camera.lookAt(0, 2, -7);
            }
        });

        const btnAnim = document.getElementById('toggleSunAnim');
        btnAnim.addEventListener('click', () => {
            isSunAnimating = !isSunAnimating;
            btnAnim.innerText = isSunAnimating ? "Pause Sun Anim" : "Play Sun Anim";
            btnAnim.style.backgroundColor = isSunAnimating ? "#e67e22" : "#333";
        });

        document.getElementById('clearBlocks').addEventListener('click', clearAll);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            if (isSunAnimating) {
                const azSlider = document.getElementById('sunAzimuth');
                let newVal = parseFloat(azSlider.value) + 0.2;
                if (newVal > 360) newVal = 0;
                azSlider.value = newVal;
                updateSun();
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
