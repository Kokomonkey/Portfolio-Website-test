<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Recourses/Logos/DDD.jpg">
    <title>System Logs | DouweDoesDesign</title>
    <style>
        /* BLUEPRINT THEME */
        :root {
            --bg: #0a1628;
            --fg: #ffffff;
            --cyan: #00c8ff;
            --cyan-dim: rgba(0,200,255,0.18);
            --grid-major: rgba(0,200,255,0.07);
            --grid-minor: rgba(0,200,255,0.025);
            --speed: 0.3s;
            --code-font: 'Courier New', Courier, monospace;
        }

        html { cursor: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }

        body {
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--grid-major) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
                linear-gradient(var(--grid-minor) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            color: var(--fg); font-family: var(--code-font);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; overflow-x: hidden; overflow-y: scroll;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.3); }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

        /* CURSOR */
        #cur-main {
            position: fixed; pointer-events: none; z-index: 10001;
            top: 0; left: 0; width: 1px; height: 20px;
            background: rgba(255,255,255,0.92); will-change: transform;
        }
        #cur-main::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 20px; height: 1px; background: rgba(255,255,255,0.92);
            transform: translate(-50%,-50%);
        }
        #cur-main::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: #fff; border-radius: 50%;
            transform: translate(-50%,-50%);
        }
        #cur-follow {
            position: fixed; pointer-events: none; z-index: 10000;
            top: 0; left: 0; width: 36px; height: 36px;
            border: 1px solid var(--cyan); opacity: 0.75;
            will-change: transform, width, height;
            transition: width 0.15s ease, height 0.15s ease;
        }

        /* BACK BUTTON */
        .back-btn {
            position: fixed; top: 4vh; left: 4vh; text-decoration: none; z-index: 1000;
            border: 1px solid var(--cyan); background-color: transparent; color: var(--cyan);
            padding: 10px 20px; text-transform: uppercase; font-size: 0.8rem;
            letter-spacing: 1px; transition: all var(--speed) ease;
        }
        .back-btn:hover { background-color: var(--cyan); color: var(--bg); }

        /* HEADER */
        header {
            min-height: 20vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding-top: 50px; margin-bottom: 50px; width: 100%; text-align: center;
        }
        .site-logo { height: 60px; width: auto; margin-bottom: 20px; filter: invert(1); mix-blend-mode: screen; opacity: 0.35; }
        h1 { font-size: 2rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 300; border-bottom: 1px solid var(--cyan); padding-bottom: 10px; }

        /* TIMELINE */
        main { width: 100%; max-width: 800px; padding: 0 20px 100px 20px; display: flex; flex-direction: column; gap: 20px; }

        .status-bar {
            font-family: var(--code-font); font-size: 0.8rem; color: var(--cyan);
            margin-bottom: 20px; border-bottom: 1px dashed rgba(0,200,255,0.3);
            padding-bottom: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        .status-dot { display: inline-block; width: 10px; height: 10px; background: var(--cyan); border-radius: 50%; margin-right: 10px; animation: pulse 2s infinite; }

        /* Commit card — data stream from right */
        .commit-entry {
            border: 1px solid rgba(0,200,255,0.18); padding: 25px;
            background: rgba(10,22,40,0.7);
            transition: all var(--speed) cubic-bezier(0.25, 1, 0.5, 1);
            position: relative; overflow: hidden;
            opacity: 0; animation: dataStream 0.5s ease forwards;
        }
        .commit-entry:hover { border-color: var(--cyan); background: rgba(0,200,255,0.04); box-shadow: 0 0 20px var(--cyan-dim); transform: scale(1.01); }

        .commit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-family: var(--code-font); font-size: 0.75rem; color: var(--cyan); }
        .commit-date { text-transform: uppercase; letter-spacing: 1px; }
        .commit-msg { font-size: 1.1rem; font-weight: 400; line-height: 1.4; color: var(--fg); word-wrap: break-word; }
        .commit-sha { position: absolute; top: 25px; right: -100px; font-family: var(--code-font); color: var(--bg); background: var(--cyan); padding: 2px 8px; font-size: 0.8rem; transition: right var(--speed) ease; }
        @media (hover: hover) { .commit-entry:hover .commit-sha { right: 0; } }

        @keyframes dataStream {
            0%   { opacity: 0; transform: translateX(35px); border-left-width: 2px; border-left-color: var(--cyan); }
            60%  { border-left-width: 2px; }
            100% { opacity: 1; transform: translateX(0); border-left-width: 1px; }
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        #loading-msg { text-align: center; font-family: var(--code-font); font-size: 0.9rem; color: var(--cyan); animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* MOBILE */
        @media (max-width: 768px) {
            html { cursor: auto; }
            * { cursor: auto !important; }
            #cur-main, #cur-follow { display: none; }
            .back-btn { top: 20px; left: 20px; padding: 8px 15px; font-size: 0.7rem; }
            header { padding-top: 80px; margin-bottom: 30px; }
            .site-logo { height: 50px; }
            h1 { font-size: 1.5rem; }
            main { padding: 0 15px 80px 15px; }
            .commit-entry { padding: 15px; }
            .commit-msg { font-size: 1rem; }
            .commit-sha { position: relative; top: auto; right: auto; display: inline-block; margin-top: 15px; font-size: 0.7rem; }
            .commit-entry:hover { transform: none; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div id="cur-follow"></div>
    <div id="cur-main"></div>

    <a href="index.html" class="back-btn">← Back</a>

    <header>
        <img src="Recourses/Logos/DDD.jpg" alt="DDD Logo" class="site-logo">
        <h1>Deployment Log</h1>
    </header>

    <main id="log-container">
        <div class="status-bar">
            <span><span class="status-dot"></span>CONNECTING TO REPOSITORY...</span>
            <span id="repo-target">Kokomonkey/Portfolio-Website-test</span>
        </div>

        <div id="loading-msg">> FETCHING DATA STREAM...</div>

        </main>

    <script>
        // CURSOR
        (function() {
            const c1 = document.getElementById('cur-main');
            const c2 = document.getElementById('cur-follow');
            if (!c1 || !c2) return;
            let mx = innerWidth/2, my = innerHeight/2, fx = mx, fy = my, hov = false;
            document.addEventListener('mousemove', e => {
                mx = e.clientX; my = e.clientY;
                c1.style.transform = `translate(${mx-.5}px,${my-10}px)`;
            });
            (function loop() {
                fx += (mx-fx)*.09; fy += (my-fy)*.09;
                const s = hov ? 52 : 36;
                c2.style.width = s+'px'; c2.style.height = s+'px';
                c2.style.transform = `translate(${fx-s/2}px,${fy-s/2}px)`;
                requestAnimationFrame(loop);
            })();
            document.querySelectorAll('a,button').forEach(el => {
                el.addEventListener('mouseenter', () => hov = true);
                el.addEventListener('mouseleave', () => hov = false);
            });
        })();

        // CONFIGURATION
        const GITHUB_USERNAME = 'Kokomonkey';
        const GITHUB_REPO = 'Portfolio-Website-test';
        const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits`;

        const container = document.getElementById('log-container');
        const loader = document.getElementById('loading-msg');
        const statusText = document.querySelector('.status-bar span');

        // --- MAIN FUNCTION ---
        async function initLogs() {
            try {
                // 1. Attempt to fetch from GitHub
                const response = await fetch(API_URL);
                
                if (!response.ok) throw new Error('Repo not found or Rate Limit Exceeded');
                
                const data = await response.json();
                
                // 2. Clear Loader
                loader.remove();
                statusText.innerHTML = '<span class="status-dot"></span>LIVE CONNECTION ESTABLISHED';
                
                // 3. Render Real Data
                renderCommits(data);

            } catch (error) {
                console.warn("GitHub API failed, loading static backup.", error);
                
                // 4. Fallback Protocol
                loader.remove();
                statusText.innerHTML = '<span class="status-dot" style="background:orange"></span>OFFLINE MODE - STATIC LOGS';
                renderFallback();
            }
        }

        // --- RENDER REAL DATA ---
        function renderCommits(commits) {
            // Limit to last 15 commits to keep page clean
            const recentCommits = commits.slice(0, 100);

            recentCommits.forEach((item, index) => {
                const msg = item.commit.message;
                const date = new Date(item.commit.author.date).toLocaleDateString("en-US", { 
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' 
                });
                const sha = item.sha.substring(0, 7); // Short Hash
                
                createEntry(date, msg, sha, index);
            });
        }

        // --- RENDER STATIC FALLBACK ---
        function renderFallback() {
            const staticData = [
                { ver: "v0.2.0", msg: "Implemented 3D interaction engine & shadow logic", date: "Oct 24, 2023" },
                { ver: "v0.1.6", msg: "Refined navigation transitions (Flip animation)", date: "Oct 18, 2023" },
                { ver: "v0.1.5", msg: "Added mobile responsiveness constraints", date: "Oct 15, 2023" },
                { ver: "v0.1.0", msg: "Initial Commit: Brutalist Layout Structure", date: "Oct 01, 2023" }
            ];

            staticData.forEach((item, index) => {
                createEntry(item.date, `${item.ver} - ${item.msg}`, "STATIC", index);
            });
        }

        // --- HTML GENERATOR ---
        function createEntry(date, msg, sha, index) {
            const div = document.createElement('div');
            div.className = 'commit-entry';
            
            // Staggered Animation Delay (0.1s per item)
            div.style.animationDelay = `${index * 0.1}s`;

            div.innerHTML = `
                <div class="commit-header">
                    <span class="commit-date">${date}</span>
                    <span>ID: ${sha}</span>
                </div>
                <div class="commit-msg">${msg}</div>
                <div class="commit-sha">VIEW DIFF ${sha}</div>
            `;

            container.appendChild(div);
        }

        // Start the engine
        initLogs();

    </script>
</body>
</html>
