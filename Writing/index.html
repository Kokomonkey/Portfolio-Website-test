<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author's Sanctum | The Architect</title>
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f7f6; --text-color: #2d3436; --card-bg: #ffffff;
            --primary: #0984e3; --secondary: #6c5ce7; --border: #dfe6e9;
            --shadow: 0 4px 6px rgba(0,0,0,0.05); --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #1e272e; --text-color: #dcdde1; --card-bg: #2f3640;
            --primary: #74b9ff; --secondary: #a29bfe; --border: #40407a;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); padding: 20px; line-height: 1.6; }

        /* Header & Tabs */
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px 30px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 20px; }
        h1 { font-weight: 300; } h1 span { font-weight: 600; color: var(--primary); }
        .theme-switch { background: none; border: 2px solid var(--border); color: var(--text-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; background: var(--card-bg); color: var(--text-color); border-radius: 8px; cursor: pointer; font-weight: 600; opacity: 0.7; }
        .tab-btn.active { opacity: 1; background: var(--primary); color: white; }
        .tab-content { display: none; } .tab-content.active { display: block; }

        .panel { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 30px;}
        .panel h2 { margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }

        /* Forms */
        form { display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto;}
        input, select { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-color); font-family: inherit; }
        button.submit-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        .quill-editor { background: var(--bg-color); color: var(--text-color); border-radius: 0 0 8px 8px; }
        .ql-toolbar { background: var(--bg-color); border-color: var(--border) !important; border-radius: 8px 8px 0 0; }
        .ql-container { border-color: var(--border) !important; min-height: 150px; border-radius: 0 0 8px 8px; font-family: inherit;}
        [data-theme="dark"] .ql-stroke { stroke: var(--text-color); } [data-theme="dark"] .ql-fill { fill: var(--text-color); }

        /* Kanban Board */
        .kanban-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .kanban-col { background: var(--bg-color); border-radius: 8px; padding: 15px; min-height: 400px; border: 2px solid var(--border); }
        .kanban-header { font-weight: bold; text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
        .kanban-cards { min-height: 300px; display: flex; flex-direction: column; gap: 10px; }
        
        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; cursor: grab; box-shadow: var(--shadow); border-left: 4px solid var(--primary); }
        .card:active { cursor: grabbing; }
        .card h4 { margin-bottom: 5px; font-size: 1rem; }
        .delete-btn { background: #ff7675; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; float: right; font-size: 0.8rem; }

        /* Visualizers */
        #timeline-canvas { width: 100%; border: 2px solid var(--border); border-radius: 8px; background: var(--card-bg); }
        #network-canvas { width: 100%; height: 600px; border: 2px solid var(--border); border-radius: 8px; background: var(--card-bg); }
        
        /* Vis-Timeline Dark Mode Fixes */
        [data-theme="dark"] .vis-timeline { border-color: var(--border); color: var(--text-color); }
        [data-theme="dark"] .vis-item { background-color: var(--primary); border-color: var(--secondary); color: white; }
        [data-theme="dark"] .vis-time-axis .vis-text { color: var(--text-color); }

        .builder-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; background: var(--bg-color); padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>Author's <span>Sanctum</span></h1>
        <button class="theme-switch" onclick="toggleTheme()">🌓 Theme</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-hub')">✍️ The Hub</button>
        <button class="tab-btn" onclick="switchTab('tab-kanban')">📋 Kanban Board</button>
        <button class="tab-btn" onclick="switchTab('tab-timeline')">⏱️ Story Timeline</button>
        <button class="tab-btn" onclick="switchTab('tab-network')">🕸️ Character Web</button>
    </div>

    <div id="tab-hub" class="tab-content active">
        <div class="panel">
            <h2>Add to Universe</h2>
            <form id="universal-form">
                <select id="item-type" onchange="toggleFormFields()">
                    <option value="idea">Scene / Idea</option>
                    <option value="character">Character</option>
                    <option value="plot">Plot Point (Timeline)</option>
                </select>
                
                <input type="text" id="item-name" placeholder="Title or Name..." required>
                
                <select id="idea-status" style="display: block;">
                    <option value="todo">To Write</option>
                    <option value="drafting">Drafting</option>
                    <option value="editing">Editing</option>
                    <option value="done">Done</option>
                </select>

                <select id="char-role" style="display: none;">
                    <option value="protagonist">Protagonist</option>
                    <option value="antagonist">Antagonist</option>
                    <option value="supporting">Supporting</option>
                </select>

                <input type="date" id="plot-date" style="display: none;">

                <div><div id="hub-editor" class="quill-editor"></div></div>
                <button type="submit" class="submit-btn">+ Add Item</button>
            </form>
        </div>
    </div>

    <div id="tab-kanban" class="tab-content">
        <div class="panel">
            <h2>Scene & Idea Pipeline</h2>
            <div class="kanban-board">
                <div class="kanban-col">
                    <div class="kanban-header">To Write</div>
                    <div class="kanban-cards" id="kb-todo" data-status="todo"></div>
                </div>
                <div class="kanban-col">
                    <div class="kanban-header">Drafting</div>
                    <div class="kanban-cards" id="kb-drafting" data-status="drafting"></div>
                </div>
                <div class="kanban-col">
                    <div class="kanban-header">Editing</div>
                    <div class="kanban-cards" id="kb-editing" data-status="editing"></div>
                </div>
                <div class="kanban-col">
                    <div class="kanban-header">Done</div>
                    <div class="kanban-cards" id="kb-done" data-status="done"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-timeline" class="tab-content">
        <div class="panel">
            <h2>Chronological Plot</h2>
            <div id="timeline-canvas"></div>
        </div>
    </div>

    <div id="tab-network" class="tab-content">
        <div class="panel">
            <h2>Character Relationships</h2>
            
            <div class="builder-row">
                <select id="rel-from"><option>Select Character...</option></select>
                <span>feels</span>
                <input type="text" id="rel-label" placeholder="e.g., hates, loves, owes..." style="width: 200px;">
                <span>towards</span>
                <select id="rel-to"><option>Select Character...</option></select>
                <button class="submit-btn" onclick="addRelationship()" style="margin-top: 0;">Link</button>
            </div>

            <div id="network-canvas"></div>
        </div>
    </div>

    <script>
        // --- Core Data Architecture ---
        let db = {
            ideas: JSON.parse(localStorage.getItem('arch_ideas')) || [],
            chars: JSON.parse(localStorage.getItem('arch_chars')) || [],
            plot: JSON.parse(localStorage.getItem('arch_plot')) || [],
            rels: JSON.parse(localStorage.getItem('arch_rels')) || []
        };

        function generateId() { return 'id_' + Math.random().toString(36).substr(2, 9); }
        function saveData() {
            localStorage.setItem('arch_ideas', JSON.stringify(db.ideas));
            localStorage.setItem('arch_chars', JSON.stringify(db.chars));
            localStorage.setItem('arch_plot', JSON.stringify(db.plot));
            localStorage.setItem('arch_rels', JSON.stringify(db.rels));
        }

        // --- Initialization ---
        const quillHub = new Quill('#hub-editor', { theme: 'snow', modules: { toolbar: [['bold', 'italic'], [{'list': 'ordered'}, {'list': 'bullet'}]] } });

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            if (document.getElementById('tab-network').classList.contains('active')) renderNetwork();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            
            // Render specific visualizers when their tab is opened
            if (tabId === 'tab-kanban') renderKanban();
            if (tabId === 'tab-timeline') renderTimeline();
            if (tabId === 'tab-network') renderNetwork();
        }

        function toggleFormFields() {
            const type = document.getElementById('item-type').value;
            document.getElementById('idea-status').style.display = type === 'idea' ? 'block' : 'none';
            document.getElementById('char-role').style.display = type === 'character' ? 'block' : 'none';
            document.getElementById('plot-date').style.display = type === 'plot' ? 'block' : 'none';
        }

        // --- 1. The Hub (Form Submission) ---
        document.getElementById('universal-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const type = document.getElementById('item-type').value;
            
            const baseItem = {
                id: generateId(),
                title: document.getElementById('item-name').value,
                desc: quillHub.root.innerHTML
            };

            if (type === 'idea') {
                baseItem.status = document.getElementById('idea-status').value;
                db.ideas.push(baseItem);
            } else if (type === 'character') {
                baseItem.role = document.getElementById('char-role').value;
                db.chars.push(baseItem);
            } else if (type === 'plot') {
                baseItem.date = document.getElementById('plot-date').value || new Date().toISOString().split('T')[0];
                db.plot.push(baseItem);
            }

            saveData();
            quillHub.setContents([]);
            document.getElementById('item-name').value = '';
            alert("Added to Universe!");
        });

        // --- Generic Delete ---
        window.deleteItem = function(type, id) {
            if(type === 'idea') db.ideas = db.ideas.filter(i => i.id !== id);
            if(type === 'char') {
                db.chars = db.chars.filter(c => c.id !== id);
                db.rels = db.rels.filter(r => r.from !== id && r.to !== id); // clean relationships
            }
            if(type === 'plot') db.plot = db.plot.filter(p => p.id !== id);
            saveData();
            
            if (document.getElementById('tab-kanban').classList.contains('active')) renderKanban();
            if (document.getElementById('tab-timeline').classList.contains('active')) renderTimeline();
            if (document.getElementById('tab-network').classList.contains('active')) renderNetwork();
        }

        // --- 2. Kanban Board Logic (Sortable.js) ---
        function renderKanban() {
            const columns = ['todo', 'drafting', 'editing', 'done'];
            
            columns.forEach(col => {
                const container = document.getElementById(`kb-${col}`);
                container.innerHTML = ''; // Clear
                
                // Filter ideas for this column
                const colIdeas = db.ideas.filter(i => i.status === col);
                colIdeas.forEach(idea => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.dataset.id = idea.id;
                    div.innerHTML = `
                        <button class="delete-btn" onclick="deleteItem('idea', '${idea.id}')">X</button>
                        <h4>${idea.title}</h4>
                        <div style="font-size: 0.85em; opacity:0.8;">${idea.desc.replace(/<[^>]*>?/gm, '').substring(0, 50)}...</div>
                    `;
                    container.appendChild(div);
                });
            });

            // Initialize Sortable for all columns
            document.querySelectorAll('.kanban-cards').forEach(container => {
                new Sortable(container, {
                    group: 'shared', // Allows dragging between columns
                    animation: 150,
                    onEnd: function (evt) {
                        const itemEl = evt.item;
                        const newStatus = evt.to.dataset.status;
                        const ideaId = itemEl.dataset.id;
                        
                        // Update Data
                        const idea = db.ideas.find(i => i.id === ideaId);
                        if(idea) {
                            idea.status = newStatus;
                            saveData();
                        }
                    },
                });
            });
        }

        // --- 3. Timeline Logic (Vis-Timeline) ---
        let timeline = null;
        function renderTimeline() {
            const container = document.getElementById('timeline-canvas');
            container.innerHTML = ''; // Clear

            if(db.plot.length === 0) {
                container.innerHTML = "<p style='padding: 20px;'>No plot points added yet. Add some in The Hub.</p>";
                return;
            }

            const items = new vis.DataSet(db.plot.map(p => ({
                id: p.id,
                content: `<b>${p.title}</b><button class="delete-btn" style="margin-left:10px; padding:0 4px;" onclick="deleteItem('plot', '${p.id}')">X</button>`,
                start: p.date
            })));

            timeline = new vis.Timeline(container, items, {
                height: '400px',
                margin: { item: 20 }
            });
        }

        // --- 4. Character Web Logic (Vis-Network) ---
        let network = null;
        function renderNetwork() {
            // Populate Dropdowns for Relationship Builder
            const selectFrom = document.getElementById('rel-from');
            const selectTo = document.getElementById('rel-to');
            selectFrom.innerHTML = selectTo.innerHTML = '';
            
            db.chars.forEach(c => {
                selectFrom.innerHTML += `<option value="${c.id}">${c.title}</option>`;
                selectTo.innerHTML += `<option value="${c.id}">${c.title}</option>`;
            });

            const container = document.getElementById('network-canvas');
            if(db.chars.length === 0) {
                container.innerHTML = "<p style='padding: 20px;'>No characters added yet. Add some in The Hub.</p>";
                return;
            }

            const isDark = document.body.getAttribute('data-theme') === 'dark';
            
            // Build Nodes
            const nodes = new vis.DataSet(db.chars.map(c => ({
                id: c.id,
                label: c.title,
                shape: 'dot',
                size: 25,
                color: c.role === 'protagonist' ? '#00b894' : (c.role === 'antagonist' ? '#d63031' : '#0984e3'),
                font: { color: isDark ? '#fff' : '#000' }
            })));

            // Build Edges
            const edges = new vis.DataSet(db.rels.map(r => ({
                from: r.from,
                to: r.to,
                label: r.label,
                arrows: 'to',
                font: { align: 'middle', color: isDark ? '#fff' : '#000', strokeWidth: 0 }
            })));

            network = new vis.Network(container, { nodes, edges }, {
                physics: { barnesHut: { springLength: 200 } }
            });
        }

        window.addRelationship = function() {
            const from = document.getElementById('rel-from').value;
            const to = document.getElementById('rel-to').value;
            const label = document.getElementById('rel-label').value;
            
            if(!from || !to || !label) return alert("Fill all relationship fields!");
            if(from === to) return alert("A character cannot relate to themselves!");

            db.rels.push({ from, to, label });
            saveData();
            document.getElementById('rel-label').value = ''; // clear
            renderNetwork();
        }

    </script>
</body>
</html>
