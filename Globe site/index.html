<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchExplorer | Top 1000</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body { margin: 0; background: #020202; color: #ededed; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 30px; box-sizing: border-box;
        }

        header h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        header span { color: #555; font-weight: 300; }

        #info-panel {
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(10px);
            border-left: 2px solid #00ffcc; padding: 20px 30px; width: 320px;
            pointer-events: auto; transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0; transform: translateY(20px); align-self: flex-end;
        }
        
        #info-panel.visible { opacity: 1; transform: translateY(0); }

        #b-name { margin: 0 0 10px 0; font-size: 22px; font-weight: 500; }
        .meta-row { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .meta-row span { color: #fff; text-align: right; font-weight: 500; }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: -1; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 12px; letter-spacing: 2px; color: #555; text-transform: uppercase;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <div id="loading">Initializing Satellite Data...</div>
    <div id="ui-layer">
        <header>
            <h1>ArchExplorer <span>// Top 1000 Icons</span></h1>
        </header>
        
        <div id="info-panel">
            <h2 id="b-name">--</h2>
            <div class="meta-row">Architect <span id="b-arch">--</span></div>
            <div class="meta-row">Year <span id="b-year">--</span></div>
            <div class="meta-row">Global Fame Rank <span id="b-fame">--</span></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 13;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 5.5; 
        controls.maxDistance = 20;

        const radius = 5;

        // --- NEW EARTHLY TEXTURE ---
        const textureLoader = new THREE.TextureLoader();
        // Using a high-res dark earth map from a public CDN
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-dark.jpg', () => {
            document.getElementById('loading').style.opacity = 0;
        });

        const coreGlobe = new THREE.Mesh(
            new THREE.SphereGeometry(radius, 64, 64),
            new THREE.MeshBasicMaterial({ map: earthTexture })
        );
        scene.add(coreGlobe);

        // Keep a subtle atmosphere/wireframe glow
        const atmosphere = new THREE.Mesh(
            new THREE.SphereGeometry(radius + 0.1, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.05, side: THREE.BackSide })
        );
        scene.add(atmosphere);

        const markersGroup = new THREE.Group();
        scene.add(markersGroup);

        function latLonToVector3(lat, lon, r) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
        }

        // --- FETCH STATIC GEOJSON ---
        fetch('buildings.geojson')
            .then(res => res.json())
            .then(data => {
                data.features.forEach((feature, index) => {
                    const lon = feature.geometry.coordinates[0];
                    const lat = feature.geometry.coordinates[1];
                    const props = feature.properties;

                    const pos = latLonToVector3(lat, lon, radius + 0.02);
                    
                    // Upgraded marker: A tiny sleek cylinder instead of a block
                    const markerGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.15, 8);
                    // Make the top 100 buildings cyan, the rest white
                    const color = index < 100 ? 0x00ffcc : 0xffffff;
                    const markerMat = new THREE.MeshBasicMaterial({ color: color });
                    const marker = new THREE.Mesh(markerGeo, markerMat);
                    
                    marker.position.copy(pos);
                    // Orient the cylinder to point away from the center of the earth
                    marker.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
                    
                    marker.userData = props;
                    markersGroup.add(marker);
                });
            })
            .catch(err => console.error("Data load failed. Ensure local server is running.", err));

        // INTERACTION
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(markersGroup.children);
            const panel = document.getElementById('info-panel');
            
            if (intersects.length > 0) {
                const tags = intersects[0].object.userData;
                document.getElementById('b-name').innerText = tags.name;
                document.getElementById('b-arch').innerText = tags.architect;
                document.getElementById('b-year').innerText = tags.year;
                document.getElementById('b-fame').innerText = tags.fame_score;
                panel.classList.add('visible');
            } else {
                panel.classList.remove('visible');
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
