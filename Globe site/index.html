<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchExplorer | Dynamic Loading</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body { margin: 0; background: #050505; color: #ededed; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 30px; box-sizing: border-box;
        }

        header { display: flex; justify-content: space-between; align-items: flex-start; }
        header h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        header span { color: #555; font-weight: 300; }
        
        #status-indicator {
            background: rgba(255, 255, 255, 0.1); padding: 5px 10px; border-radius: 4px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #00ffcc;
            transition: opacity 0.3s; opacity: 0;
        }

        #info-panel {
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(10px);
            border-left: 2px solid #ffffff; padding: 20px 30px; width: 300px;
            pointer-events: auto; transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0; transform: translateY(20px); align-self: flex-end;
        }
        
        #info-panel.visible { opacity: 1; transform: translateY(0); }

        #b-name { margin: 0 0 10px 0; font-size: 22px; font-weight: 500; }
        .meta-row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .meta-row span { color: #fff; text-align: right; }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <header>
            <h1>ArchExplorer <span>// Global API</span></h1>
            <div id="status-indicator">Fetching Area Data...</div>
        </header>
        
        <div id="info-panel">
            <h2 id="b-name">--</h2>
            <div class="meta-row">Architect <span id="b-arch">--</span></div>
            <div class="meta-row">Year <span id="b-year">--</span></div>
            <div class="meta-row">Type <span id="b-type">--</span></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 5.2; // Don't let camera clip inside the earth
        controls.maxDistance = 15;

        // 2. GLOBE DESIGN
        const radius = 5;
        const coreGlobe = new THREE.Mesh(
            new THREE.SphereGeometry(radius, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x050505 })
        );
        scene.add(coreGlobe);

        const wireGlobe = new THREE.Mesh(
            new THREE.SphereGeometry(radius + 0.01, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x222222, wireframe: true, transparent: true, opacity: 0.5 })
        );
        scene.add(wireGlobe);

        const markersGroup = new THREE.Group();
        scene.add(markersGroup);

        // 3. MATH UTILITIES
        function latLonToVector3(lat, lon, r) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
        }

        function vector3ToLatLon(vector) {
            const normalized = vector.clone().normalize();
            const lat = 90 - (Math.acos(normalized.y) * 180 / Math.PI);
            let lon = ((Math.atan2(normalized.z, -normalized.x) * 180 / Math.PI) - 180);
            // Normalize longitude to -180 to 180
            if (lon < -180) lon += 360;
            return { lat, lon };
        }

        // 4. DYNAMIC DATA FETCHING
        let fetchTimeout = null;
        const statusEl = document.getElementById('status-indicator');

        function fetchAreaData() {
            statusEl.style.opacity = 1;

            // Find where the camera is looking
            const cameraDirection = new THREE.Vector3();
            camera.getWorldDirection(cameraDirection);
            
            // Calculate intersection with the globe
            const targetPoint = cameraDirection.multiplyScalar(radius).negate(); 
            const centerPoint = vector3ToLatLon(camera.position);

            // Create a Bounding Box around the center point based on zoom level
            const zoomRatio = (camera.position.length() - 5) / 10; // 0 (close) to 1 (far)
            const boxSize = 0.5 + (zoomRatio * 5); // Degrees of lat/lon to search
            
            const s = centerPoint.lat - boxSize;
            const w = centerPoint.lon - boxSize;
            const n = centerPoint.lat + boxSize;
            const e = centerPoint.lon + boxSize;

            const query = `
                [out:json][timeout:25];
                (
                  node["building"]["architect"](${s},${w},${n},${e});
                  way["building"]["architect"](${s},${w},${n},${e});
                );
                out center 100;
            `;

            fetch("https://overpass-api.de/api/interpreter", {
                method: "POST",
                body: "data=" + encodeURIComponent(query),
            })
            .then(res => res.json())
            .then(data => {
                // Clear old markers to prevent browser crash
                while(markersGroup.children.length > 0){ 
                    markersGroup.remove(markersGroup.children[0]); 
                }

                const elements = data.elements || [];
                elements.forEach(el => {
                    const lat = el.lat || el.center?.lat;
                    const lon = el.lon || el.center?.lon;
                    if(!lat || !lon) return;

                    const pos = latLonToVector3(lat, lon, radius + 0.05);
                    const marker = new THREE.Mesh(
                        new THREE.BoxGeometry(0.08, 0.08, 0.08),
                        new THREE.MeshBasicMaterial({ color: 0x00ffcc })
                    );
                    marker.position.copy(pos);
                    marker.lookAt(0,0,0);
                    marker.userData = el.tags;
                    markersGroup.add(marker);
                });
                statusEl.style.opacity = 0;
            })
            .catch(err => {
                console.error(err);
                statusEl.innerText = "Error Fetching Data";
                setTimeout(() => statusEl.style.opacity = 0, 2000);
            });
        }

        // DEBOUNCER: Wait 1 second after user stops moving to fetch
        controls.addEventListener('change', () => {
            clearTimeout(fetchTimeout);
            fetchTimeout = setTimeout(fetchAreaData, 1000);
        });

        // Fetch initial view on load
        setTimeout(fetchAreaData, 1000);

        // 5. INTERACTION
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(markersGroup.children);
            const panel = document.getElementById('info-panel');
            
            if (intersects.length > 0) {
                const tags = intersects[0].object.userData;
                document.getElementById('b-name').innerText = tags.name || "Unnamed Structure";
                document.getElementById('b-arch').innerText = tags.architect || "Unknown";
                document.getElementById('b-year').innerText = tags.start_date || tags.year || "N/A";
                document.getElementById('b-type').innerText = tags.building || "Building";
                panel.classList.add('visible');
            } else {
                panel.classList.remove('visible');
            }
        });

        // 6. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
