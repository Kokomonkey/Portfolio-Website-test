<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchExplorer | V2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body { margin: 0; background: #0a0a0a; color: #ededed; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 30px; box-sizing: border-box;
        }

        header h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        header span { color: #555; font-weight: 300; }

        #info-panel {
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(10px);
            border-left: 2px solid #ffffff; padding: 20px 30px; width: 300px;
            pointer-events: auto; transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0; transform: translateY(20px); align-self: flex-end;
        }
        
        #info-panel.visible { opacity: 1; transform: translateY(0); }

        #b-name { margin: 0 0 10px 0; font-size: 22px; font-weight: 500; }
        .meta-row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .meta-row span { color: #fff; text-align: right; }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <header>
            <h1>ArchExplorer <span>// Global Database</span></h1>
        </header>
        
        <div id="info-panel">
            <h2 id="b-name">--</h2>
            <div class="meta-row">Architect <span id="b-arch">--</span></div>
            <div class="meta-row">Year <span id="b-year">--</span></div>
            <div class="meta-row">Style <span id="b-style">--</span></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.04);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 14;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 6;
        controls.maxDistance = 20;

        // Architectural Globe Design (Solid core + Wireframe cage)
        const radius = 5;
        
        // Solid dark core
        const coreGeo = new THREE.SphereGeometry(radius, 64, 64);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
        const coreGlobe = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreGlobe);

        // Blueprint wireframe
        const wireGeo = new THREE.SphereGeometry(radius + 0.01, 32, 32);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x222222, wireframe: true, transparent: true, opacity: 0.5 });
        const wireGlobe = new THREE.Mesh(wireGeo, wireMat);
        scene.add(wireGlobe);

        // Lat/Lon Math
        function latLonToVector3(lat, lon, r) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
        }

        const markers = new THREE.Group();
        scene.add(markers);

        // FETCH GEOJSON DATA
        fetch('buildings.geojson')
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok. Are you running a local server?");
                return response.json();
            })
            .then(data => {
                data.features.forEach(feature => {
                    // GeoJSON format is [Longitude, Latitude]
                    const lon = feature.geometry.coordinates[0];
                    const lat = feature.geometry.coordinates[1];
                    const props = feature.properties;

                    const pos = latLonToVector3(lat, lon, radius + 0.05);
                    
                    // Minimalist square markers
                    const markerGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const marker = new THREE.Mesh(markerGeo, markerMat);
                    
                    marker.position.copy(pos);
                    marker.lookAt(0,0,0); // Align boxes to face the center of the earth
                    marker.userData = props; // Store GeoJSON properties in the mesh
                    markers.add(marker);
                });
            })
            .catch(error => console.error("Failed to load buildings.geojson:", error));

        // Raycasting for Interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers.children);

            const panel = document.getElementById('info-panel');
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                document.getElementById('b-name').innerText = data.name || "Unknown Building";
                document.getElementById('b-arch').innerText = data.architect || "Unknown";
                document.getElementById('b-year').innerText = data.year || "N/A";
                document.getElementById('b-style').innerText = data.style || "N/A";
                panel.classList.add('visible');
            } else {
                panel.classList.remove('visible');
            }
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
