<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Mind</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f4f7f6; }
        header { background: var(--primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 1rem; }
        .material-item { border-bottom: 1px solid #eee; padding: 1rem 0; display: flex; justify-content: space-between; }
        .material-item img { height: 50px; width: 50px; object-fit: cover; border-radius: 4px; margin-right: 10px; }
        
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #ddd; }
        button { background: var(--accent); color: white; border: none; cursor: pointer; }
        button:hover { opacity: 0.9; }
        
        #chat-log { height: 300px; overflow-y: scroll; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin-bottom: 5px; padding: 5px 10px; border-radius: 4px; }
        .msg.user { background: #e1f5fe; text-align: right; }
        .msg.ai { background: #e8f5e9; }
    </style>
</head>
<body>

<header>
    <h1>🏗️ Material Mind</h1>
    <button onclick="document.getElementById('req-modal').style.display='block'">+ Request New Material</button>
</header>

<div class="container grid">
    <div>
        <h2>📚 Material Database</h2>
        <div id="material-list" class="card">
            <p>Loading...</p>
        </div>
    </div>

    <div>
        <h2>🧠 Local Architect AI</h2>
        <div class="card">
            <div id="chat-log"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="chat-input" placeholder="Ask about insulation values..." style="flex:1;">
                <button onclick="sendMessage()">Ask</button>
            </div>
        </div>
    </div>
</div>

<div id="req-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
    <div class="card" style="margin: 10% auto; max-width: 400px;">
        <h3>Request Material</h3>
        <input type="text" id="req-name" placeholder="Material Name (e.g. Aerogel)" style="width:90%; margin-bottom:10px;">
        <input type="text" id="req-user" placeholder="Your Name" style="width:90%; margin-bottom:10px;">
        <button onclick="submitRequest()" style="width:100%">Submit to Queue</button>
        <button onclick="document.getElementById('req-modal').style.display='none'" style="width:100%; background:#999; margin-top:5px;">Close</button>
    </div>
</div>

<script>
    // 1. Fetch Materials
    async function loadMaterials() {
        const res = await fetch('/api/materials');
        const data = await res.json();
        const container = document.getElementById('material-list');
        container.innerHTML = data.map(m => `
            <div class="material-item">
                <div style="display:flex; align-items:center;">
                    ${m.image_path ? `<img src="${m.image_path}">` : ''}
                    <div>
                        <strong>${m.name}</strong><br>
                        <small>${m.category}</small>
                    </div>
                </div>
                <a href="${m.pdf_path}" target="_blank"><button>📄 PDF</button></a>
            </div>
        `).join('');
    }

    // 2. Chat Logic
    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const log = document.getElementById('chat-log');
        const q = input.value;
        if(!q) return;

        log.innerHTML += `<div class="msg user">You: ${q}</div>`;
        input.value = '';

        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: q})
        });
        const data = await res.json();
        log.innerHTML += `<div class="msg ai">🤖: ${data.answer}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    // 3. Request Logic
    async function submitRequest() {
        const name = document.getElementById('req-name').value;
        const user = document.getElementById('req-user').value;
        await fetch('/api/request', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, user})
        });
        alert("Request Queued!");
        document.getElementById('req-modal').style.display='none';
    }

    loadMaterials();
</script>

</body>
</html>
