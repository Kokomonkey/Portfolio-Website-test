<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marktplaats DealScanner — Bordspellen</title>
<style>
  :root {
    --bg: #0f1216;
    --card: #1a1f27;
    --card2: #222933;
    --text: #e8eaed;
    --muted: #9aa4b2;
    --accent: #4ea1ff;
    --good: #38c172;
    --border: #2a323d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  h1 span { color: var(--muted); font-weight: 400; }
  .controls { display: flex; align-items: center; gap: 14px; }
  #status { color: var(--muted); font-size: 13px; min-height: 18px; }
  button {
    background: var(--accent);
    color: #05243f;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 650;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 20px 24px 60px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .thumb {
    height: 150px;
    background: var(--card2) center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { font-size: 14px; font-weight: 600; }
  .title a { color: var(--text); text-decoration: none; }
  .title a:hover { color: var(--accent); }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .price { font-size: 15px; font-weight: 650; }
  .rating {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(56,193,114,.12);
    color: var(--good);
    padding: 4px 9px; border-radius: 20px;
    font-size: 13px; font-weight: 650;
  }
  .rating.none { background: rgba(154,164,178,.12); color: var(--muted); font-weight: 500; }
  .bgg { font-size: 11px; color: var(--muted); }
  .bgg a { color: var(--accent); text-decoration: none; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .spinner {
    width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: #05243f; border-radius: 50%;
    display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rank {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.7); color: #fff;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; border: 1px solid rgba(255,255,255,.25);
  }
  .card { position: relative; }
  .progress-wrap { max-width: 420px; margin: 40px auto 0; }
  .bar { height: 8px; background: var(--card2); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .progress-text { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; }
  .rating { font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1>🎲 Marktplaats DealScanner <span>· bordspellen op BGG-rating</span></h1>
  <div class="controls">
    <span id="status"></span>
    <button id="scanBtn">Scan</button>
  </div>
</header>
<main>
  <div id="results" class="grid"></div>
  <div id="empty" class="empty">Klik op <b>Scan</b>. Ik doorzoek de nieuwste 200 bordspel-advertenties, koppel ze aan hun BGG-rating en toon de <b>top 10</b>.</div>
</main>

<script>
const btn = document.getElementById("scanBtn");
const statusEl = document.getElementById("status");
const grid = document.getElementById("results");
const empty = document.getElementById("empty");

btn.addEventListener("click", runScan);

async function runScan() {
  btn.disabled = true;
  grid.innerHTML = "";
  empty.style.display = "none";
  statusEl.innerHTML = '<span class="spinner"></span>Bezig met scannen…';
  try {
    const res = await fetch("/api/scan");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
    statusEl.textContent = `${data.scanned} gescand · ${data.ratedCount} met rating · top ${data.top.length} · ${new Date(data.scannedAt).toLocaleTimeString("nl-NL")}`;
  } catch (e) {
    statusEl.textContent = "Fout: " + e.message;
    empty.style.display = "block";
    empty.innerHTML = "Er ging iets mis: <b>" + e.message + "</b>.<br>Check de terminal voor details.";
  } finally {
    btn.disabled = false;
  }
}

function render(data) {
  const rows = data.top || [];
  if (!rows.length) {
    empty.style.display = "block";
    empty.innerHTML = `Geen advertenties met BGG-rating gevonden onder de ${data.scanned} gescande. Probeer opnieuw of verlaag <code>minBggVotes</code> in server.js.`;
    return;
  }
  grid.innerHTML = rows.map((r, i) => cardHtml(r, i + 1)).join("");
}

function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
}

function cardHtml(r, rank) {
  const thumb = r.image
    ? `<div class="thumb" style="background-image:url('${esc(r.image)}')"></div>`
    : `<div class="thumb">geen foto</div>`;
  const bggLine = r.bggUrl
    ? `<div class="bgg">${esc(r.matchedName || "")}${r.bggRank ? " · BGG #"+r.bggRank : ""}${r.bggYear ? " ("+r.bggYear+")" : ""} · ${r.bggVotes.toLocaleString("nl-NL")} stemmen · <a href="${esc(r.bggUrl)}" target="_blank">BGG</a></div>`
    : "";
  return `
  <div class="card">
    <div class="rank">${rank}</div>
    ${thumb}
    <div class="body">
      <div class="title"><a href="${esc(r.url)}" target="_blank">${esc(r.title)}</a></div>
      ${bggLine}
      <div class="meta">${esc(r.location)}${r.location && r.date ? " · " : ""}${esc(r.date)}</div>
      <div class="row">
        <span class="price">${esc(r.priceLabel)}</span>
        <span class="rating">★ ${r.bggRating.toFixed(1)}</span>
      </div>
    </div>
  </div>`;
}
</script>
</body>
</html>
