<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Recourses/Logos/DDD.jpg">
    <title>Ideation | AI Framework</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --dim-color: #666666;
            --square-size: min(20vw, 25vh); /* Smaller squares for sub-menu */
            --header-height: 15vh;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- NAVIGATION --- */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent-color);
            font-size: 0.9rem;
            text-transform: uppercase;
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .logo-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--accent-color);
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 4vh;
            margin-top: 8vh;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h2 {
            font-size: 1rem;
            color: var(--dim-color);
            font-weight: 400;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
        }

        /* --- SUB GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; /* Added gap for sub-pages for legibility */
            width: fit-content;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: var(--square-size);
            height: var(--square-size);
            border: 1px solid var(--dim-color);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        /* CONTENT STYLING */
        .sub-number {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: var(--dim-color);
            margin-bottom: 10px;
            transition: color 0.3s;
        }

        .sub-title {
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 1px;
            padding: 0 10px;
        }

        /* HOVER */
        .grid-item:hover {
            border-color: var(--accent-color);
            background-color: var(--accent-color);
            transform: translateY(-5px);
        }

        .grid-item:hover .sub-title { color: var(--bg-color); }
        .grid-item:hover .sub-number { color: var(--bg-color); font-weight: bold; }

    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Framework</a>
        <img src="Recourses/Logos/DDD.jpg" alt="DDD Logo" class="logo-small">
    </nav>

    <header>
        <h1>Ideation</h1>
        <h2>2.0 Phase</h2>
    </header>

    <main>
        <div class="grid-container">
            
            <a href="#" class="grid-item">
                <span class="sub-number">2.1</span>
                <span class="sub-title">Concept<br>Generation</span>
            </a>

            <a href="#" class="grid-item">
                <span class="sub-number">2.2</span>
                <span class="sub-title">Sketch<br>Analysis</span>
            </a>

            <a href="#" class="grid-item">
                <span class="sub-number">2.3</span>
                <span class="sub-title">Prompt<br>Engineering</span>
            </a>

            <a href="#" class="grid-item">
                <span class="sub-number">2.4</span>
                <span class="sub-title">Style<br>Transfer</span>
            </a>

            <a href="#" class="grid-item">
                <span class="sub-number">2.5</span>
                <span class="sub-title">Iterative<br>Looping</span>
            </a>

            <a href="#" class="grid-item">
                <span class="sub-number">2.6</span>
                <span class="sub-title">Selection</span>
            </a>

        </div>
    </main>

</body>
</html>
