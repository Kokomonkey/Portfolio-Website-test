    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --transition-speed: 0.3s;
            
            /* NEW DIMENSIONS BASED ON VERTICALITY (vh) */
            --header-height: 15vh;     /* Header is exactly 15% of screen */
            --square-size: 20vh;       /* Squares are 20% of screen height */
            --gap-size: 2vh;           /* Gaps are small relative to height */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* FORCE NO SCROLLING */
            height: 100vh; 
            overflow: hidden; 
            justify-content: center; /* Center everything vertically */
        }

        /* --- BACK BUTTON --- */
        .back-btn {
            position: fixed;
            top: 2vh;
            left: 2vh; /* Adjusted to vh for consistency */
            text-decoration: none;
            z-index: 100;
            border: 2px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 1vh 2vh; /* Responsive padding */
            font-weight: bold;
            text-transform: uppercase;
            font-size: 2vh; 
            transition: all var(--transition-speed) ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- HEADER SECTION (Strict 15vh) --- */
        header {
            height: var(--header-height);
            display: flex;
            flex-direction: row; /* Side-by-side to save vertical space */
            align-items: center;
            justify-content: center;
            gap: 2vh;
            margin-bottom: 4vh; /* Space between header and grid */
        }

        .logo-placeholder {
            /* Logo scales with height */
            height: 10vh; 
            width: 10vh; 
            background-color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            filter: invert(1);
        }
        
        /* Adjust image inside logo to fit */
        .logo-placeholder img {
            max-height: 100%;
            width: auto;
        }

        h1 {
            font-size: 4vh; /* Text scales with height */
            letter-spacing: 0.5vh;
            text-transform: uppercase;
            font-weight: 700;
            line-height: 1;
        }

        /* --- GRID SECTION --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: var(--gap-size); 
            width: fit-content;
        }

        /* --- INTERACTIVE SQUARES --- */
        .grid-item {
            display: block; 
            text-decoration: none;
            
            /* ENTRANCE ANIMATION SETTINGS */
            opacity: 0; 
            animation-duration: 2s; 
            animation-timing-function: cubic-bezier(0.16, 1, 0.5, 1); 
            animation-fill-mode: forwards;
        }
        
        /* Style for WIP triggers to look clickable */
        .wip-trigger {
            cursor: pointer;
        }

        .square {
            /* SIZE BASED ON HEIGHT NOW */
            width: var(--square-size);
            height: var(--square-size);
            
            background-color: var(--bg-color); 
            border: 2px solid var(--accent-color); 
            display: flex;
            justify-content: center;
            align-items: center; 
            transition: all var(--transition-speed) ease;
            cursor: pointer;
            overflow: hidden;
            position: relative; 
        }

        .square-icon {
            width: 50%;
            height: 50%;
            background-color: var(--accent-color); 
            transition: all var(--transition-speed) ease;
        }
        
        /* UPDATED: If using IMG tag for icon */
        .square-img {
            width: 100%;        /* Changed from 50% to fill square */
            height: 100%;       /* Changed from auto to fill square */
            object-fit: cover;  /* Ensures image fills without stretching */
            transition: all var(--transition-speed) ease;
            filter: invert(1);  /* Assuming black PNGs/JPGs */
        }

        .square-text {
            position: absolute;
            bottom: 5%; 
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            
            /* UPDATED: Default color is White (accent) */
            color: var(--accent-color); 
            font-weight: bold;
            text-transform: uppercase;
            
            /* Text size relative to the square height */
            font-size: calc(var(--square-size) / 9);
            
            /* UPDATED: Visible by default */
            opacity: 1;
            transform: translateY(0); 
            transition: all var(--transition-speed) ease;
        }

        /* --- HOVER EFFECTS --- */
        .grid-item:hover .square {
            transform: scale(1.05); /* Reduced scale slightly to prevent overlap */
            background-color: var(--accent-color); 
            border-color: var(--accent-color);
            z-index: 8; 
        }

        .grid-item:hover .square-icon {
            background-color: var(--bg-color); 
            transform: translateY(-15%); 
        }
        
        .grid-item:hover .square-img {
            filter: none;
            transform: translateY(-7%);
        }

        .grid-item:hover .square-text {
            /* UPDATED: Invert text color to Black (bg-color) on hover */
            color: var(--bg-color);
            opacity: 1; 
            transform: translateY(0);
        }

        /* --- MODAL (POPUP) STYLES --- */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; 
            z-index: 200; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.8); /* Black w/ opacity */
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--bg-color);
            border: 2px solid var(--accent-color);
            padding: 4vh;
            width: 80%;
            max-width: 500px;
            text-align: center;
            position: relative;
            animation: slideFromBottom 0.5s ease;
        }

        .close-btn {
            color: var(--accent-color);
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: #ccc;
        }

        .modal-text {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin-bottom: 3vh;
            line-height: 1.5;
        }

        .modal-contact-btn {
            display: inline-block;
            padding: 1vh 3vh;
            border: 2px solid var(--accent-color);
            background-color: var(--bg-color);
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: all var(--transition-speed) ease;
        }

        .modal-contact-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- ANIMATION KEYFRAMES --- */
        @keyframes slideFromTop { 0% { transform: translateY(-100vh); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes slideFromBottom { 0% { transform: translateY(100vh); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes slideFromLeft { 0% { transform: translateX(-100vw); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes slideFromRight { 0% { transform: translateX(100vw); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

        /* --- VISITOR COUNTER --- */
        .visitor-counter {
            position: fixed;
            bottom: 2vh;
            right: 2vh;
            color: var(--accent-color);
            background-color: var(--bg-color);
            border: 2px solid var(--accent-color);
            padding: 1vh 2vh;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1vh; 
            z-index: 100;
            display: flex;
            gap: 1vh;
            transition: all var(--transition-speed) ease;
        }

        .visitor-counter:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- MOBILE RESPONSIVENESS (Add this at the bottom of your CSS) --- */
        @media (max-width: 768px) {
            
            /* 1. ALLOW SCROLLING */
            body {
                height: auto;           /* Let page grow as needed */
                min-height: 100vh;      /* At least full screen */
                overflow-y: auto;       /* Enable vertical scrolling */
                padding-bottom: 50px;   /* Add space at the bottom */
                display: block;         /* Stack elements normally */
            }

            /* 2. ADJUST HEADER */
            header {
                height: auto;           /* Let header grow naturally */
                padding: 20px 0;
                flex-direction: column; /* Stack Logo and Text vertically */
                margin-bottom: 20px;
            }

            h1 {
                font-size: 2rem;        /* Readable pixel size instead of vh */
                margin-top: 10px;
                text-align: center;
                color: white;
            }

            /* 3. CHANGE GRID TO 2 COLUMNS */
            .grid-container {
                grid-template-columns: repeat(2, 1fr); /* 2 Columns instead of 3 */
                width: 90%;             /* Use 90% of screen width */
                margin: 0 auto;         /* Center the grid */
                gap: 15px;              /* Smaller gap */
            }

            /* 4. SQUARE SIZING */
            .square {
                /* Make squares based on Width, not Height */
                width: 100%;            
                height: 40vw;           /* Squares are 40% of screen width */
                border-width: 1px;      /* Thinner borders look better on mobile */
                filter: invert();
            }

            /* 5. TEXT ALWAYS VISIBLE (No Hover needed) */
            .square-text {
                opacity: 1;             /* Always show text */
                transform: translateY(0);
                font-size: 0.8rem;
                /* Background removed to match requested style, 
                   but keeping text contrast is important */
                bottom: 5%;
                color: black; /* Inverted due to square filter on mobile */
            }
            
            /* Optional: Adjust image visibility if text covers it */
            .square-img {
                filter: none;           /* Don't invert colors by default if preferred */
            }
        }

    </style>
</head>
<body>

    <header>
        <div class="logo-placeholder">

    <main>

                <div class="square">
                    <img src="Recourses/Logos/Index/About.jpg" alt="About Logo" class="square-img">
                    <span class="square-text">About</span>

            </a>

            <a href="testSites.html" class="grid-item">

            <a href="updates.html" class="grid-item">
                <div class="square">
                    <img src="Recourses/Logos/Index/Updates.jpg" alt="Blog Logo" class="square-img">

        <div class="modal-content">
            <span class="close-btn">&times;</span>

            <a href="contact.html" class="modal-contact-btn">Contact Me</a>
        </div>
    </div>

</body>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // --- 1. GRID ANIMATION LOGIC ---
        const squares = document.querySelectorAll('.grid-item');
        const animations = [
            'slideFromTop', 
            'slideFromBottom', 
            'slideFromLeft', 
            'slideFromRight'
        ];

        squares.forEach((square) => {
            const randomIndex = Math.floor(Math.random() * animations.length);
            square.style.animationName = animations[randomIndex];
        });

        // --- 2. POPUP LOGIC ---
        const modal = document.getElementById("wip-modal");
        const triggers = document.querySelectorAll(".wip-trigger");
        const closeBtn = document.querySelector(".close-btn");

        if (modal && triggers.length > 0) {
            triggers.forEach(trigger => {
                trigger.addEventListener("click", () => {
                    modal.style.display = "flex";
                });
            });
            closeBtn.addEventListener("click", () => {
                modal.style.display = "none";
            });
            window.addEventListener("click", (event) => {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            });
        }

        // --- 3. SMART UNIQUE VISITOR COUNTER ---
        const counterDisplay = document.getElementById('visit-count');
        const namespace = 'douwedoesdesign';
        const key = 'homepage';
        
        // Get today's date as a string (e.g., "2023-10-27")
        const today = new Date().toISOString().split('T')[0];
        
        // Check local storage for the last visit date
        const lastVisitDate = localStorage.getItem('ddd_last_visit');

        let apiUrl = '';

        if (lastVisitDate === today) {
            // CASE A: They have already visited today.
            // We use the READ-ONLY endpoint (no '/up' at the end)
            // This gets the number without adding to it.
            apiUrl = `https://api.counterapi.dev/v1/${namespace}/${key}/`;
            console.log("Welcome back! Not counting you twice today");
        } else {
            // CASE B: First visit of the day (or ever).
            // We use the '/up' endpoint to increment the count.
            apiUrl = `https://api.counterapi.dev/v1/${namespace}/${key}/up`;
            
            // Save today's date so we don't count them again until tomorrow
            localStorage.setItem('ddd_last_visit', today);
            console.log("New visitor (or new day)! Count incremented.");
        }
        
        // Execute the Fetch
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                counterDisplay.innerText = data.count;
            })
            .catch(error => {
                console.error('Error loading counter:', error);
                counterDisplay.innerText = "ERR";
            });
    });
</script>
