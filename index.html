    <style>
        /* ── VARIABLES & RESET ─────────────────────────────── */
        :root {
            --bg:             #0a1628;
            --fg:             #ffffff;
            --cyan:           #00c8ff;
            --cyan-dim:       rgba(0, 200, 255, 0.18);
            --grid-major:     rgba(0, 200, 255, 0.07);
            --grid-minor:     rgba(0, 200, 255, 0.025);
            --speed:          0.3s;
            --header-h:       15vh;
            --sq:             20vh;
            --gap:            2vh;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { cursor: none; }
        * { cursor: none !important; }

        body {
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--grid-major) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
                linear-gradient(var(--grid-minor) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            color: var(--fg);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            justify-content: center;
        }

        /* ── CUSTOM CURSOR ─────────────────────────────────── */
        /* Main: white crosshair dot — thin vertical line is the element itself */
        #cur-main {
            position: fixed;
            pointer-events: none;
            z-index: 10001;
            top: 0; left: 0;
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.92);
            will-change: transform;
        }
        /* Horizontal bar of the crosshair */
        #cur-main::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 1px;
            background: rgba(255, 255, 255, 0.92);
            transform: translate(-50%, -50%);
        }
        /* Center dot */
        #cur-main::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Follower: lagging cyan square — CAD selection box */
        #cur-follow {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            top: 0; left: 0;
            width: 36px;
            height: 36px;
            border: 1px solid var(--cyan);
            opacity: 0.75;
            will-change: transform, width, height;
            transition: width 0.15s ease, height 0.15s ease, opacity 0.2s ease;
        }

        @keyframes tileReveal {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── HEADER ────────────────────────────────────────── */
        header {
            height: var(--header-h);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2vh;
            margin-bottom: 4vh;
        }

        .logo-placeholder {
            height: 10vh;
            width: 10vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-placeholder img {
            max-height: 100%; width: auto;
            filter: invert(1);
            mix-blend-mode: screen;
            opacity: 0.35;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }

        /* Dimension-line markers flanking the title */
        .h1-rule {
            display: flex;
            align-items: center;
        }

        h1 {
            font-size: 4vh;
            letter-spacing: 0.5vh;
            text-transform: uppercase;
            font-weight: 700;
            line-height: 1;
        }

        .roadmap-btn {
            margin-top: 1vh;
            font-size: 1.5vh;
            text-decoration: none;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 0.5vh 1.5vh;
            text-transform: uppercase;
            font-weight: bold;
            transition: all var(--speed) ease;
            letter-spacing: 0.2vh;
        }
        .roadmap-btn:hover {
            background-color: var(--cyan);
            color: var(--bg);
        }

        /* ── GRID ──────────────────────────────────────────── */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            width: fit-content;
        }

        .grid-item {
            display: block;
            text-decoration: none;
            opacity: 0;
            animation: tileReveal 0.4s cubic-bezier(0.16, 1, 0.5, 1) forwards;
        }
        .grid-item:nth-child(1) { animation-delay: 0.04s; }
        .grid-item:nth-child(2) { animation-delay: 0.09s; }
        .grid-item:nth-child(3) { animation-delay: 0.14s; }
        .grid-item:nth-child(4) { animation-delay: 0.19s; }
        .grid-item:nth-child(5) { animation-delay: 0.24s; }
        .grid-item:nth-child(6) { animation-delay: 0.29s; }
        .grid-item:nth-child(7) { animation-delay: 0.34s; }
        .grid-item:nth-child(8) { animation-delay: 0.39s; }
        .grid-item:nth-child(9) { animation-delay: 0.44s; }

        /* ── SQUARE TILES ──────────────────────────────────── */
        .square {
            width: var(--sq);
            height: var(--sq);
            background-color: rgba(10, 22, 40, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: border-color var(--speed) ease,
                        box-shadow var(--speed) ease,
                        background-color var(--speed) ease;
            position: relative;
            overflow: hidden;
        }

        /* Architectural corner tick-marks */
        .cm {
            position: absolute;
            width: 7px; height: 7px;
            border-style: solid;
            border-color: var(--cyan);
            border-width: 0;
            opacity: 0;
            transition: opacity var(--speed) ease;
            z-index: 5;
            pointer-events: none;
        }
        .cm.tl { top: 5px;    left: 5px;  border-top-width: 1px; border-left-width: 1px; }
        .cm.tr { top: 5px;    right: 5px; border-top-width: 1px; border-right-width: 1px; }
        .cm.bl { bottom: 5px; left: 5px;  border-bottom-width: 1px; border-left-width: 1px; }
        .cm.br { bottom: 5px; right: 5px; border-bottom-width: 1px; border-right-width: 1px; }

        .square-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter var(--speed) ease, transform var(--speed) ease;
            filter: invert(1);
        }

        .square-text {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: var(--fg);
            font-weight: bold;
            text-transform: uppercase;
            font-size: calc(var(--sq) / 9);
            transition: color var(--speed) ease;
        }

        /* Small entry arrow — top-right on hover */
        .square-enter {
            position: absolute;
            top: 7%; right: 7%;
            font-size: calc(var(--sq) / 17);
            color: var(--cyan);
            opacity: 0;
            letter-spacing: 0.08em;
            transition: opacity var(--speed) ease;
            z-index: 10;
        }

        /* ── HOVER ─────────────────────────────────────────── */
        .grid-item:hover .square {
            border-color: var(--cyan);
            box-shadow: 0 0 18px var(--cyan-dim), inset 0 0 28px rgba(0, 200, 255, 0.04);
            background-color: rgba(0, 18, 36, 0.92);
        }
        .grid-item:hover .cm          { opacity: 1; }
        .grid-item:hover .square-img  { transform: translateY(-8%); filter: invert(1) brightness(1.12); }
        .grid-item:hover .square-text { color: var(--cyan); }
        .grid-item:hover .square-enter{ opacity: 0.7; }

        /* ── MODAL ─────────────────────────────────────────── */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.82);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: var(--bg);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 30px var(--cyan-dim);
            padding: 4vh;
            width: 80%;
            max-width: 500px;
            text-align: center;
            position: relative;
            animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.5, 1) forwards;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .close-btn {
            color: var(--fg);
            position: absolute;
            top: 10px; right: 20px;
            font-size: 2rem;
            font-weight: bold;
            line-height: 1;
        }
        .close-btn:hover { color: var(--cyan); }
        .modal-text {
            color: var(--fg);
            font-size: 1.1rem;
            margin-bottom: 3vh;
            line-height: 1.6;
        }
        .modal-contact-btn {
            display: inline-block;
            padding: 1vh 3vh;
            border: 1px solid var(--fg);
            background-color: transparent;
            color: var(--fg);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: all var(--speed) ease;
        }
        .modal-contact-btn:hover {
            background-color: var(--cyan);
            border-color: var(--cyan);
            color: var(--bg);
        }

        /* ── VISITOR COUNTER ───────────────────────────────── */
        .visitor-counter {
            position: fixed;
            bottom: 2vh; right: 2vh;
            color: var(--cyan);
            background-color: rgba(10, 22, 40, 0.85);
            border: 1px solid var(--cyan);
            padding: 1vh 2vh;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1vh;
            z-index: 100;
            display: flex;
            gap: 1vh;
            letter-spacing: 0.06em;
            transition: all var(--speed) ease;
        }
        .visitor-counter:hover {
            background-color: var(--cyan);
            color: var(--bg);
        }

        /* ── MOBILE ────────────────────────────────────────── */
        @media (max-width: 768px) {
            html { cursor: auto; }
            * { cursor: auto !important; }
            #cur-main, #cur-follow { display: none; }

            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
                padding-bottom: 50px;
                display: block;
            }
            header {
                height: auto;
                padding: 20px 0;
                flex-direction: column;
                margin-bottom: 20px;
            }
            h1 { font-size: 2rem; margin-top: 10px; text-align: center; }
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                width: 90%;
                margin: 0 auto;
                gap: 15px;
            }
            .square {
                width: 100%;
                height: 40vw;
                border-width: 1px;
            }
            .square-text { font-size: 0.8rem; }
            .square-img { filter: invert(1); }
            .title-container { align-items: center; }
            .grid-item { opacity: 1; animation: none; }
        }
    </style>
</head>
<body>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // ── 1. CUSTOM CURSOR ────────────────────────────────────────
    const curMain   = document.getElementById('cur-main');
    const curFollow = document.getElementById('cur-follow');

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let fx = mx, fy = my;
    let hovering = false;

    document.addEventListener('mousemove', e => {
        mx = e.clientX;
        my = e.clientY;
        // Main cursor tracks exactly — offset so center of crosshair is at pointer
        curMain.style.transform = `translate(${mx - 0.5}px, ${my - 10}px)`;
    });

    // Follower lerps behind with a CAD-selection-box feel
    const LERP = 0.09;
    (function loop() {
        fx += (mx - fx) * LERP;
        fy += (my - fy) * LERP;
        const sz = hovering ? 52 : 36;
        curFollow.style.width  = sz + 'px';
        curFollow.style.height = sz + 'px';
        curFollow.style.transform = `translate(${fx - sz * 0.5}px, ${fy - sz * 0.5}px)`;
        requestAnimationFrame(loop);
    })();

    // Grow follower when over interactive elements
    document.querySelectorAll('a, button, .wip-trigger, .close-btn').forEach(el => {
        el.addEventListener('mouseenter', () => hovering = true);
        el.addEventListener('mouseleave', () => hovering = false);
    });

    // ── 3. MODAL LOGIC ───────────────────────────────────────────
    const modal    = document.getElementById('wip-modal');
    const triggers = document.querySelectorAll('.wip-trigger');
    const closeBtn = document.querySelector('.close-btn');

    if (modal && triggers.length > 0) {
        triggers.forEach(t => t.addEventListener('click', () => modal.style.display = 'flex'));
        closeBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
    }

    // ── 3.5 SECRET PASSCODES ────────────────────────────────────
    // 'Kloef' → opens the private life tracker (auto-unlocked)
    // 'Angus' → opens shared archive page as Ilian (purple)
    (function () {
        const CODES = {
            'Kloef': 'pages/tracker/index.html',
            'Angus': 'archive/kloef.html?as=ilian',
            'Koko':  'koko.html',
        };
        const MAX_LEN = Math.max(...Object.keys(CODES).map(s => s.length));
        let buffer = '';
        document.addEventListener('keydown', e => {
            const tag = (e.target && e.target.tagName) || '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
            if (e.key.length !== 1) return;
            buffer += e.key;
            if (buffer.length > MAX_LEN) buffer = buffer.slice(-MAX_LEN);
            for (const code in CODES) {
                if (buffer.endsWith(code)) {
                    buffer = '';
                    if (CODES[code].indexOf('tracker') !== -1) {
                        try { sessionStorage.setItem('kloefUnlocked', '1'); } catch (_) {}
                    }
                    window.location.href = CODES[code];
                    return;
                }
            }
        });
    })();

    // ── 4. VISITOR COUNTER ───────────────────────────────────────
    const counter    = document.getElementById('visit-count');
    const namespace  = 'douwedoesdesign';
    const key        = 'homepage';
    const today      = new Date().toISOString().split('T')[0];
    const lastVisit  = localStorage.getItem('ddd_last_visit');
    const cached     = localStorage.getItem('ddd_cached_count');

    if (cached) counter.innerText = cached;

    if (lastVisit === today) {
        if (!cached) counter.innerText = 'N/A';
    } else {
        localStorage.setItem('ddd_last_visit', today);
        fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`)
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(d => {
                counter.innerText = d.count;
                localStorage.setItem('ddd_cached_count', d.count);
            })
            .catch(() => { if (!cached) counter.innerText = 'N/A'; });
    }
});
</script>
